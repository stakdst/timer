<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<title>Study Timer</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #080808;
    color: #f5f5f7;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        sans-serif;

    overflow: hidden;

    touch-action: manipulation;
    overscroll-behavior: none;

    -webkit-touch-callout: none;
}

button,
input,
select {
    font-family: inherit;
}

button {
    border: none;
    outline: none;
    cursor: pointer;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100dvh;

    min-height: 0;

    /*
     * iPhoneのノッチ / Dynamic Island対策。
     *
     * 上：
     *   最低16px + safe area
     *
     * 下：
     *   safe area + 最低24px
     */
    padding:
        max(16px, calc(env(safe-area-inset-top) + 12px))
        24px
        max(24px, calc(env(safe-area-inset-bottom) + 16px));

    background:
        radial-gradient(
            circle at 50% -10%,
            #292929 0%,
            #111 38%,
            #080808 75%
        );

    overflow: hidden;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

header {
    width: 100%;
    max-width: 760px;

    min-height: 20px;

    margin:
        0 auto
        clamp(18px, 3vh, 28px);

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 16px;

    flex-shrink: 0;
}

.title {
    min-width: 0;

    color: #f5f5f7;

    font-size: 14px;
    font-weight: 600;

    letter-spacing: 2px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status {
    display: flex;
    align-items: center;

    gap: 7px;

    flex-shrink: 0;

    color: #555;

    font-size: 11px;
    letter-spacing: 1.5px;

    white-space: nowrap;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #444;

    flex-shrink: 0;
}

.status.running {
    color: #888;
}

.status.running .status-dot {
    background: #30d158;

    box-shadow:
        0 0 8px rgba(48, 209, 88, .7);
}


/* =========================================================
   MAIN
========================================================= */

main {
    width: 100%;
    max-width: 760px;

    flex: 1;

    min-height: 0;

    margin: 0 auto;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TIMER
========================================================= */

.timer-area {
    width: 100%;

    text-align: center;

    /*
     * 画面の高さに応じて上下の余白を変える。
     *
     * 低い画面では余白を小さくし、
     * 高い画面では少し余裕を持たせる。
     */
    margin:
        clamp(24px, 6vh, 60px)
        0
        clamp(28px, 6vh, 60px);

    flex-shrink: 0;

    display: flex;
    justify-content: center;
    align-items: center;
}

.timer {
    width: 100%;

    color: #f5f5f7;

    /*
     * vwだけではなくvhも考慮。
     *
     * 横幅が十分でも高さが低い端末で
     * タイマーが大きくなりすぎるのを防止。
     */
    font-size:
        clamp(
            62px,
            min(22vw, 15vh),
            165px
        );

    font-weight: 300;

    line-height: 1;

    letter-spacing: -3px;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;

    font-feature-settings: "tnum";

    overflow: hidden;
}

.timer.long {
    font-size:
        clamp(
            52px,
            min(16.5vw, 12vh),
            165px
        );

    letter-spacing: -3px;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
    display: flex;

    justify-content: space-between;
    align-items: center;

    width: min(310px, 100%);

    margin:
        0 auto
        clamp(28px, 5vh, 50px);

    flex-shrink: 0;
}

.circle-button {
    display: flex;

    justify-content: center;
    align-items: center;

    width: 78px;
    height: 78px;

    border-radius: 50%;

    background: #252527;

    color: #eeeeee;

    font-size: 13px;
    font-weight: 500;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 30px rgba(0,0,0,.35);

    transition:
        transform .12s ease,
        background .2s ease,
        opacity .2s ease;
}

.circle-button:active {
    transform: scale(.93);
}

.circle-button.primary {
    width: 82px;
    height: 82px;

    background: #b8b8ba;

    color: #111;

    font-size: 14px;
}

.circle-button.primary.running {
    background: #9f3430;
    color: #fff;
}


/* =========================================================
   LAP SECTION
========================================================= */

main > section:last-child {
    display: flex;
    flex-direction: column;

    min-height: 0;

    flex: 1;
}


/* =========================================================
   LAP HEADER
========================================================= */

.section-header {
    display: flex;

    justify-content: space-between;
    align-items: baseline;

    padding: 0 5px;

    margin-bottom: 12px;

    flex-shrink: 0;
}

.section-title {
    color: #777;

    font-size: 12px;

    letter-spacing: 2px;
}

.lap-count {
    color: #555;

    font-size: 12px;

    font-variant-numeric: tabular-nums;
}


/* =========================================================
   LAP LIST
========================================================= */

.laps {
    border-top: 1px solid #242424;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    scrollbar-width: none;
}

.laps::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   LAP
========================================================= */

.lap {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    align-items: center;

    min-height: 0;

    padding:
        12px 5px;

    border-bottom: 1px solid #202020;

    cursor: pointer;

    transition:
        background .15s ease;
}

.lap:active {
    background: #181818;
}

.lap-day {
    display: flex;

    align-items: center;

    min-width: 0;

    color: #ddd;

    font-size: 15px;

    font-variant-numeric: tabular-nums;

    white-space: nowrap;
}

.lap-number {
    width: 48px;

    color: #555;

    font-size: 10px;

    flex-shrink: 0;
}

.lap-date {
    width: 48px;

    flex-shrink: 0;
}

.lap-clock {
    margin-left: 16px;

    color: #bbb;

    flex-shrink: 0;
}

.lap-time {
    color: #eee;

    font-size: 16px;

    text-align: right;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;

    margin-left: 12px;
}

.empty {
    padding: 42px 0;

    color: #555;

    font-size: 13px;

    text-align: center;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: flex-end;
    justify-content: center;

    background: rgba(0,0,0,.68);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    z-index: 100;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(520px, 100%);

    padding:
        22px
        22px
        max(25px, env(safe-area-inset-bottom));

    background: #1c1c1e;

    border-radius:
        24px
        24px
        0
        0;

    box-shadow:
        0 -15px 50px rgba(0,0,0,.5);

    animation:
        slideUp .2s ease;
}

@keyframes slideUp {
    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.modal-title {
    margin-bottom: 25px;

    color: #fff;

    font-size: 17px;
    font-weight: 600;

    text-align: center;
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #888;

    font-size: 11px;

    letter-spacing: .7px;
}

input {
    width: 100%;

    padding:
        13px 14px;

    border: none;
    outline: none;

    border-radius: 11px;

    background: #2c2c2e;

    color: #fff;

    font-size: 16px;
}

.time-picker {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;
}

.time-picker select {
    width: 82px;

    padding:
        13px 8px;

    border: none;
    outline: none;

    border-radius: 11px;

    background: #2c2c2e;

    color: #fff;

    font-size: 20px;

    text-align: center;
}

.time-picker span {
    color: #aaa;

    font-size: 14px;
}

.info {
    margin-top: 5px;

    color: #666;

    font-size: 11px;

    line-height: 1.6;
}

.modal-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 25px;
}

.modal-button {
    padding: 14px;

    border-radius: 12px;

    background: #2c2c2e;

    color: #eee;

    font-size: 15px;
}

.modal-button:active {
    opacity: .7;
}

.modal-button.save {
    background: #f2f2f2;

    color: #111;

    font-weight: 600;
}

.delete-button {
    width: 100%;

    margin-top: 10px;

    padding: 13px;

    border-radius: 12px;

    background: transparent;

    color: #ff453a;

    font-size: 14px;
}


/* =========================================================
   CONFIRM MODAL
========================================================= */

.confirm-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 10px;

    background: rgba(0,0,0,.55);

    z-index: 200;
}

.confirm-overlay.show {
    display: flex;
}

.confirm-box {
    width: min(320px, 100%);

    overflow: hidden;

    border-radius: 18px;

    background: #2c2c2e;

    box-shadow:
        0 15px 50px rgba(0,0,0,.55);

    animation:
        confirmAppear .18s ease;
}

@keyframes confirmAppear {
    from {
        transform: scale(.94);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.confirm-content {
    padding:
        22px
        20px
        20px;

    text-align: center;
}

.confirm-title {
    margin-bottom: 7px;

    color: #fff;

    font-size: 17px;
    font-weight: 600;
}

.confirm-message {
    color: #aaa;

    font-size: 13px;

    line-height: 1.5;
}

.confirm-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    border-top: 1px solid #444;
}

.confirm-button {
    min-height: 44px;

    padding: 0;

    border-radius: 0;

    background: transparent;

    color: #0a84ff;

    font-size: 17px;
    font-weight: 500;
}

.confirm-button + .confirm-button {
    border-left: 1px solid #444;
}

.confirm-button:active {
    background: #3a3a3c;
}

.confirm-button.danger {
    color: #ff453a;
}


/* =========================================================
   SMALL HEIGHT PHONE
========================================================= */

@media (
    max-width: 599px
) and (
    max-height: 700px
) {

    .app {
        padding-top:
            max(
                12px,
                calc(env(safe-area-inset-top) + 8px)
            );
    }

    header {
        margin-bottom: 12px;
    }

    .timer-area {
        margin:
            18px 0
            24px;
    }

    .timer {
        font-size:
            clamp(
                58px,
                min(20vw, 14vh),
                120px
            );
    }

    .timer.long {
        font-size:
            clamp(
                48px,
                min(15vw, 11vh),
                115px
            );
    }

    .controls {
        margin-bottom: 24px;
    }

    .circle-button {
        width: 72px;
        height: 72px;
    }

    .circle-button.primary {
        width: 76px;
        height: 76px;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 380px) {

    .app {
        padding-left: 16px;
        padding-right: 16px;
    }

    .controls {
        width: 280px;
    }

    .circle-button {
        width: 70px;
        height: 70px;
    }

    .circle-button.primary {
        width: 76px;
        height: 76px;
    }

    .lap {
        grid-template-columns:
            minmax(0, 1fr)
            auto;

        padding-left: 3px;
        padding-right: 3px;
    }

    .lap-number {
        width: 43px;
    }

    .lap-date {
        width: 43px;
    }

    .lap-clock {
        margin-left: 10px;
    }

    .lap-time {
        margin-left: 8px;
    }
}


/* =========================================================
   iPAD PORTRAIT / TABLET
   600px〜
========================================================= */

@media (
    min-width: 600px
) and (
    min-height: 500px
) {

    .app {
        padding-left: 48px;
        padding-right: 48px;
    }

    header,
    main {
        max-width: 900px;
    }

    header {
        margin-bottom: 30px;
    }

    main {
        display: grid;

        grid-template-columns:
            1fr
            minmax(360px, 650px)
            1fr;

        grid-template-rows:
            auto
            minmax(0, 1fr);

        column-gap: 30px;

        align-items: start;
    }

    .title {
        font-size: 15px;
        letter-spacing: 2.5px;
    }

    .status {
        font-size: 12px;
    }

    .timer-area {
        grid-column: 1 / 4;
        grid-row: 1;

        margin:
            clamp(24px, 5vh, 50px)
            0
            clamp(36px, 6vh, 65px);
    }

    .timer {
        font-size:
            clamp(
                110px,
                min(21vw, 18vh),
                220px
            );

        letter-spacing: -5px;
    }

    .timer.long {
        font-size:
            clamp(
                90px,
                min(16.5vw, 15vh),
                190px
            );
    }

    /*
     * ボタンを左右に配置。
     * ラップ一覧と同じ2行目に置く。
     */
    .controls {
        grid-column: 1 / 4;
        grid-row: 2;

        display: grid;

        grid-template-columns:
            1fr
            minmax(360px, 650px)
            1fr;

        column-gap: 30px;

        align-items: start;

        width: 100%;
        height: 100%;

        margin: 0;

        padding: 0;

        pointer-events: none;

        z-index: 2;
    }

    #secondaryButton {
        grid-column: 1;
        grid-row: 1;

        justify-self: start;

        margin: 0;

        pointer-events: auto;
    }

    #startStopButton {
        grid-column: 3;
        grid-row: 1;

        justify-self: end;

        margin: 0;

        pointer-events: auto;
    }

    main > section:last-child {
        grid-column: 2;
        grid-row: 2;

        width: 100%;
        height: 100%;

        min-height: 0;

        z-index: 1;
    }

    .section-header {
        padding: 0 8px;
    }

    .section-title {
        font-size: 13px;
    }

    .lap-count {
        font-size: 13px;
    }

    .lap {
        padding:
            14px 8px;
    }

    .lap-day {
        font-size: 17px;
    }

    .lap-number {
        width: 65px;
        font-size: 11px;
    }

    .lap-date {
        width: 55px;
    }

    .lap-time {
        font-size: 18px;
    }
}


/* =========================================================
   iPAD LANDSCAPE / LARGE TABLET
   900px〜
========================================================= */

@media (
    min-width: 900px
) and (
    min-height: 500px
) {

    .app {
        padding-left: 70px;
        padding-right: 70px;
    }

    header,
    main {
        max-width: 1100px;
    }

    header {
        margin-bottom: 30px;
    }

    main {
        grid-template-columns:
            minmax(140px, 1fr)
            minmax(450px, 700px)
            minmax(140px, 1fr);

        grid-template-rows:
            auto
            minmax(0, 1fr);

        column-gap: 40px;
    }

    .timer-area {
        padding: 0;

        margin:
            clamp(24px, 5vh, 45px)
            0
            clamp(40px, 6vh, 70px);
    }

    .timer {
        font-size:
            clamp(
                135px,
                min(16.5vw, 22vh),
                285px
            );

        letter-spacing: -7px;
    }

    .timer.long {
        font-size:
            clamp(
                110px,
                min(12vw, 18vh),
                240px
            );
    }

    .controls {
        grid-template-columns:
            minmax(140px, 1fr)
            minmax(450px, 700px)
            minmax(140px, 1fr);

        column-gap: 40px;
    }

    .circle-button {
        width: 105px;
        height: 105px;

        font-size: 16px;
    }

    .circle-button.primary {
        width: 112px;
        height: 112px;

        font-size: 17px;
    }

    .lap {
        grid-template-columns:
            1fr
            220px;

        padding-left: 15px;
        padding-right: 15px;
    }

    .lap-day {
        font-size: 18px;
    }

    .lap-number {
        width: 80px;

        font-size: 11px;
    }

    .lap-date {
        width: 65px;
    }

    .lap-time {
        font-size: 19px;
    }
}


/* =========================================================
   PC
   1200px〜
========================================================= */

@media (
    min-width: 1200px
) and (
    min-height: 600px
) {

    .app {
        padding:
            40px
            80px
            60px;
    }

    header,
    main {
        max-width: 1200px;
    }

    header {
        margin-bottom: 30px;
    }

    main {
        grid-template-columns:
            minmax(180px, 1fr)
            minmax(500px, 760px)
            minmax(180px, 1fr);

        grid-template-rows:
            auto
            minmax(0, 1fr);

        column-gap: 50px;
    }

    .timer-area {
        padding-top: 0;

        margin:
            clamp(25px, 5vh, 50px)
            0
            clamp(45px, 7vh, 80px);
    }

    .timer {
        font-size:
            clamp(
                130px,
                min(10vw, 22vh),
                200px
            );

        letter-spacing: -9px;
    }

    .timer.long {
        font-size:
            clamp(
                100px,
                min(8vw, 18vh),
                175px
            );
    }

    .controls {
        grid-template-columns:
            minmax(180px, 1fr)
            minmax(500px, 760px)
            minmax(180px, 1fr);

        column-gap: 50px;
    }

    .circle-button {
        width: 112px;
        height: 112px;

        font-size: 17px;
    }

    .circle-button.primary {
        width: 120px;
        height: 120px;

        font-size: 18px;
    }

    .section-header {
        padding:
            0 15px;

        margin-bottom: 15px;
    }

    .section-title {
        font-size: 14px;
    }

    .lap-count {
        font-size: 14px;
    }

    .lap {
        grid-template-columns:
            1fr
            250px;

        min-height: 92px;

        padding: 15px;
    }

    .lap-day {
        font-size: 19px;
    }

    .lap-number {
        width: 90px;

        font-size: 12px;
    }

    .lap-date {
        width: 70px;
    }

    .lap-time {
        font-size: 20px;
    }
}


/* =========================================================
   VERY LARGE PC
   1600px〜
========================================================= */

@media (
    min-width: 1600px
) and (
    min-height: 700px
) {

    .app {
        padding-left: 120px;
        padding-right: 120px;
    }

    header,
    main {
        max-width: 1400px;
    }

    main {
        grid-template-columns:
            minmax(200px, 1fr)
            minmax(600px, 800px)
            minmax(200px, 1fr);

        column-gap: 70px;
    }

    .controls {
        grid-template-columns:
            minmax(200px, 1fr)
            minmax(600px, 800px)
            minmax(200px, 1fr);

        column-gap: 70px;
    }

    .timer {
        font-size: 210px;
    }

    .timer.long {
        font-size: 180px;
    }
}


/* =========================================================
   TOUCH / SELECTION
========================================================= */

.laps,
.lap,
button {
    -webkit-user-select: none;
    user-select: none;
}

</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="title">
            STUDY TIMER
        </div>

        <div class="status" id="status">

            <div class="status-dot"></div>

            <span id="statusText">
                READY
            </span>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <!-- =================================================
             TIMER
        ================================================== -->

        <section class="timer-area">

            <div
                class="timer"
                id="timer"
            >
                00:00.00
            </div>

        </section>


        <!-- =================================================
             CONTROLS
        ================================================== -->

        <section class="controls">

            <button
                class="circle-button"
                id="secondaryButton"
            >
                リセット
            </button>

            <button
                class="circle-button primary"
                id="startStopButton"
            >
                開始
            </button>

        </section>


        <!-- =================================================
             LAPS
        ================================================== -->

        <section>

            <div class="section-header">

                <div class="section-title">
                    LAPS
                </div>

                <div
                    class="lap-count"
                    id="lapCount"
                >
                    0
                </div>

            </div>

            <div
                class="laps"
                id="laps"
            >

                <div class="empty">
                    ラップを記録すると、ここに表示されます
                </div>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     EDIT MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div class="modal">

        <div class="modal-title">
            ラップを編集
        </div>

        <div class="field">

            <label>
                経過時間
            </label>

            <div class="time-picker">

                <select
                    id="editHours"
                    aria-label="時間"
                >
                </select>

                <span>
                    時間
                </span>

                <select
                    id="editMinutes"
                    aria-label="分"
                >
                </select>

                <span>
                    分
                </span>

                <select
                    id="editSeconds"
                    aria-label="秒"
                >
                </select>

                <span>
                    秒
                </span>

            </div>

        </div>

        <div class="info">
            ラップの経過時間を変更します。
        </div>

        <div class="modal-buttons">

            <button
                class="modal-button"
                id="cancelEdit"
            >
                キャンセル
            </button>

            <button
                class="modal-button save"
                id="saveEdit"
            >
                保存
            </button>

        </div>

        <button
            class="delete-button"
            id="deleteLap"
        >
            このラップを削除
        </button>

    </div>

</div>


<!-- =========================================================
     CONFIRM MODAL
========================================================= -->

<div
    class="confirm-overlay"
    id="confirmOverlay"
>

    <div class="confirm-box">

        <div class="confirm-content">

            <div
                class="confirm-title"
                id="confirmTitle"
            >
                確認
            </div>

        </div>

        <div class="confirm-buttons">

            <button
                class="confirm-button"
                id="confirmCancel"
            >
                キャンセル
            </button>

            <button
                class="confirm-button danger"
                id="confirmOK"
            >
                実行
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "studyStopwatch_v3";


/* =========================================================
   STATE
========================================================= */

let state = {

    running: false,

    currentRunStart: null,

    accumulated: 0,

    laps: []

};

let editingLapId = null;

let animationFrame = null;

let confirmResolver = null;


/* =========================================================
   CUSTOM CONFIRM
========================================================= */

function showConfirm(
    title,
    okText
) {

    return new Promise(
        resolve => {

            confirmResolver =
                resolve;

            document
                .getElementById(
                    "confirmTitle"
                )
                .textContent =
                title;

            document
                .getElementById(
                    "confirmOK"
                )
                .textContent =
                okText;

            document
                .getElementById(
                    "confirmOverlay"
                )
                .classList
                .add("show");

        }
    );

}


function closeConfirm(
    result
) {

    document
        .getElementById(
            "confirmOverlay"
        )
        .classList
        .remove("show");

    if (confirmResolver) {

        const resolve =
            confirmResolver;

        confirmResolver = null;

        resolve(result);

    }

}


/* =========================================================
   STORAGE FUNCTIONS
========================================================= */

function saveState() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    } catch (error) {

        console.error(
            "Failed to save state:",
            error
        );

    }

}


function loadState() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {
            return;
        }

        const parsed =
            JSON.parse(saved);

        if (
            parsed &&
            typeof parsed === "object"
        ) {

            state = {

                running:
                    Boolean(
                        parsed.running
                    ),

                currentRunStart:
                    Number(
                        parsed.currentRunStart
                    ) || null,

                accumulated:
                    Number(
                        parsed.accumulated
                    ) || 0,

                laps:
                    Array.isArray(
                        parsed.laps
                    )
                        ? parsed.laps
                        : []

            };

        }

    } catch (error) {

        console.error(
            "Failed to load state:",
            error
        );

        state = {

            running: false,

            currentRunStart: null,

            accumulated: 0,

            laps: []

        };

    }

}


/* =========================================================
   ELAPSED
========================================================= */

function getElapsed() {

    let elapsed =
        Number(
            state.accumulated
        ) || 0;

    if (
        state.running &&
        state.currentRunStart
    ) {

        elapsed +=
            Date.now() -
            state.currentRunStart;

    }

    return Math.max(
        0,
        elapsed
    );

}


/* =========================================================
   FORMAT
========================================================= */

function pad(
    number,
    digits = 2
) {

    return String(number)
        .padStart(
            digits,
            "0"
        );

}


function formatStopwatch(
    ms
) {

    ms = Math.max(
        0,
        Math.floor(ms)
    );

    const hours =
        Math.floor(
            ms / 3600000
        );

    const minutes =
        Math.floor(
            (ms % 3600000) /
            60000
        );

    const seconds =
        Math.floor(
            (ms % 60000) /
            1000
        );

    const centiseconds =
        Math.floor(
            (ms % 1000) /
            10
        );

    if (hours === 0) {

        return (
            pad(minutes) +
            ":" +
            pad(seconds) +
            "." +
            pad(centiseconds)
        );

    }

    return (
        hours +
        ":" +
        pad(minutes) +
        ":" +
        pad(seconds) +
        "." +
        pad(centiseconds)
    );

}


function formatStudyTime(
    ms
) {

    ms = Math.max(
        0,
        Math.floor(ms)
    );

    const totalSeconds =
        Math.floor(
            ms / 1000
        );

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );

    const seconds =
        totalSeconds % 60;

    const result = [];

    if (hours > 0) {

        result.push(
            hours + "時間"
        );

    }

    if (minutes > 0) {

        result.push(
            minutes + "分"
        );

    }

    if (
        seconds > 0 ||
        result.length === 0
    ) {

        result.push(
            seconds + "秒"
        );

    }

    return result.join("");

}


/* =========================================================
   LAP
========================================================= */

function getLapElapsed(
    lap
) {

    return Math.max(
        0,
        Number(
            lap.elapsed
        ) || 0
    );

}


function calculateLapDuration(
    index
) {

    const lap =
        state.laps[index];

    if (!lap) {
        return 0;
    }

    const previous =
        state.laps[index + 1];

    if (!previous) {

        return getLapElapsed(
            lap
        );

    }

    return Math.max(
        0,
        getLapElapsed(lap) -
        getLapElapsed(previous)
    );

}


/* =========================================================
   LAP NORMALIZE
========================================================= */

function normalizeLaps() {

    if (
        state.laps.length <= 1
    ) {
        return;
    }

    /*
     * 新しいラップ → 古いラップ
     * の順に並んでいることを保証。
     */
    state.laps.sort(
        (a, b) =>
            getLapElapsed(b) -
            getLapElapsed(a)
    );

    /*
     * elapsedの逆転を防止。
     */
    for (
        let i = 0;
        i < state.laps.length - 1;
        i++
    ) {

        const newer =
            state.laps[i];

        const older =
            state.laps[i + 1];

        if (
            getLapElapsed(newer) <
            getLapElapsed(older)
        ) {

            newer.elapsed =
                getLapElapsed(
                    older
                );

        }

    }

}


/* =========================================================
   ADD LAP
========================================================= */

function addLap() {

    if (!state.running) {
        return;
    }

    const now =
        Date.now();

    const elapsed =
        getElapsed();

    state.laps.push({

        id:
            crypto.randomUUID(),

        timestamp:
            new Date(
                now
            ).toISOString(),

        elapsed:
            elapsed

    });

    normalizeLaps();

    saveState();

    renderLaps();

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer() {

    const timer =
        document.getElementById(
            "timer"
        );

    const elapsed =
        getElapsed();

    timer.textContent =
        formatStopwatch(
            elapsed
        );

    const hours =
        Math.floor(
            elapsed / 3600000
        );

    timer.classList.toggle(
        "long",
        hours > 0
    );

    if (state.running) {

        animationFrame =
            requestAnimationFrame(
                updateTimer
            );

    }

}


/* =========================================================
   START / STOP
========================================================= */

function startStopwatch() {

    if (state.running) {

        state.accumulated =
            getElapsed();

        state.running =
            false;

        state.currentRunStart =
            null;

        saveState();

        cancelAnimationFrame(
            animationFrame
        );

        updateTimer();

        updateControls();

        return;

    }

    state.running =
        true;

    state.currentRunStart =
        Date.now();

    saveState();

    updateControls();

    updateTimer();

}


/* =========================================================
   RESET
========================================================= */

async function resetStopwatch() {

    if (state.running) {
        return;
    }

    if (
        state.accumulated > 0 ||
        state.laps.length > 0
    ) {

        const confirmed =
            await showConfirm(
                "リセットしますか？",
                "リセット"
            );

        if (!confirmed) {
            return;
        }

    }

    state = {

        running: false,

        currentRunStart: null,

        accumulated: 0,

        laps: []

    };

    saveState();

    cancelAnimationFrame(
        animationFrame
    );

    updateTimer();

    updateControls();

    renderLaps();

}


/* =========================================================
   CONTROLS
========================================================= */

function updateControls() {

    const secondary =
        document.getElementById(
            "secondaryButton"
        );

    const primary =
        document.getElementById(
            "startStopButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    if (state.running) {

        secondary.textContent =
            "ラップ";

        primary.textContent =
            "停止";

        primary.classList.add(
            "running"
        );

        status.classList.add(
            "running"
        );

        statusText.textContent =
            "FOCUS";

        return;

    }

    secondary.textContent =
        "リセット";

    primary.textContent =
        "開始";

    primary.classList.remove(
        "running"
    );

    status.classList.remove(
        "running"
    );

    statusText.textContent =
        getElapsed() > 0
            ? "PAUSED"
            : "READY";

}


/* =========================================================
   RENDER LAPS
========================================================= */

function renderLaps() {

    const container =
        document.getElementById(
            "laps"
        );

    const count =
        document.getElementById(
            "lapCount"
        );

    count.textContent =
        state.laps.length;

    if (
        state.laps.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                ラップを記録すると、ここに表示されます
            </div>
        `;

        return;

    }

    /*
     * 念のため描画前に順序を統一。
     */
    normalizeLaps();

    container.innerHTML =
        state.laps
            .map(
                (lap, index) => {

                    const duration =
                        calculateLapDuration(
                            index
                        );

                    const lapNumber =
                        state.laps.length -
                        index;

                    const date =
                        new Date(
                            lap.timestamp
                        );

                    const month =
                        date.getMonth() + 1;

                    const day =
                        date.getDate();

                    const hours =
                        pad(
                            date.getHours()
                        );

                    const minutes =
                        pad(
                            date.getMinutes()
                        );

                    return `
                        <div
                            class="lap"
                            data-id="${lap.id}"
                        >

                            <div class="lap-day">

                                <span class="lap-number">
                                    LAP ${lapNumber}
                                </span>

                                <span class="lap-date">
                                    ${month}/${day}
                                </span>

                                <span class="lap-clock">
                                    ${hours}:${minutes}〜
                                </span>

                            </div>

                            <div class="lap-time">
                                ${formatStudyTime(
                                    duration
                                )}
                            </div>

                        </div>
                    `;

                }
            )
            .join("");

    container
        .querySelectorAll(
            ".lap"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        openEditModal(
                            element.dataset.id
                        );

                    }
                );

            }
        );

}


/* =========================================================
   EDIT MODAL
========================================================= */

function populateTimePicker() {

    const hours =
        document.getElementById(
            "editHours"
        );

    const minutes =
        document.getElementById(
            "editMinutes"
        );

    const seconds =
        document.getElementById(
            "editSeconds"
        );

    if (hours.options.length) {
        return;
    }

    for (
        let i = 0;
        i <= 99;
        i++
    ) {

        hours.add(
            new Option(
                pad(i),
                i
            )
        );

    }

    for (
        let i = 0;
        i <= 59;
        i++
    ) {

        minutes.add(
            new Option(
                pad(i),
                i
            )
        );

        seconds.add(
            new Option(
                pad(i),
                i
            )
        );

    }

}


function openEditModal(
    id
) {

    if (state.running) {
        return;
    }

    const index =
        state.laps.findIndex(
            lap =>
                lap.id === id
        );

    if (index === -1) {
        return;
    }

    const lap =
        state.laps[index];

    editingLapId =
        id;

    populateTimePicker();

    const totalSeconds =
        Math.floor(
            calculateLapDuration(
                index
            ) / 1000
        );

    document
        .getElementById(
            "editHours"
        )
        .value =
        Math.min(
            99,
            Math.floor(
                totalSeconds /
                3600
            )
        );

    document
        .getElementById(
            "editMinutes"
        )
        .value =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );

    document
        .getElementById(
            "editSeconds"
        )
        .value =
        totalSeconds %
        60;

    document
        .getElementById(
            "modalOverlay"
        )
        .classList
        .add("show");

}


function closeEditModal() {

    editingLapId = null;

    document
        .getElementById(
            "modalOverlay"
        )
        .classList
        .remove("show");

}


/* =========================================================
   SAVE EDIT
========================================================= */

function saveEdit() {

    if (
        !editingLapId ||
        state.running
    ) {
        return;
    }

    const index =
        state.laps.findIndex(
            lap =>
                lap.id ===
                editingLapId
        );

    if (index === -1) {
        return;
    }

    const lap =
        state.laps[index];

    const oldElapsed =
        getLapElapsed(
            lap
        );

    const oldDuration =
        calculateLapDuration(
            index
        );

    const hours =
        Number(
            document
                .getElementById(
                    "editHours"
                )
                .value
        );

    const minutes =
        Number(
            document
                .getElementById(
                    "editMinutes"
                )
                .value
        );

    const seconds =
        Number(
            document
                .getElementById(
                    "editSeconds"
                )
                .value
        );

    const newDuration =
        (
            (
                hours * 60 +
                minutes
            ) * 60 +
            seconds
        ) * 1000;

    const difference =
        newDuration -
        oldDuration;

    /*
     * 編集したラップ自身を変更。
     */
    lap.elapsed =
        Math.max(
            0,
            oldElapsed +
            difference
        );

    /*
     * 編集対象より新しいラップは、
     * 編集差分を引き継ぐ。
     */
    state.laps.forEach(
        otherLap => {

            if (
                otherLap.id ===
                lap.id
            ) {
                return;
            }

            if (
                getLapElapsed(
                    otherLap
                ) >
                oldElapsed
            ) {

                otherLap.elapsed =
                    Math.max(
                        0,
                        getLapElapsed(
                            otherLap
                        ) +
                        difference
                    );

            }

        }
    );

    /*
     * タイマー全体にも差分を反映。
     */
    state.accumulated =
        Math.max(
            0,
            (
                Number(
                    state.accumulated
                ) || 0
            ) +
            difference
        );

    normalizeLaps();

    saveState();

    renderLaps();

    updateTimer();

    updateControls();

    closeEditModal();

}


/* =========================================================
   DELETE LAP
========================================================= */

async function deleteLap() {

    if (!editingLapId) {
        return;
    }

    const confirmed =
        await showConfirm(
            "ラップを削除しますか？",
            "削除"
        );

    if (!confirmed) {
        return;
    }

    state.laps =
        state.laps.filter(
            lap =>
                lap.id !==
                editingLapId
        );

    normalizeLaps();

    saveState();

    renderLaps();

    closeEditModal();

}


/* =========================================================
   EVENTS
========================================================= */

document
    .getElementById(
        "startStopButton"
    )
    .addEventListener(
        "click",
        startStopwatch
    );


document
    .getElementById(
        "secondaryButton"
    )
    .addEventListener(
        "click",
        () => {

            if (state.running) {

                addLap();

            } else {

                resetStopwatch();

            }

        }
    );


document
    .getElementById(
        "cancelEdit"
    )
    .addEventListener(
        "click",
        closeEditModal
    );


document
    .getElementById(
        "saveEdit"
    )
    .addEventListener(
        "click",
        saveEdit
    );


document
    .getElementById(
        "deleteLap"
    )
    .addEventListener(
        "click",
        deleteLap
    );


document
    .getElementById(
        "modalOverlay"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                document.getElementById(
                    "modalOverlay"
                )
            ) {

                closeEditModal();

            }

        }
    );


/* =========================================================
   CONFIRM EVENTS
========================================================= */

document
    .getElementById(
        "confirmCancel"
    )
    .addEventListener(
        "click",
        () => {

            closeConfirm(
                false
            );

        }
    );


document
    .getElementById(
        "confirmOK"
    )
    .addEventListener(
        "click",
        () => {

            closeConfirm(
                true
            );

        }
    );


document
    .getElementById(
        "confirmOverlay"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                document.getElementById(
                    "confirmOverlay"
                )
            ) {

                closeConfirm(
                    false
                );

            }

        }
    );


/* =========================================================
   iOS / SAFARI ZOOM PREVENTION
========================================================= */

/*
 * ピンチズーム・ジェスチャーズームを防止。
 */
document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    event => {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/*
 * ダブルタップズームを防止。
 *
 * ボタン・入力欄などの操作対象は除外。
 */
let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();

        const target =
            event.target;

        const interactive =
            target.closest(
                "button, input, select, textarea, a"
            );

        if (
            !interactive &&
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }

        lastTouchEnd =
            now;

    },
    {
        passive: false
    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

/*
 * iOS Safariではバックグラウンド中に
 * requestAnimationFrameが停止する。
 *
 * 実時間の計算自体はDate.now()で正しいので、
 * 復帰した瞬間に画面を更新する。
 */
document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            updateTimer();

            updateControls();

        } else {

            saveState();

        }

    }
);


/*
 * ページを離れる直前にも保存。
 */
window.addEventListener(
    "pagehide",
    () => {

        saveState();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadState();

normalizeLaps();

updateTimer();

updateControls();

renderLaps();

if (state.running) {

    updateTimer();

}

</script>
