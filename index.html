<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

<meta
    name="apple-mobile-web-app-capable"
    content="yes">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

<title>Study Timer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;

    background: #080808;

    touch-action: manipulation;
    overscroll-behavior: none;
}

body {
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #eeeeee;
}

/* =========================
   App
========================= */

.app {
    width: 100%;
    height: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.045),
            transparent 45%
        );

    overflow: hidden;
}

/* =========================
   Header
========================= */

header {
    flex: 0 0 auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    height: 28px;
}

.logo {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    color: #77777b;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 10px;
    letter-spacing: .12em;
    color: #68686c;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #666;
}

.status.running .status-dot {
    background: #888;
}

.status.paused .status-dot {
    background: #777;
}

/* =========================
   Main
========================= */

main {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
}

/* =========================
   Timer
========================= */

.timer-area {
    flex: 0 0 auto;

    display: flex;
    justify-content: center;
    align-items: center;

    padding-top: 4vh;
    padding-bottom: 3vh;
}

.timer {
    font-variant-numeric: tabular-nums;

    white-space: nowrap;

    font-size: clamp(54px, 15vw, 100px);
    line-height: 1;

    font-weight: 300;
    letter-spacing: -.055em;

    color: #eeeeee;

    user-select: none;
}

.timer.long {
    font-size: clamp(45px, 12vw, 82px);
}

/* =========================
   Controls
========================= */

.controls {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
}

/* =========================
   Buttons
========================= */

.circle-button {
    display: flex;
    justify-content: center;
    align-items: center;

    width: 78px;
    height: 78px;

    flex: 0 0 auto;

    border: none;
    border-radius: 50%;

    background: #252527;
    color: #eeeeee;

    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 30px rgba(0,0,0,.35);

    transition:
        transform .12s ease,
        background .2s ease,
        opacity .2s ease;

    cursor: pointer;
}

.circle-button:active {
    transform: scale(.93);
}

.circle-button.primary {
    width: 82px;
    height: 82px;

    background: #b8b8ba;
    color: #111;

    font-size: 14px;
}

.circle-button.primary.running {
    background: #9f3430;
    color: #fff;
}

.circle-button:disabled {
    opacity: .4;
}

/* =========================
   Lap button
========================= */

.lap-button {
    width: 78px;
    height: 78px;

    flex: 0 0 auto;

    border: none;
    border-radius: 50%;

    background: #252527;
    color: #eeeeee;

    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 30px rgba(0,0,0,.35);

    transition:
        transform .12s ease,
        background .2s ease,
        opacity .2s ease;

    cursor: pointer;
}

.lap-button:active {
    transform: scale(.93);
}

.lap-button:disabled {
    opacity: .4;
}

/* =========================
   Lap section
========================= */

.lap-section {
    min-height: 0;
    overflow: hidden;

    display: flex;
    flex-direction: column;
}

/* =========================
   Lap list
========================= */

.lap-list {
    flex: 1;
    min-height: 0;

    width: 100%;

    margin-top: 14px;

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

    scrollbar-width: none;
}

.lap-list::-webkit-scrollbar {
    display: none;
}

.lap-empty {
    padding-top: 18px;

    text-align: center;

    font-size: 12px;
    color: #505054;

    user-select: none;
}

.lap {
    display: grid;
    grid-template-columns: 1fr auto;

    width: 100%;

    padding: 10px 2px;

    border-bottom: 1px solid rgba(255,255,255,.045);

    user-select: none;
}

.lap-info {
    min-width: 0;
}

.lap-number {
    font-size: 10px;
    color: #67676b;

    margin-bottom: 3px;
}

.lap-time {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: #cfcfd2;
}

.lap-duration {
    align-self: center;

    font-size: 13px;
    font-variant-numeric: tabular-nums;

    color: #eeeeee;
}

/* =========================
   Modal
========================= */

.modal-backdrop {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background: rgba(0,0,0,.62);

    z-index: 100;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(340px, 100%);

    padding: 22px;

    border-radius: 22px;

    background: #1b1b1d;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);

    text-align: center;
}

.modal-title {
    font-size: 15px;
    font-weight: 500;

    color: #eeeeee;

    margin-bottom: 20px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-button {
    flex: 1;

    height: 44px;

    border: none;
    border-radius: 12px;

    background: #2a2a2c;
    color: #eeeeee;

    font-family: inherit;
    font-size: 13px;
}

.modal-button.primary {
    background: #d8d8da;
    color: #111;
}

.modal-button.danger {
    background: #9f3430;
    color: #fff;
}

/* =========================
   Edit modal
========================= */

.picker-row {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 6px;

    margin-bottom: 20px;
}

.picker-group {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.picker-group select {
    width: 68px;
    height: 42px;

    border: none;
    border-radius: 10px;

    background: #29292b;
    color: #eeeeee;

    font-size: 16px;
    text-align: center;

    outline: none;
}

.picker-label {
    margin-top: 5px;

    font-size: 9px;
    color: #66666a;
}

/* =========================
   iPad
========================= */

@media (min-width: 600px) {

    .app {
        padding:
            max(22px, env(safe-area-inset-top))
            max(28px, env(safe-area-inset-right))
            max(22px, env(safe-area-inset-bottom))
            max(28px, env(safe-area-inset-left));
    }

    header {
        height: 32px;
    }

    .timer-area {
        padding-top: 5vh;
        padding-bottom: 4vh;
    }

    .timer {
        font-size: clamp(70px, 10vw, 120px);
    }

    .timer.long {
        font-size: clamp(58px, 8vw, 100px);
    }

    /*
       iPadでは、

       ┌───────────────┐
       │    TIMER      │
       ├───────────────┤
       │ ○   LAP   ○   │
       │     LAP       │
       │     LAP       │
       │     LAP       │
       └───────────────┘

       という3列構造にする。
    */

    .controls {
        display: grid;

        grid-template-columns:
            minmax(90px, 1fr)
            minmax(180px, 420px)
            minmax(90px, 1fr);

        grid-template-rows: minmax(0, 1fr);

        align-items: start;

        min-height: 0;
    }

    #secondaryButton {
        grid-column: 1;
        grid-row: 1;

        justify-self: start;
        align-self: start;

        margin-top: 0;
    }

    .lap-section {
        grid-column: 2;
        grid-row: 1;

        width: 100%;
        height: 100%;
        min-height: 0;

        display: flex;
        flex-direction: column;

        align-items: center;
    }

    .lap-button {
        flex: 0 0 auto;
    }

    .lap-list {
        flex: 1;
        min-height: 0;

        width: 100%;

        margin-top: 14px;
    }

    #startStopButton {
        grid-column: 3;
        grid-row: 1;

        justify-self: end;
        align-self: start;

        margin-top: 0;
    }
}

/* =========================
   Large iPad / landscape
========================= */

@media (min-width: 900px) {

    .app {
        padding-left: 42px;
        padding-right: 42px;
    }

    .timer-area {
        padding-top: 4vh;
        padding-bottom: 4vh;
    }

    .timer {
        font-size: clamp(80px, 8vw, 135px);
    }

    .timer.long {
        font-size: clamp(66px, 6.5vw, 110px);
    }

    .controls {
        grid-template-columns:
            minmax(120px, 1fr)
            minmax(260px, 520px)
            minmax(120px, 1fr);
    }

    .circle-button {
        width: 84px;
        height: 84px;
    }

    .circle-button.primary {
        width: 88px;
        height: 88px;
    }

    .lap-button {
        width: 84px;
        height: 84px;
    }

    .lap-list {
        margin-top: 16px;
    }
}

/* =========================
   PC
========================= */

@media (min-width: 1200px) {

    .app {
        padding-left: 70px;
        padding-right: 70px;
    }

    header {
        height: 36px;
    }

    .timer-area {
        padding-top: 4vh;
        padding-bottom: 4vh;
    }

    .timer {
        font-size: 125px;
    }

    .timer.long {
        font-size: 102px;
    }

    .controls {
        grid-template-columns:
            minmax(180px, 1fr)
            minmax(320px, 560px)
            minmax(180px, 1fr);
    }

    .circle-button {
        width: 88px;
        height: 88px;
    }

    .circle-button.primary {
        width: 92px;
        height: 92px;
    }

    .lap-button {
        width: 88px;
        height: 88px;
    }
}

/* =========================
   Very large PC
========================= */

@media (min-width: 1600px) {

    .app {
        padding-left: 100px;
        padding-right: 100px;
    }

    .timer {
        font-size: 140px;
    }

    .timer.long {
        font-size: 115px;
    }

    .controls {
        grid-template-columns:
            minmax(240px, 1fr)
            minmax(360px, 620px)
            minmax(240px, 1fr);
    }
}

/* =========================
   Small phone
========================= */

@media (max-width: 380px) {

    .app {
        padding-left: 14px;
        padding-right: 14px;
    }

    .timer-area {
        padding-top: 3vh;
        padding-bottom: 2vh;
    }

    .timer {
        font-size: clamp(48px, 14vw, 68px);
    }

    .timer.long {
        font-size: clamp(40px, 11vw, 58px);
    }

    .circle-button {
        width: 72px;
        height: 72px;
    }

    .circle-button.primary {
        width: 76px;
        height: 76px;
    }

    .lap-button {
        width: 72px;
        height: 72px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">STUDY TIMER</div>

        <div id="status" class="status">
            <span class="status-dot"></span>
            <span id="statusText">READY</span>
        </div>
    </header>

    <main>

        <section class="timer-area">
            <div id="timer" class="timer">00:00.00</div>
        </section>

        <section class="controls">

            <button
                id="secondaryButton"
                class="circle-button"
                type="button">
                リセット
            </button>

            <section class="lap-section">

                <button
                    id="lapButton"
                    class="lap-button"
                    type="button"
                    disabled>
                    ラップ
                </button>

                <div id="lapList" class="lap-list"></div>

            </section>

            <button
                id="startStopButton"
                class="circle-button primary"
                type="button">
                開始
            </button>

        </section>

    </main>

</div>


<!-- =========================
     Confirm Modal
========================= -->

<div
    id="confirmBackdrop"
    class="modal-backdrop">

    <div class="modal">

        <div
            id="confirmTitle"
            class="modal-title">
        </div>

        <div class="modal-buttons">

            <button
                id="confirmCancel"
                class="modal-button"
                type="button">
                キャンセル
            </button>

            <button
                id="confirmOk"
                class="modal-button primary"
                type="button">
                OK
            </button>

        </div>

    </div>

</div>


<!-- =========================
     Edit Modal
========================= -->

<div
    id="editBackdrop"
    class="modal-backdrop">

    <div class="modal">

        <div class="modal-title">
            ラップ時間を編集
        </div>

        <div class="picker-row">

            <div class="picker-group">
                <select id="hourSelect"></select>
                <div class="picker-label">時間</div>
            </div>

            <div class="picker-group">
                <select id="minuteSelect"></select>
                <div class="picker-label">分</div>
            </div>

            <div class="picker-group">
                <select id="secondSelect"></select>
                <div class="picker-label">秒</div>
            </div>

        </div>

        <div class="modal-buttons">

            <button
                id="editCancel"
                class="modal-button"
                type="button">
                キャンセル
            </button>

            <button
                id="editSave"
                class="modal-button primary"
                type="button">
                保存
            </button>

        </div>

    </div>

</div>


<script>
"use strict";

/* =========================
   State
========================= */

const STORAGE_KEY = "studyStopwatch_v3";

let state = {
    running: false,
    currentRunStart: null,
    accumulated: 0,
    laps: []
};

let editingLapId = null;
let animationFrame = null;


/* =========================
   Elements
========================= */

const timerElement =
    document.getElementById("timer");

const statusElement =
    document.getElementById("status");

const statusTextElement =
    document.getElementById("statusText");

const secondaryButton =
    document.getElementById("secondaryButton");

const startStopButton =
    document.getElementById("startStopButton");

const lapButton =
    document.getElementById("lapButton");

const lapList =
    document.getElementById("lapList");

const confirmBackdrop =
    document.getElementById("confirmBackdrop");

const confirmTitle =
    document.getElementById("confirmTitle");

const confirmCancel =
    document.getElementById("confirmCancel");

const confirmOk =
    document.getElementById("confirmOk");

const editBackdrop =
    document.getElementById("editBackdrop");

const hourSelect =
    document.getElementById("hourSelect");

const minuteSelect =
    document.getElementById("minuteSelect");

const secondSelect =
    document.getElementById("secondSelect");

const editCancel =
    document.getElementById("editCancel");

const editSave =
    document.getElementById("editSave");


/* =========================
   Confirmation
========================= */

let confirmResolver = null;

function showConfirm(title, okText) {

    confirmTitle.textContent = title;
    confirmOk.textContent = okText;

    confirmBackdrop.classList.add("show");

    return new Promise(resolve => {
        confirmResolver = resolve;
    });
}

function closeConfirm(result) {

    confirmBackdrop.classList.remove("show");

    if (confirmResolver) {
        confirmResolver(result);
        confirmResolver = null;
    }
}

confirmCancel.addEventListener("click", () => {
    closeConfirm(false);
});

confirmOk.addEventListener("click", () => {
    closeConfirm(true);
});

confirmBackdrop.addEventListener("click", event => {

    if (event.target === confirmBackdrop) {
        closeConfirm(false);
    }

});


/* =========================
   Storage
========================= */

function saveState() {

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );
    } catch (error) {
        console.error(error);
    }
}

function loadState() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return;
        }

        const parsed = JSON.parse(saved);

        if (!parsed || typeof parsed !== "object") {
            return;
        }

        state.running =
            Boolean(parsed.running);

        state.currentRunStart =
            parsed.currentRunStart
                ? Number(parsed.currentRunStart)
                : null;

        state.accumulated =
            Number(parsed.accumulated) || 0;

        state.laps =
            Array.isArray(parsed.laps)
                ? parsed.laps
                    .map(lap => ({
                        id: lap.id,
                        timestamp: Number(lap.timestamp),
                        elapsed: Number(lap.elapsed) || 0
                    }))
                    .filter(lap =>
                        Number.isFinite(lap.timestamp) &&
                        Number.isFinite(lap.elapsed)
                    )
                : [];

    } catch (error) {

        console.error(error);

        state = {
            running: false,
            currentRunStart: null,
            accumulated: 0,
            laps: []
        };
    }
}


/* =========================
   Timer
========================= */

function getElapsed() {

    if (!state.running) {
        return state.accumulated;
    }

    return (
        state.accumulated +
        (Date.now() - state.currentRunStart)
    );
}


function formatStopwatch(ms) {

    ms = Math.max(0, Math.floor(ms));

    const centiseconds =
        Math.floor(ms / 10) % 100;

    const totalSeconds =
        Math.floor(ms / 1000);

    const seconds =
        totalSeconds % 60;

    const totalMinutes =
        Math.floor(totalSeconds / 60);

    const minutes =
        totalMinutes % 60;

    const hours =
        Math.floor(totalMinutes / 60);

    const cc =
        String(centiseconds).padStart(2, "0");

    const ss =
        String(seconds).padStart(2, "0");

    const mm =
        String(minutes).padStart(2, "0");

    if (hours > 0) {

        return (
            hours +
            ":" +
            mm +
            ":" +
            ss +
            "." +
            cc
        );
    }

    return (
        mm +
        ":" +
        ss +
        "." +
        cc
    );
}


function formatStudyTime(ms) {

    ms = Math.max(0, Math.floor(ms));

    const totalSeconds =
        Math.floor(ms / 1000);

    const seconds =
        totalSeconds % 60;

    const totalMinutes =
        Math.floor(totalSeconds / 60);

    const minutes =
        totalMinutes % 60;

    const hours =
        Math.floor(totalMinutes / 60);

    const parts = [];

    if (hours > 0) {
        parts.push(hours + "時間");
    }

    if (minutes > 0) {
        parts.push(minutes + "分");
    }

    if (seconds > 0 || parts.length === 0) {
        parts.push(seconds + "秒");
    }

    return parts.join("");
}


function updateTimer() {

    const elapsed = getElapsed();

    timerElement.textContent =
        formatStopwatch(elapsed);

    timerElement.classList.toggle(
        "long",
        elapsed >= 60 * 60 * 1000
    );

    if (state.running) {

        animationFrame =
            requestAnimationFrame(updateTimer);

    } else {

        animationFrame = null;
    }
}


/* =========================
   Stopwatch
========================= */

function startStopwatch() {

    if (!state.running) {

        state.running = true;

        state.currentRunStart =
            Date.now();

        saveState();

        updateControls();
        updateTimer();

    } else {

        state.accumulated =
            getElapsed();

        state.running = false;
        state.currentRunStart = null;

        saveState();

        updateControls();

        if (animationFrame !== null) {

            cancelAnimationFrame(
                animationFrame
            );

            animationFrame = null;
        }

        updateTimer();
    }
}


async function resetStopwatch() {

    if (state.running) {
        return;
    }

    const hasData =
        state.accumulated > 0 ||
        state.laps.length > 0;

    if (hasData) {

        const confirmed =
            await showConfirm(
                "リセットしますか？",
                "リセット"
            );

        if (!confirmed) {
            return;
        }
    }

    state = {
        running: false,
        currentRunStart: null,
        accumulated: 0,
        laps: []
    };

    saveState();

    updateControls();
    updateTimer();
    renderLaps();
}


/* =========================
   Controls
========================= */

function updateControls() {

    if (state.running) {

        statusTextElement.textContent =
            "FOCUS";

        statusElement.classList.add(
            "running"
        );

        statusElement.classList.remove(
            "paused"
        );

        startStopButton.textContent =
            "停止";

        startStopButton.classList.add(
            "running"
        );

        secondaryButton.textContent =
            "ラップ";

        lapButton.disabled = false;

    } else {

        statusTextElement.textContent =
            state.accumulated > 0
                ? "PAUSED"
                : "READY";

        statusElement.classList.remove(
            "running"
        );

        if (state.accumulated > 0) {

            statusElement.classList.add(
                "paused"
            );

        } else {

            statusElement.classList.remove(
                "paused"
            );
        }

        startStopButton.textContent =
            "開始";

        startStopButton.classList.remove(
            "running"
        );

        secondaryButton.textContent =
            "リセット";

        lapButton.disabled = true;
    }
}


/* =========================
   Laps
========================= */

function calculateLapDuration(index) {

    const lap =
        state.laps[index];

    if (!lap) {
        return 0;
    }

    if (index === state.laps.length - 1) {

        return lap.elapsed;
    }

    const olderLap =
        state.laps[index + 1];

    return Math.max(
        0,
        lap.elapsed - olderLap.elapsed
    );
}


function addLap() {

    if (!state.running) {
        return;
    }

    const elapsed =
        getElapsed();

    state.laps.unshift({
        id:
            Date.now().toString() +
            Math.random()
                .toString(36)
                .slice(2),

        timestamp: Date.now(),

        elapsed: elapsed
    });

    state.laps.sort(
        (a, b) =>
            b.timestamp - a.timestamp
    );

    saveState();
    renderLaps();
}


function renderLaps() {

    lapList.innerHTML = "";

    if (state.laps.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "lap-empty";

        empty.textContent =
            "ラップなし";

        lapList.appendChild(empty);

        return;
    }

    state.laps.forEach(
        (lap, index) => {

            const row =
                document.createElement("div");

            row.className = "lap";

            const info =
                document.createElement("div");

            info.className = "lap-info";

            const number =
                document.createElement("div");

            number.className =
                "lap-number";

            number.textContent =
                "LAP " +
                (state.laps.length - index);

            const time =
                document.createElement("div");

            time.className =
                "lap-time";

            time.textContent =
                formatStopwatch(
                    lap.elapsed
                );

            info.appendChild(number);
            info.appendChild(time);

            const duration =
                document.createElement("div");

            duration.className =
                "lap-duration";

            duration.textContent =
                formatStudyTime(
                    calculateLapDuration(index)
                );

            row.appendChild(info);
            row.appendChild(duration);

            row.addEventListener(
                "click",
                () => openEditModal(lap.id)
            );

            lapList.appendChild(row);
        }
    );
}


/* =========================
   Time picker
========================= */

function populateTimePicker() {

    hourSelect.innerHTML = "";
    minuteSelect.innerHTML = "";
    secondSelect.innerHTML = "";

    for (let i = 0; i <= 99; i++) {

        const option =
            document.createElement("option");

        option.value = i;
        option.textContent =
            String(i).padStart(2, "0");

        hourSelect.appendChild(option);
    }

    for (let i = 0; i <= 59; i++) {

        const minuteOption =
            document.createElement("option");

        minuteOption.value = i;
        minuteOption.textContent =
            String(i).padStart(2, "0");

        minuteSelect.appendChild(
            minuteOption
        );

        const secondOption =
            document.createElement("option");

        secondOption.value = i;
        secondOption.textContent =
            String(i).padStart(2, "0");

        secondSelect.appendChild(
            secondOption
        );
    }
}


/* =========================
   Edit lap
========================= */

function openEditModal(id) {

    if (state.running) {
        return;
    }

    const lap =
        state.laps.find(
            item => item.id === id
        );

    if (!lap) {
        return;
    }

    editingLapId = id;

    const totalSeconds =
        Math.floor(lap.elapsed / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    hourSelect.value =
        Math.min(99, hours);

    minuteSelect.value =
        minutes;

    secondSelect.value =
        seconds;

    editBackdrop.classList.add(
        "show"
    );
}


function closeEditModal() {

    editBackdrop.classList.remove(
        "show"
    );

    editingLapId = null;
}


function saveEdit() {

    if (!editingLapId) {
        return;
    }

    const lap =
        state.laps.find(
            item => item.id === editingLapId
        );

    if (!lap) {
        closeEditModal();
        return;
    }

    const hours =
        Number(hourSelect.value);

    const minutes =
        Number(minuteSelect.value);

    const seconds =
        Number(secondSelect.value);

    const newElapsed =
        (
            hours * 3600 +
            minutes * 60 +
            seconds
        ) * 1000;

    const oldElapsed =
        lap.elapsed;

    const difference =
        newElapsed - oldElapsed;

    lap.elapsed =
        newElapsed;

    /*
       新しいラップ時間との差分を
       より新しいラップにも反映
    */
    state.laps.forEach(item => {

        if (
            item.id !== lap.id &&
            item.elapsed >= oldElapsed
        ) {
            item.elapsed += difference;
        }
    });

    state.accumulated =
        Math.max(
            0,
            state.accumulated + difference
        );

    normalizeLaps();

    saveState();

    renderLaps();
    updateTimer();

    closeEditModal();
}


function normalizeLaps() {

    state.laps.sort(
        (a, b) =>
            b.elapsed - a.elapsed
    );

    for (
        let i = state.laps.length - 2;
        i >= 0;
        i--
    ) {

        if (
            state.laps[i].elapsed <
            state.laps[i + 1].elapsed
        ) {

            state.laps[i].elapsed =
                state.laps[i + 1].elapsed;
        }
    }

    state.laps.sort(
        (a, b) =>
            b.timestamp - a.timestamp
    );
}


/* =========================
   Delete lap
========================= */

async function deleteLap(id) {

    const index =
        state.laps.findIndex(
            lap => lap.id === id
        );

    if (index === -1) {
        return;
    }

    const confirmed =
        await showConfirm(
            "ラップを削除しますか？",
            "削除"
        );

    if (!confirmed) {
        return;
    }

    state.laps =
        state.laps.filter(
            lap => lap.id !== id
        );

    normalizeLaps();

    saveState();

    renderLaps();

    closeEditModal();
}


/* =========================
   Edit modal events
========================= */

editCancel.addEventListener(
    "click",
    closeEditModal
);

editSave.addEventListener(
    "click",
    saveEdit
);

editBackdrop.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            editBackdrop
        ) {
            closeEditModal();
        }
    }
);


/*
   ラップ編集画面を開いている状態で
   長押し等をしても選択状態になりにくくする
*/
document.addEventListener(
    "contextmenu",
    event => {
        if (
            event.target.closest(
                ".circle-button, .lap-button, .lap"
            )
        ) {
            event.preventDefault();
        }
    }
);


/* =========================
   Button events
========================= */

startStopButton.addEventListener(
    "click",
    startStopwatch
);

secondaryButton.addEventListener(
    "click",
    () => {

        if (state.running) {
            addLap();
        } else {
            resetStopwatch();
        }
    }
);

lapButton.addEventListener(
    "click",
    addLap
);


/* =========================
   Long press lap deletion
========================= */

let longPressTimer = null;
let longPressTriggered = false;

lapList.addEventListener(
    "pointerdown",
    event => {

        const row =
            event.target.closest(".lap");

        if (!row) {
            return;
        }

        longPressTriggered = false;

        longPressTimer =
            setTimeout(async () => {

                longPressTriggered = true;

                const index =
                    [...lapList.children]
                        .indexOf(row);

                if (index < 0) {
                    return;
                }

                const lap =
                    state.laps[index];

                if (lap) {
                    await deleteLap(
                        lap.id
                    );
                }

            }, 600);
    }
);

function cancelLongPress() {

    if (longPressTimer !== null) {

        clearTimeout(longPressTimer);

        longPressTimer = null;
    }
}

lapList.addEventListener(
    "pointerup",
    cancelLongPress
);

lapList.addEventListener(
    "pointercancel",
    cancelLongPress
);

lapList.addEventListener(
    "pointerleave",
    cancelLongPress
);


/* =========================
   Prevent accidental zoom
========================= */

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gesturechange",
    event => {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gestureend",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


/* =========================
   Initialize
========================= */

populateTimePicker();

loadState();

updateControls();

updateTimer();

renderLaps();

if (state.running) {
    updateTimer();
}
</script>

</html>
