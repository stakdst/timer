<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Stopwatch</title>
<style>
:root {
    --bg1: #f5f7fb;
    --bg2: #e9edf5;
    --text: #17191c;
    --sub: #8a8f98;
    --line: rgba(0,0,0,.08);
    --card: rgba(255,255,255,.72);
    --blue: #007aff;
    --red: #ff3b30;
    --green: #34c759;
}
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}
body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    color: var(--text);
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.95),
            rgba(255,255,255,0) 45%
        ),
        linear-gradient(
            180deg,
            var(--bg1),
            var(--bg2)
        );
    min-height: 100vh;
    min-height: 100dvh;
    padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(30px, env(safe-area-inset-bottom));
    overflow-x: hidden;
}
.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}
/* ========================================
   Header
======================================== */
.header {
    text-align: center;
    margin-bottom: 25px;
}
.brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--sub);
}
.status {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--sub);
}
.status.running {
    color: var(--green);
}
.status.paused {
    color: var(--red);
}
/* ========================================
   Timer
======================================== */
.timer-area {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-top: 25px;
    margin-bottom: 48px;
    overflow: hidden;
}
.timer {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    /*
        タイマーを大きく表示
    */
    font-size: clamp(72px, 15vw, 170px);
    font-weight: 300;
    letter-spacing: -.055em;
    line-height: 1;
    white-space: nowrap;
    color: #111318;
    text-align: center;
}
/*
    1時間以上になると
    HHが追加されて横幅が増えるため、
    少しだけ縮小する
*/
.timer.with-hours {
    font-size: clamp(62px, 13vw, 150px);
}
/* ========================================
   Controls
======================================== */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(22px, 6vw, 44px);
    margin-bottom: 58px;
}
.circle-button {
    width: clamp(92px, 18vw, 126px);
    height: clamp(92px, 18vw, 126px);
    border-radius: 50%;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(16px, 3vw, 20px);
    font-weight: 500;
    cursor: pointer;
    transition:
        transform .12s ease,
        filter .12s ease;
    box-shadow:
        0 8px 24px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.8);
}
.circle-button:active {
    transform: scale(.94);
}
.circle-button.left {
    background: rgba(255,255,255,.85);
    color: var(--text);
}
.circle-button.right {
    background: var(--blue);
    color: white;
    box-shadow:
        0 10px 28px rgba(0,122,255,.25),
        inset 0 1px 0 rgba(255,255,255,.25);
}
.circle-button.stop {
    background: var(--red);
    box-shadow:
        0 10px 28px rgba(255,59,48,.22),
        inset 0 1px 0 rgba(255,255,255,.25);
}
/* ========================================
   Laps
======================================== */
.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px 12px;
    border-bottom: 1px solid var(--line);
}
.section-title span:first-child {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--sub);
}
.section-title span:last-child {
    font-size: 12px;
    color: var(--sub);
}
.laps {
    margin-top: 0;
    border-radius: 20px;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
    box-shadow:
        0 8px 30px rgba(0,0,0,.05);
}
.lap-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    min-height: 72px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition:
        background .15s ease;
}
.lap-row:last-child {
    border-bottom: none;
}
.lap-row:active {
    background: rgba(0,0,0,.04);
}
.lap-date {
    font-size: 13px;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
}
.lap-number {
    font-size: 12px;
    color: var(--sub);
}
.lap-duration {
    font-size: 18px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-align: right;
}
.empty {
    padding: 36px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--sub);
}
/* ========================================
   Edit Modal
======================================== */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.28);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}
.modal-backdrop.show {
    display: flex;
}
.modal {
    width: min(100%, 520px);
    background: rgba(250,250,252,.96);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 26px 26px 0 0;
    padding:
        22px
        22px
        max(22px, env(safe-area-inset-bottom));
    box-shadow:
        0 -10px 40px rgba(0,0,0,.12);
    animation: slideUp .2s ease-out;
}
@keyframes slideUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}
.modal-title {
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 20px;
}
.form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    margin-bottom: 7px;
}
.form-input {
    width: 100%;
    height: 48px;
    border:
        1px solid rgba(0,0,0,.08);
    border-radius: 13px;
    background: white;
    padding: 0 14px;
    font-size: 16px;
    outline: none;
}
.form-input:focus {
    border-color: var(--blue);
}
.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}
.modal-button {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
}
.modal-cancel {
    background: rgba(0,0,0,.07);
    color: var(--text);
}
.modal-save {
    background: var(--blue);
    color: white;
}
/* ========================================
   iPad
======================================== */
@media (min-width: 600px) {
    body {
        padding-left: 32px;
        padding-right: 32px;
    }
    .header {
        margin-bottom: 30px;
    }
    .timer-area {
        margin-top: 30px;
        margin-bottom: 55px;
    }
    .controls {
        margin-bottom: 68px;
    }
    .lap-row {
        min-height: 82px;
        padding-left: 24px;
        padding-right: 24px;
    }
    .lap-duration {
        font-size: 20px;
    }
}
/* ========================================
   PC
======================================== */
@media (min-width: 900px) {
    body {
        padding-top: 40px;
    }
    .app {
        max-width: 1100px;
    }
    .timer {
        font-size:
            clamp(110px, 12vw, 175px);
    }
    .timer.with-hours {
        font-size:
            clamp(95px, 10.5vw, 155px);
    }
    .timer-area {
        margin-top: 42px;
        margin-bottom: 62px;
    }
    .controls {
        margin-bottom: 76px;
    }
    .laps {
        border-radius: 24px;
    }
}
/* ========================================
   Very large screen
======================================== */
@media (min-width: 1200px) {
    .app {
        max-width: 1200px;
    }
    .timer {
        font-size: 175px;
    }
    .timer.with-hours {
        font-size: 155px;
    }
}
/* ========================================
   Small phones
======================================== */
@media (max-width: 380px) {
    body {
        padding-left: 12px;
        padding-right: 12px;
    }
    .timer {
        font-size: 62px;
        letter-spacing: -.06em;
    }
    .timer.with-hours {
        font-size: 52px;
    }
    .controls {
        gap: 18px;
    }
    .circle-button {
        width: 88px;
        height: 88px;
    }
    .lap-row {
        padding-left: 14px;
        padding-right: 14px;
    }
}
</style>
</head>
<body>
<div class="app">
    <!-- ====================================
         Header
    ===================================== -->
    <header class="header">
        <div class="brand">
            STUDY STOPWATCH
        </div>
        <div id="status" class="status">
            READY
        </div>
    </header>
    <main>
        <!-- ====================================
             Timer
        ===================================== -->
        <div class="timer-area">
            <div id="timer" class="timer">
                00:00.00
            </div>
        </div>
        <!-- ====================================
             Controls
        ===================================== -->
        <div class="controls">
            <button
                id="leftButton"
                class="circle-button left"
                type="button"
            >
                ラップ
            </button>
            <button
                id="rightButton"
                class="circle-button right"
                type="button"
            >
                停止
            </button>
        </div>
        <!-- ====================================
             Laps
        ===================================== -->
        <section>
            <div class="section-title">
                <span>
                    LAPS
                </span>
                <span id="lapCount">
                    0
                </span>
            </div>
            <div id="laps" class="laps">
                <div id="emptyMessage" class="empty">
                    ラップを記録すると、ここに表示されます
                </div>
            </div>
        </section>
    </main>
</div>
<!-- ========================================
     Edit Modal
========================================= -->
<div
    id="modalBackdrop"
    class="modal-backdrop"
>
    <div class="modal">
        <div class="modal-title">
            ラップ時刻を編集
        </div>
        <label
            class="form-label"
            for="editDate"
        >
            日時
        </label>
        <input
            id="editDate"
            class="form-input"
            type="datetime-local"
        >
        <div class="modal-buttons">
            <button
                id="cancelEdit"
                class="modal-button modal-cancel"
                type="button"
            >
                キャンセル
            </button>
            <button
                id="saveEdit"
                class="modal-button modal-save"
                type="button"
            >
                保存
            </button>
        </div>
    </div>
</div>
<script>
/* =====================================================
   Study Stopwatch
===================================================== */
const STORAGE_KEY =
    "studyStopwatch_v3";
/* =====================================================
   State
===================================================== */
let state = {
    running: false,
    accumulated: 0,
    currentRunStart: null,
    laps: []
};
let editingLapId = null;
/* =====================================================
   DOM
===================================================== */
const timerEl =
    document.getElementById("timer");
const statusEl =
    document.getElementById("status");
const leftButton =
    document.getElementById("leftButton");
const rightButton =
    document.getElementById("rightButton");
const lapsEl =
    document.getElementById("laps");
const lapCountEl =
    document.getElementById("lapCount");
const emptyMessage =
    document.getElementById("emptyMessage");
const modalBackdrop =
    document.getElementById("modalBackdrop");
const editDate =
    document.getElementById("editDate");
const cancelEdit =
    document.getElementById("cancelEdit");
const saveEdit =
    document.getElementById("saveEdit");
/* =====================================================
   Storage
===================================================== */
function saveState() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}
function loadState() {
    const saved =
        localStorage.getItem(STORAGE_KEY);
    if (!saved) {
        return;
    }
    try {
        const parsed =
            JSON.parse(saved);
        state = {
            running:
                !!parsed.running,
            accumulated:
                Number(parsed.accumulated) || 0,
            currentRunStart:
                parsed.currentRunStart
                    ? Number(parsed.currentRunStart)
                    : null,
            laps:
                Array.isArray(parsed.laps)
                    ? parsed.laps.map(lap => ({
                        id:
                            lap.id,
                        timestamp:
                            Number(lap.timestamp),
                        elapsed:
                            Number(lap.elapsed) || 0,
                        _totalElapsed:
                            Number(lap._totalElapsed) || 0
                    }))
                    : []
        };
    } catch (e) {
        console.error(
            "保存データの読み込みに失敗しました。"
        );
    }
}
/* =====================================================
   Elapsed Time
===================================================== */
function getElapsed() {
    if (!state.running) {
        return state.accumulated;
    }
    return (
        state.accumulated +
        (Date.now() - state.currentRunStart)
    );
}
/* =====================================================
   Timer Formatting
===================================================== */
/*
    1時間未満
    → 00:00.00
    1時間以上
    → 1:00:00.00
    10時間以上
    → 10:00:00.00
    100時間以上
    → 100:00:00.00
*/
function formatTimer(ms) {
    ms = Math.max(0, ms);
    const totalHundredths =
        Math.floor(ms / 10);
    const hundredths =
        totalHundredths % 100;
    const totalSeconds =
        Math.floor(
            totalHundredths / 100
        );
    const seconds =
        totalSeconds % 60;
    const totalMinutes =
        Math.floor(
            totalSeconds / 60
        );
    const minutes =
        totalMinutes % 60;
    const hours =
        Math.floor(
            totalMinutes / 60
        );
    const ss =
        String(seconds)
            .padStart(2, "0");
    const mm =
        String(minutes)
            .padStart(2, "0");
    const hs =
        String(hundredths)
            .padStart(2, "0");
    /*
        1時間未満
        MM:SS.00
    */
    if (hours === 0) {
        return `${mm}:${ss}.${hs}`;
    }
    /*
        1時間以上
        H:MM:SS.00
        Hは2桁固定にしない
    */
    return `${hours}:${mm}:${ss}.${hs}`;
}
/* =====================================================
   Lap Duration Formatting
===================================================== */
function formatDuration(ms) {
    ms = Math.max(0, ms);
    const totalSeconds =
        Math.floor(ms / 1000);
    const seconds =
        totalSeconds % 60;
    const totalMinutes =
        Math.floor(totalSeconds / 60);
    const minutes =
        totalMinutes % 60;
    const hours =
        Math.floor(totalMinutes / 60);
    if (hours > 0) {
        if (minutes > 0) {
            return `${hours}時間${minutes}分`;
        }
        return `${hours}時間`;
    }
    if (minutes > 0) {
        if (seconds > 0) {
            return `${minutes}分${seconds}秒`;
        }
        return `${minutes}分`;
    }
    return `${seconds}秒`;
}
/* =====================================================
   Lap Date
===================================================== */
function formatLapDate(timestamp) {
    const d =
        new Date(timestamp);
    const month =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");
    const day =
        String(
            d.getDate()
        ).padStart(2, "0");
    const hour =
        String(
            d.getHours()
        ).padStart(2, "0");
    const minute =
        String(
            d.getMinutes()
        ).padStart(2, "0");
    return `${month}/${day} ${hour}:${minute}`;
}
/* =====================================================
   datetime-local
===================================================== */
function toDatetimeLocal(timestamp) {
    const d =
        new Date(timestamp);
    const year =
        d.getFullYear();
    const month =
        String(
            d.getMonth() + 1
        ).padStart(2, "0");
    const day =
        String(
            d.getDate()
        ).padStart(2, "0");
    const hours =
        String(
            d.getHours()
        ).padStart(2, "0");
    const minutes =
        String(
            d.getMinutes()
        ).padStart(2, "0");
    return (
        `${year}-${month}-${day}` +
        `T${hours}:${minutes}`
    );
}
/* =====================================================
   Update Timer
===================================================== */
function updateTimer() {
    const elapsed =
        getElapsed();
    timerEl.textContent =
        formatTimer(elapsed);
    /*
        1時間を超えたら
        hour表示用クラスを追加
    */
    if (elapsed >= 3600000) {
        timerEl.classList.add(
            "with-hours"
        );
    } else {
        timerEl.classList.remove(
            "with-hours"
        );
    }
    if (state.running) {
        statusEl.textContent =
            "FOCUS";
        statusEl.className =
            "status running";
    } else if (
        state.accumulated > 0
    ) {
        statusEl.textContent =
            "PAUSED";
        statusEl.className =
            "status paused";
    } else {
        statusEl.textContent =
            "READY";
        statusEl.className =
            "status";
    }
}
/* =====================================================
   Buttons
===================================================== */
function updateButtons() {
    if (state.running) {
        leftButton.textContent =
            "ラップ";
        rightButton.textContent =
            "停止";
        rightButton.classList.add(
            "stop"
        );
    } else {
        leftButton.textContent =
            "リセット";
        rightButton.textContent =
            "開始";
        rightButton.classList.remove(
            "stop"
        );
    }
}
/* =====================================================
   Render Laps
===================================================== */
function renderLaps() {
    lapCountEl.textContent =
        state.laps.length;
    if (
        state.laps.length === 0
    ) {
        lapsEl.innerHTML = "";
        lapsEl.appendChild(
            emptyMessage
        );
        return;
    }
    const fragment =
        document.createDocumentFragment();
    state.laps.forEach(
        (lap, index) => {
            const row =
                document.createElement(
                    "div"
                );
            row.className =
                "lap-row";
            row.dataset.id =
                lap.id;
            const left =
                document.createElement(
                    "div"
                );
            const date =
                document.createElement(
                    "div"
                );
            date.className =
                "lap-date";
            date.textContent =
                formatLapDate(
                    lap.timestamp
                );
            const number =
                document.createElement(
                    "div"
                );
            number.className =
                "lap-number";
            number.textContent =
                `LAP ${index + 1}`;
            left.appendChild(date);
            left.appendChild(number);
            const duration =
                document.createElement(
                    "div"
                );
            duration.className =
                "lap-duration";
            duration.textContent =
                formatDuration(
                    lap.elapsed
                );
            row.appendChild(left);
            row.appendChild(duration);
            row.addEventListener(
                "click",
                () => openEdit(lap.id)
            );
            fragment.appendChild(row);
        }
    );
    lapsEl.innerHTML = "";
    lapsEl.appendChild(
        fragment
    );
}
/* =====================================================
   Start
===================================================== */
function start() {
    if (state.running) {
        return;
    }
    state.running = true;
    state.currentRunStart =
        Date.now();
    saveState();
    updateButtons();
    updateTimer();
    requestAnimationFrame(tick);
}
/* =====================================================
   Stop
===================================================== */
function stop() {
    if (!state.running) {
        return;
    }
    state.accumulated =
        getElapsed();
    state.running = false;
    state.currentRunStart =
        null;
    saveState();
    updateButtons();
    updateTimer();
}
/* =====================================================
   Reset
===================================================== */
function reset() {
    if (state.running) {
        return;
    }
    state.accumulated = 0;
    state.currentRunStart = null;
    state.laps = [];
    saveState();
    updateButtons();
    updateTimer();
    renderLaps();
}
/* =====================================================
   Add Lap
===================================================== */
function addLap() {
    if (!state.running) {
        return;
    }
    const now =
        Date.now();
    const elapsed =
        getElapsed();
    const previousTotal =
        state.laps.length > 0
            ? (
                state.laps[
                    state.laps.length - 1
                ]._totalElapsed || 0
            )
            : 0;
    const lapDuration =
        elapsed - previousTotal;
    const lap = {
        id:
            Date.now() +
            Math.random(),
        timestamp:
            now,
        elapsed:
            lapDuration,
        _totalElapsed:
            elapsed
    };
    state.laps.push(lap);
    saveState();
    renderLaps();
}
/* =====================================================
   Open Edit
===================================================== */
function openEdit(id) {
    const lap =
        state.laps.find(
            item =>
                item.id === id
        );
    if (!lap) {
        return;
    }
    editingLapId =
        id;
    editDate.value =
        toDatetimeLocal(
            lap.timestamp
        );
    modalBackdrop.classList.add(
        "show"
    );
    setTimeout(
        () => editDate.focus(),
        100
    );
}
/* =====================================================
   Close Edit
===================================================== */
function closeEdit() {
    modalBackdrop.classList.remove(
        "show"
    );
    editingLapId = null;
}
/* =====================================================
   Save Edited Lap
===================================================== */
function saveEditedLap() {
    if (
        editingLapId === null
    ) {
        return;
    }
    const lap =
        state.laps.find(
            item =>
                item.id === editingLapId
        );
    if (!lap) {
        closeEdit();
        return;
    }
    const newTimestamp =
        new Date(
            editDate.value
        ).getTime();
    if (
        !Number.isFinite(
            newTimestamp
        )
    ) {
        return;
    }
    const oldTimestamp =
        lap.timestamp;
    const difference =
        newTimestamp -
        oldTimestamp;
    /*
        ラップ時刻を変更
    */
    lap.timestamp =
        newTimestamp;
    lap.elapsed +=
        difference;
    /*
        後続ラップも連動させる
    */
    state.laps.forEach(
        other => {
            if (
                other.id !== lap.id &&
                other.timestamp >= oldTimestamp
            ) {
                other.timestamp +=
                    difference;
                other.elapsed +=
                    difference;
            }
        }
    );
    /*
        ストップウォッチ本体も連動
    */
    state.accumulated +=
        difference;
    if (state.running) {
        state.currentRunStart +=
            difference;
    }
    /*
        時刻順に並べ直す
    */
    state.laps.sort(
        (a, b) =>
            a.timestamp -
            b.timestamp
    );
    saveState();
    renderLaps();
    updateTimer();
    closeEdit();
}
/* =====================================================
   Event Listeners
===================================================== */
leftButton.addEventListener(
    "click",
    () => {
        if (state.running) {
            addLap();
        } else {
            reset();
        }
    }
);
rightButton.addEventListener(
    "click",
    () => {
        if (state.running) {
            stop();
        } else {
            start();
        }
    }
);
cancelEdit.addEventListener(
    "click",
    closeEdit
);
saveEdit.addEventListener(
    "click",
    saveEditedLap
);
modalBackdrop.addEventListener(
    "click",
    event => {
        if (
            event.target ===
            modalBackdrop
        ) {
            closeEdit();
        }
    }
);
/* =====================================================
   Animation
===================================================== */
function tick() {
    if (!state.running) {
        return;
    }
    updateTimer();
    requestAnimationFrame(
        tick
    );
}
/* =====================================================
   Initialize
===================================================== */
loadState();
updateButtons();
updateTimer();
renderLaps();
if (state.running) {
    requestAnimationFrame(
        tick
    );
}
</script>
</body>
</html>
