<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./timer.png">
    <link rel="apple-touch-icon" href="./timer.png">
    <title>Study Timer</title>
    <style>
        :root {
            --glass-line: rgba(255, 255, 255, .25);
            --glass-highlight: rgba(255, 255, 255, .26);
            --glass-shadow: rgba(0, 0, 0, .22);
            --card-glass-1: rgba(255, 255, 255, .40);
            --card-glass-2: rgba(255, 255, 255, .20);
            --card-glass-3: rgba(255, 255, 255, .08);
        }

        /* ==== BASE ==== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100lvh;
            min-height: 100%;
            min-height: 100lvh;
            background: #080808;
            color: #f5f5f7;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
        }

        /* ==== APP ==== */
        .app {
            width: 100%;
            height: 100dvh;
            min-height: 0;
            padding:
                max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 50% -10%,
                    #292929 0%,
                    #111 38%,
                    #080808 75%);
            overflow: hidden;
        }

        /* ==== HEADER ==== */
        header {
            width: 100%;
            max-width: 760px;
            height: 30px;
            margin:
                0 auto 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .title {
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #555;
            font-size: 11px;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
        }

        .status.running {
            color: #888;
        }

        .status.running .status-dot {
            background: #30d158;
            box-shadow:
                0 0 8px rgba(48, 209, 88, .7);
        }

        /* ==== MAIN ==== */
        main {
            width: 100%;
            max-width: 760px;
            height:
                calc(100dvh - 32px - 30px - 20px - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ==== TIMER ==== */
        .timer-area {
            width: 100%;
            text-align: center;
            margin:
                50px 0;
            flex-shrink: 0;
        }

        .timer {
            color: #f5f5f7;
            font-size:
                clamp(66px, 22vw, 165px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -3px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .timer.long {
            font-size:
                clamp(58px, 16.5vw, 165px);
            letter-spacing: -3px;
        }

        /* ==== CONTROLS ==== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(310px, 100%);
            margin:
                0 auto 50px;
            flex-shrink: 0;
        }

        .circle-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #252527;
            color: #eeeeee;
            font-size: 15px;
            font-weight: 500;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .05),
                0 8px 30px rgba(0, 0, 0, .35);
            transition:
                transform .12s ease,
                background .2s ease,
                opacity .2s ease;
        }

        .circle-button:active {
            transform: scale(.93);
        }

        .circle-button.primary {
            background: #b8b8ba;
            color: #111;
        }

        .circle-button.primary.running {
            background: #9f3430;
            color: #fff;
        }

        /* ==== LAP SECTION ==== */
        main>section:last-child {
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }

        /* ==== LAP HEADER ==== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding:
                0 5px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .section-title {
            color: #777;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .lap-count {
            color: #555;
            font-size: 12px;
        }

        /* ==== LAP LIST ==== */
        .laps {
            border-top:
                1px solid #242424;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: none;
            flex: 1;
        }

        .laps::-webkit-scrollbar {
            display: none;
        }

        /* ==== 2段階左スワイプ用 ==== */
        .row {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-bottom:
                1px solid #202020;
        }

        .row .item {
            position: relative;
            z-index: 1;
            width: 100%;
            background: #080808;
            touch-action: pan-y;
            will-change: transform;
        }

        .row.removing .item {
            transition:
                transform .24s cubic-bezier(.2, .9, .25, 1),
                opacity .24s ease;
        }

        /* ==== 削除背景 ==== */
        .row-bg {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--delete-width, 0px);
            border-radius:
                0 8px 8px 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 0;
            opacity: 0;
            transition:
                opacity .16s,
                background .2s;
            cursor: pointer;
            z-index: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .row.swiping .row-bg,
        .row.open .row-bg {
            opacity: 1;
            background:
                rgba(255, 60, 105, .62);
        }

        .row.armed .row-bg {
            background:
                rgba(255, 60, 105, .62);
        }

        .row-bg .trash {
            width: 26px;
            height: 26px;
            opacity: .96;
            transition:
                transform .18s cubic-bezier(.2, .9, .25, 1);
            pointer-events: none;
        }

        .row.armed .row-bg .trash {
            transform: scale(1.22);
        }

        /* ==== LAP ==== */
        .lap {
            display: grid;
            grid-template-columns:
                1fr auto;
            align-items: center;
            min-height: 0;
            padding:
                12px 5px;
            border-bottom: none;
            cursor: pointer;
            transition:
                background .15s ease;
        }

        .lap:active {
            background: #181818;
        }

        .lap-day {
            display: flex;
            align-items: center;
            min-width: 0;
            color: #ddd;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        .lap-number {
            width: 48px;
            color: #555;
            font-size: 10px;
            flex-shrink: 0;
        }

        .lap-time {
            color: #eee;
            font-size: 16px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .empty {
            padding:
                42px 0;
            color: #555;
            font-size: 13px;
            text-align: center;
        }

        /* ==== MODAL ==== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(520px, 100%);
            padding:
                22px 22px max(25px, env(safe-area-inset-bottom));
            border: 1px solid var(--glass-line);
            border-radius:
                24px 24px 0 0;
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(0, 0, 0, .08),
                0 -15px 50px var(--glass-shadow);
            animation:
                slideUp .2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-title {
            margin-bottom: 25px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #888;
            font-size: 11px;
            letter-spacing: .7px;
        }

        input {
            width: 100%;
            padding:
                13px 14px;
            border: none;
            outline: none;
            border-radius: 11px;
            background: #2c2c2e;
            color: #fff;
            font-size: 16px;
        }

        /* ==== REEL PICKER ==== */
        .time-picker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 150px;
            overflow: hidden;
            --reel-item-height: 50px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .time-picker::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 50px;
            transform: translateY(-50%);
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
            pointer-events: none;
            border-radius: 10px;
        }

        .time-reel {
            position: relative;
            width: 82px;
            height: 150px;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: none;
            scroll-snap-type: none;
            -webkit-overflow-scrolling: auto;
            scrollbar-width: none;
            padding-top: 50px;
            padding-bottom: 50px;
            border-radius: 11px;
            user-select: none;
            -webkit-user-select: none;
            will-change: scroll-position;
            -webkit-tap-highlight-color: transparent;
        }

        .time-reel::-webkit-scrollbar {
            display: none;
        }

        .time-reel-item {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 22px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            transition:
                color .12s ease,
                transform .12s ease,
                opacity .12s ease;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .time-reel-item.selected {
            color: #fff;
            font-weight: 500;
            transform: scale(1.08);
        }

        .time-unit {
            flex-shrink: 0;
            width: 24px;
            color: #777;
            font-size: 12px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==== REST OF MODAL ==== */
        .info {
            margin-top: 5px;
            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-button {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 12px;
            background:
                linear-gradient(145deg,
                    var(--card-glass-2),
                    var(--card-glass-3));
            color: #eee;
            font-size: 15px;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, .12),
                inset 0 -1px 1px rgba(0, 0, 0, .08);
        }

        .modal-button:active {
            opacity: .7;
        }

        .modal-button.save {
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .82),
                    rgba(255, 255, 255, .62));
            color: #111;
            font-weight: 600;
            border-color: rgba(255, 255, 255, .42);
        }

        /* ==== CONFIRM MODAL ==== */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(0, 0, 0, .55);
            z-index: 200;
        }

        .confirm-overlay.show {
            display: flex;
        }

        .confirm-box {
            width: min(320px, 100%);
            overflow: hidden;
            border: 1px solid var(--glass-line);
            border-radius: 18px;
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(0, 0, 0, .08),
                0 15px 50px var(--glass-shadow);
            animation:
                confirmAppear .18s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        @keyframes confirmAppear {
            from {
                transform: scale(.94);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .confirm-content {
            padding:
                22px 20px 20px;
            text-align: center;
        }

        .confirm-title {
            margin-bottom: 7px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .confirm-message {
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
        }

        .confirm-buttons {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            border-top:
                1px solid rgba(255, 255, 255, .16);
            background: rgba(255, 255, 255, .035);
        }

        .confirm-button {
            min-height: 44px;
            padding: 0;
            border-radius: 0;
            background: transparent;
            color: #0a84ff;
            font-size: 17px;
            font-weight: 500;
        }

        .confirm-button+.confirm-button {
            border-left:
                1px solid rgba(255, 255, 255, .16);
        }

        .confirm-button:active {
            background: #3a3a3c;
        }

        .confirm-button.danger {
            color: #ff453a;
        }

        /* ==== iPAD / LANDSCAPE ==== */
        @media (min-width: 600px) {
            .app {
                padding:
                    max(32px, env(safe-area-inset-top)) 48px max(32px, env(safe-area-inset-bottom)) 48px;
            }

            header,
            main {
                max-width: 900px;
            }

            header {
                margin-bottom: 25px;
            }

            main {
                height:
                    calc(100dvh - 32px - 30px - 25px - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns:
                    minmax(90px, 1fr) minmax(360px, 650px) minmax(90px, 1fr);
                grid-template-rows:
                    auto minmax(0, 1fr);
                column-gap: 30px;
                align-items: start;
            }

            .title {
                font-size: 15px;
                letter-spacing: 2.5px;
            }

            .status {
                font-size: 12px;
            }

            .timer-area {
                grid-column: 1 / 4;
                grid-row: 1;
                margin:
                    20px 0 45px;
                padding: 0;
            }

            .timer {
                font-size:
                    clamp(110px, 18vw, 190px);
                letter-spacing: -5px;
            }

            .timer.long {
                font-size:
                    clamp(110px, 18vw, 190px);
            }

            .controls {
                grid-column: 1 / 4;
                grid-row: 2;
                display: grid;
                grid-template-columns:
                    minmax(90px, 1fr) minmax(360px, 650px) minmax(90px, 1fr);
                column-gap: 30px;
                align-items: start;
                justify-content: initial;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                pointer-events: none;
                z-index: 2;
            }

            #secondaryButton {
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
                margin: 0;
                pointer-events: auto;
            }

            #startStopButton {
                grid-column: 3;
                grid-row: 1;
                justify-self: end;
                margin: 0;
                pointer-events: auto;
            }

            .circle-button {
                width: 90px;
                height: 90px;
                font-size: 15px;
            }

            main>section:last-child {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
                height: 100%;
                min-height: 0;
                z-index: 1;
            }

            .section-header {
                padding:
                    0 8px;
                margin-bottom: 10px;
            }

            .section-title {
                font-size: 13px;
            }

            .lap-count {
                font-size: 13px;
            }

            .lap {
                padding:
                    12px 8px;
            }

            .lap-day {
                font-size: 16px;
            }

            .lap-number {
                width: 65px;
                font-size: 10px;
            }

            .lap-time {
                font-size: 17px;
            }
        }

        /* ==== iPHONE LANDSCAPE ==== */
        @media (orientation: landscape) and (max-width: 599px) {
            .app {
                padding:
                    max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            }

            header {
                height: 20px;
                margin:
                    0 auto;
                max-width: 900px;
            }

            .title {
                font-size: 11px;
                letter-spacing: 1.8px;
            }

            .status {
                font-size: 9px;
                gap: 5px;
                letter-spacing: 1px;
            }

            .status-dot {
                width: 5px;
                height: 5px;
            }

            main {
                width: 100%;
                max-width: 900px;
                height:
                    calc(100dvh - 10px - 22px - 8px - 10px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns:
                    minmax(72px, 1fr) minmax(250px, 520px) minmax(72px, 1fr);
                grid-template-rows:
                    auto minmax(0, 1fr);
                column-gap: 16px;
                align-items: start;
            }

            .timer-area {
                grid-column: 1 / 4;
                grid-row: 1;
                margin: 0;
                padding: 0;
            }

            .timer {
                font-size:
                    clamp(52px, 12vw, 85px);
                line-height: .92;
                letter-spacing: -3px;
            }

            .timer.long {
                font-size:
                    clamp(52px, 12vw, 85px);
                letter-spacing: -3px;
            }

            .controls {
                grid-column: 1 / 4;
                grid-row: 2;
                display: grid;
                grid-template-columns:
                    minmax(72px, 1fr) minmax(250px, 520px) minmax(72px, 1fr);
                column-gap: 16px;
                align-items: start;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                pointer-events: none;
                z-index: 2;
            }

            #secondaryButton {
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
                margin: 0;
                pointer-events: auto;
            }

            #startStopButton {
                grid-column: 3;
                grid-row: 1;
                justify-self: end;
                margin: 0;
                pointer-events: auto;
            }

            .circle-button {
                width: 75px;
                height: 75px;
                font-size: 13px;
            }

            main>section:last-child {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
                height: 100%;
                min-height: 0;
                display: flex;
                flex-direction: column;
                z-index: 1;
            }

            .section-header {
                padding:
                    0 5px;
                margin-bottom: 6px;
            }

            .section-title {
                font-size: 10px;
                letter-spacing: 1.8px;
            }

            .lap-count {
                font-size: 10px;
            }

            .laps {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            .lap {
                padding:
                    7px 5px;
            }

            .lap-day {
                font-size: 12px;
            }

            .lap-number {
                width: 48px;
                font-size: 8px;
            }

            .lap-time {
                font-size: 13px;
            }

            .empty {
                padding:
                    20px 0;
                font-size: 10px;
            }
        }

        /* ==== iPAD LANDSCAPE / LARGE TABLET ==== */
        @media (min-width: 900px) {
            .app {
                padding-left: 70px;
                padding-right: 70px;
            }

            header,
            main {
                max-width: 1100px;
            }

            header {
                margin-bottom: 25px;
            }

            main {
                grid-template-columns:
                    minmax(140px, 1fr) minmax(450px, 700px) minmax(140px, 1fr);
                column-gap: 40px;
            }

            .timer-area {
                margin:
                    20px 0 45px;
            }

            .timer {
                font-size:
                    clamp(130px, 13vw, 230px);
                letter-spacing: -6px;
            }

            .timer.long {
                font-size:
                    clamp(130px, 13vw, 230px);
            }

            .controls {
                grid-template-columns:
                    minmax(140px, 1fr) minmax(450px, 700px) minmax(140px, 1fr);
                column-gap: 40px;
            }

            .circle-button {
                width: 110px;
                height: 110px;
                font-size: 17px;
            }

            .lap {
                grid-template-columns:
                    1fr 220px;
                padding:
                    12px 12px;
            }

            .lap-day {
                font-size: 17px;
            }

            .lap-number {
                width: 75px;
                font-size: 11px;
            }

            .lap-time {
                font-size: 18px;
            }
        }

        /* ==== PC ==== */
        @media (min-width: 1200px) {
            .app {
                padding:
                    45px 80px 60px;
            }

            header,
            main {
                max-width: 1200px;
            }

            header {
                margin-bottom: 30px;
            }

            main {
                height:
                    calc(100dvh - 45px - 30px - 60px);
                grid-template-columns:
                    minmax(180px, 1fr) minmax(500px, 760px) minmax(180px, 1fr);
                column-gap: 50px;
            }

            .timer-area {
                margin:
                    25px 0 55px;
            }

            .timer {
                font-size:
                    clamp(130px, 13vw, 230px);
                letter-spacing: -7px;
            }

            .timer.long {
                font-size:
                    clamp(130px, 13vw, 230px);
            }

            .controls {
                grid-template-columns:
                    minmax(180px, 1fr) minmax(500px, 760px) minmax(180px, 1fr);
                column-gap: 50px;
            }

            .circle-button {
                width: 124px;
                height: 124px;
                font-size: 18px;
            }

            .section-header {
                padding:
                    0 15px;
                margin-bottom: 15px;
            }

            .section-title {
                font-size: 14px;
            }

            .lap-count {
                font-size: 14px;
            }

            .lap {
                grid-template-columns:
                    1fr 250px;
                min-height: 82px;
                padding: 15px;
            }

            .lap-day {
                font-size: 19px;
            }

            .lap-number {
                width: 90px;
                font-size: 12px;
            }

            .lap-time {
                font-size: 20px;
            }
        }

        /* ==== VERY LARGE PC ==== */
        @media (min-width: 1600px) {
            .app {
                padding-left: 120px;
                padding-right: 120px;
            }

            header,
            main {
                max-width: 1400px;
            }

            main {
                grid-template-columns:
                    minmax(200px, 1fr) minmax(600px, 800px) minmax(200px, 1fr);
                column-gap: 70px;
            }

            .controls {
                grid-template-columns:
                    minmax(200px, 1fr) minmax(600px, 800px) minmax(200px, 1fr);
                column-gap: 70px;
            }

            .timer {
                font-size: 180px;
            }

            .timer.long {
                font-size: 180px;
            }
        }

        /* ==== SMALL PHONE ==== */
        @media (max-width: 380px) and (orientation: portrait) {
            .app {
                padding-left: 16px;
                padding-right: 16px;
            }

            .controls {
                width: 280px;
            }

            .circle-button {
                width: 80px;
                height: 80px;
                font-size: 13px;
            }

            .timer {
                font-size: 20vw;
                letter-spacing: -2px;
            }

            .timer.long {
                font-size: 15vw;
                letter-spacing: -2px;
            }

            .time-reel {
                width: 70px;
            }

            .time-unit {
                width: 18px;
                font-size: 11px;
            }

            .time-picker {
                gap: 4px;
            }
        }

        /* ==== TOUCH / SELECTION ==== */
        .laps,
        .lap,
        .row,
        button {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="title">
                STUDY TIMER
            </div>
            <div class="status" id="status">
                <div class="status-dot"></div>
                <span id="statusText">
                    READY
                </span>
            </div>
        </header>
        <main>
            <!-- ==== TIMER ==== -->
            <section class="timer-area">
                <div class="timer" id="timer">
                    00:00.00
                </div>
            </section>
            <!-- ==== CONTROLS ==== -->
            <section class="controls">
                <button class="circle-button" id="secondaryButton">
                    リセット
                </button>
                <button class="circle-button primary" id="startStopButton">
                    開始
                </button>
            </section>
            <!-- ==== LAPS ==== -->
            <section>
                <div class="section-header">
                    <div class="section-title">
                        LAPS
                    </div>
                    <div class="lap-count" id="lapCount">
                        0
                    </div>
                </div>
                <div class="laps" id="laps">
                    <div class="empty">
                        開始すると、最新ラップがここに表示されます
                    </div>
                </div>
            </section>
        </main>
    </div>
    <!-- ==== EDIT MODAL ==== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">
                ラップを編集
            </div>
            <div class="field">
                <label>
                    経過時間
                </label>
                <div class="time-picker">
                    <div class="time-reel" id="editHours" data-type="hours" aria-label="時間">
                    </div>
                    <div class="time-unit">
                        時間
                    </div>
                    <div class="time-reel" id="editMinutes" data-type="minutes" aria-label="分">
                    </div>
                    <div class="time-unit">
                        分
                    </div>
                    <div class="time-reel" id="editSeconds" data-type="seconds" aria-label="秒">
                    </div>
                    <div class="time-unit">
                        秒
                    </div>
                </div>
            </div>
            <div class="info">
                ラップの経過時間を変更します。
            </div>
            <div class="modal-buttons">
                <button class="modal-button" id="cancelEdit">
                    キャンセル
                </button>
                <button class="modal-button save" id="saveEdit">
                    保存
                </button>
            </div>
        </div>
    </div>
    <!-- ==== RESET CONFIRM MODAL ==== -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-content">
                <div class="confirm-title" id="confirmTitle">
                    リセットしますか？
                </div>
            </div>
            <div class="confirm-buttons">
                <button class="confirm-button" id="confirmCancel">
                    キャンセル
                </button>
                <button class="confirm-button danger" id="confirmOK">
                    リセット
                </button>
            </div>
        </div>
    </div>
    <script>
        (() => {
            "use strict";
            /* =========================================================
             * STORAGE
             * ========================================================= */
            const STORAGE_KEY = "studyStopwatch_v3";
            /* =========================================================
             * ACTIVE LAP IDENTIFIER
             * ========================================================= */
            const ACTIVE_LAP_ID = Symbol("activeLap");
            /* =========================================================
             * 2段階左スワイプ削除
             * ========================================================= */
            const TRASH_SVG =
                '<svg class="trash" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>' +
                '</svg>';
            /*
             * 第1段階：
             * 左へ 96px
             */
            const OPEN_X = -96;
            /*
             * 第2段階：
             * 合計 -168px 未満なら削除
             */
            const DELETE_X = -168;
            /*
             * 現在開いている行
             */
            let openRow = null;
            /*
             * 軽いバイブレーション
             */
            function haptic(duration = 8) {
                try {
                    if (
                        typeof navigator !== "undefined" &&
                        typeof navigator.vibrate === "function"
                    ) {
                        navigator.vibrate(duration);
                    }
                } catch (error) {
                    // 無視
                }
            }
            /* =========================================================
             * STATE
             * ========================================================= */
            function createInitialState() {
                return {
                    running: false,
                    currentRunStart: null,
                    accumulated: 0,
                    laps: [],
                    hasActiveLap: false,
                    activeLapStartedAt: null
                };
            }
            let state = createInitialState();
            let editingLapId = null;
            let animationFrame = null;
            let confirmResolver = null;
            let activeLapTimeElement = null;
            let lastActiveLapSeconds = null;
            const reelValues = {
                hours: 0,
                minutes: 0,
                seconds: 0
            };
            const elements = {};
            /* =========================================================
             * UTILITIES
             * ========================================================= */
            function toNonNegativeNumber(
                value,
                fallback = 0
            ) {
                const number = Number(value);
                return Number.isFinite(number)
                    ? Math.max(0, number)
                    : fallback;
            }
            function normalizeTimestamp(value) {
                if (typeof value !== "string") {
                    return null;
                }
                const timestamp = Date.parse(value);
                return Number.isFinite(timestamp)
                    ? new Date(timestamp).toISOString()
                    : null;
            }
            function createLapId() {
                if (
                    typeof crypto !== "undefined" &&
                    typeof crypto.randomUUID === "function"
                ) {
                    return crypto.randomUUID();
                }
                return (
                    Date.now().toString(36) +
                    "-" +
                    Math.random().toString(36).slice(2)
                );
            }
            function isDialogOpen() {
                return (
                    confirmResolver !== null ||
                    elements.modalOverlay.classList.contains("show")
                );
            }
            /* =========================================================
             * OPEN ROW
             * ========================================================= */
            function closeOpenRow() {
                if (!openRow) {
                    return;
                }
                const card =
                    openRow.querySelector(".item");
                if (card) {
                    card.style.transition =
                        "transform .24s cubic-bezier(.2,.9,.25,1)";
                    card.style.transform =
                        "translateX(0)";
                }
                openRow.classList.remove("open");
                openRow.classList.remove("armed");
                openRow.style.removeProperty(
                    "--delete-width"
                );
                openRow = null;
            }
            /* =========================================================
             * CUSTOM CONFIRM
             *
             * ※ リセット用のみ。
             * ※ ラップ削除では使わない。
             * ========================================================= */
            function showConfirm(title, okText) {
                if (confirmResolver !== null) {
                    return Promise.resolve(false);
                }
                return new Promise(resolve => {
                    confirmResolver = resolve;
                    elements.confirmTitle.textContent =
                        title;
                    elements.confirmOK.textContent =
                        okText;
                    elements.confirmOverlay.classList.add(
                        "show"
                    );
                });
            }
            function closeConfirm(result) {
                elements.confirmOverlay.classList.remove(
                    "show"
                );
                if (confirmResolver !== null) {
                    const resolve =
                        confirmResolver;
                    confirmResolver = null;
                    resolve(result);
                }
            }
            /* =========================================================
             * STORAGE
             * ========================================================= */
            function saveState() {
                try {
                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(state)
                    );
                } catch (error) {
                    console.warn(
                        "ストップウォッチの状態を保存できませんでした。",
                        error
                    );
                }
            }
            function loadState() {
                try {
                    const saved =
                        localStorage.getItem(
                            STORAGE_KEY
                        );
                    if (!saved) {
                        return;
                    }
                    const parsed =
                        JSON.parse(saved);
                    if (
                        !parsed ||
                        typeof parsed !== "object" ||
                        Array.isArray(parsed)
                    ) {
                        return;
                    }
                    const usedIds =
                        new Set();
                    const laps = [];
                    if (
                        Array.isArray(parsed.laps)
                    ) {
                        for (
                            const item
                            of parsed.laps
                        ) {
                            if (
                                !item ||
                                typeof item !== "object" ||
                                Array.isArray(item)
                            ) {
                                continue;
                            }
                            const elapsed =
                                Number(item.elapsed);
                            if (
                                !Number.isFinite(elapsed) ||
                                elapsed < 0
                            ) {
                                continue;
                            }
                            let id =
                                typeof item.id === "string"
                                    ? item.id
                                    : "";
                            if (
                                !id ||
                                usedIds.has(id)
                            ) {
                                id = createLapId();
                            }
                            usedIds.add(id);
                            laps.push({
                                id,
                                timestamp:
                                    normalizeTimestamp(
                                        item.timestamp
                                    ),
                                startedAt:
                                    normalizeTimestamp(
                                        item.startedAt
                                    ),
                                elapsed
                            });
                        }
                    }
                    laps.sort(
                        (a, b) =>
                            b.elapsed -
                            a.elapsed
                    );
                    const running =
                        Boolean(parsed.running);
                    const accumulated =
                        toNonNegativeNumber(
                            parsed.accumulated
                        );
                    const savedRunStart =
                        Number(
                            parsed.currentRunStart
                        );
                    const currentRunStart =
                        Number.isFinite(
                            savedRunStart
                        ) &&
                            savedRunStart > 0
                            ? savedRunStart
                            : null;
                    const hasActiveLap =
                        typeof parsed.hasActiveLap ===
                            "boolean"
                            ? parsed.hasActiveLap
                            : (
                                running ||
                                accumulated > 0 ||
                                laps.length > 0
                            );
                    state = {
                        running,
                        currentRunStart:
                            running
                                ? (
                                    currentRunStart ??
                                    Date.now()
                                )
                                : null,
                        accumulated,
                        laps,
                        hasActiveLap:
                            running ||
                            hasActiveLap,
                        activeLapStartedAt:
                            normalizeTimestamp(
                                parsed.activeLapStartedAt
                            )
                    };
                    if (
                        Array.isArray(parsed.laps)
                    ) {
                        const originalById =
                            new Map();
                        for (
                            const item
                            of parsed.laps
                        ) {
                            if (
                                item &&
                                typeof item === "object" &&
                                typeof item.id === "string"
                            ) {
                                originalById.set(
                                    item.id,
                                    item
                                );
                            }
                        }
                        for (
                            let index = 0;
                            index < state.laps.length;
                            index++
                        ) {
                            const lap =
                                state.laps[index];
                            const original =
                                originalById.get(
                                    lap.id
                                );
                            const previous =
                                state.laps[
                                index + 1
                                ];
                            if (
                                original &&
                                !Object.prototype.hasOwnProperty.call(
                                    original,
                                    "startedAt"
                                ) &&
                                previous
                            ) {
                                lap.startedAt =
                                    previous.timestamp;
                            }
                        }
                    }
                    if (
                        state.hasActiveLap &&
                        !Object.prototype.hasOwnProperty.call(
                            parsed,
                            "activeLapStartedAt"
                        ) &&
                        state.laps.length > 0
                    ) {
                        state.activeLapStartedAt =
                            state.laps[0].timestamp;
                    }
                    normalizeLaps();
                    const latestElapsed =
                        getLapElapsed(
                            state.laps[0]
                        );
                    if (!state.hasActiveLap) {
                        state.accumulated =
                            latestElapsed;
                        state.activeLapStartedAt =
                            null;
                    } else {
                        const elapsed =
                            getElapsed();
                        if (
                            elapsed <
                            latestElapsed
                        ) {
                            state.accumulated +=
                                latestElapsed -
                                elapsed;
                        }
                    }
                } catch (error) {
                    console.warn(
                        "保存データを読み込めませんでした。",
                        error
                    );
                    state =
                        createInitialState();
                }
            }
            /* =========================================================
             * ELAPSED
             * ========================================================= */
            function getElapsed(
                now = Date.now()
            ) {
                let elapsed =
                    toNonNegativeNumber(
                        state.accumulated
                    );
                if (
                    state.running &&
                    state.currentRunStart !== null
                ) {
                    elapsed += Math.max(
                        0,
                        now -
                        state.currentRunStart
                    );
                }
                return Math.max(
                    0,
                    elapsed
                );
            }
            /* =========================================================
             * FORMAT
             * ========================================================= */
            function pad(
                number,
                digits = 2
            ) {
                return String(number)
                    .padStart(
                        digits,
                        "0"
                    );
            }
            function formatStopwatch(ms) {
                ms = Math.max(
                    0,
                    Math.floor(ms)
                );
                const hours =
                    Math.floor(
                        ms / 3600000
                    );
                const minutes =
                    Math.floor(
                        (ms % 3600000) /
                        60000
                    );
                const seconds =
                    Math.floor(
                        (ms % 60000) /
                        1000
                    );
                const centiseconds =
                    Math.floor(
                        (ms % 1000) /
                        10
                    );
                if (hours === 0) {
                    return (
                        pad(minutes) +
                        ":" +
                        pad(seconds) +
                        "." +
                        pad(centiseconds)
                    );
                }
                return (
                    hours +
                    ":" +
                    pad(minutes) +
                    ":" +
                    pad(seconds) +
                    "." +
                    pad(centiseconds)
                );
            }
            function formatStudyTime(ms) {
                ms = Math.max(
                    0,
                    Math.floor(ms)
                );
                const totalSeconds =
                    Math.floor(
                        ms / 1000
                    );
                const hours =
                    Math.floor(
                        totalSeconds /
                        3600
                    );
                const minutes =
                    Math.floor(
                        (totalSeconds % 3600) /
                        60
                    );
                const seconds =
                    totalSeconds % 60;
                const result = [];
                if (hours > 0) {
                    result.push(
                        hours + "時間"
                    );
                }
                if (minutes > 0) {
                    result.push(
                        minutes + "分"
                    );
                }
                if (
                    seconds > 0 ||
                    result.length === 0
                ) {
                    result.push(
                        seconds + "秒"
                    );
                }
                return result.join("");
            }
            function formatLapStart(timestamp) {
                if (!timestamp) {
                    return "開始時刻不明";
                }
                const date =
                    new Date(timestamp);
                if (
                    !Number.isFinite(
                        date.getTime()
                    )
                ) {
                    return "開始時刻不明";
                }
                return (
                    (date.getMonth() + 1) +
                    "/" +
                    date.getDate() +
                    "\u00A0\u00A0\u00A0\u00A0" +
                    pad(
                        date.getHours()
                    ) +
                    ":" +
                    pad(
                        date.getMinutes()
                    ) +
                    "〜"
                );
            }
            /* =========================================================
             * LAP
             * ========================================================= */
            function getLapElapsed(lap) {
                return lap
                    ? toNonNegativeNumber(
                        lap.elapsed
                    )
                    : 0;
            }
            function calculateLapDuration(
                index
            ) {
                const lap =
                    state.laps[index];
                if (!lap) {
                    return 0;
                }
                const previous =
                    state.laps[
                    index + 1
                    ];
                return Math.max(
                    0,
                    getLapElapsed(lap) -
                    getLapElapsed(previous)
                );
            }
            function getActiveLapDuration(
                elapsed = getElapsed()
            ) {
                if (!state.hasActiveLap) {
                    return 0;
                }
                return Math.max(
                    0,
                    elapsed -
                    getLapElapsed(
                        state.laps[0]
                    )
                );
            }
            function getEditableLapDuration(
                id
            ) {
                if (
                    id === ACTIVE_LAP_ID
                ) {
                    return state.hasActiveLap
                        ? getActiveLapDuration()
                        : null;
                }
                const index =
                    state.laps.findIndex(
                        lap =>
                            lap.id === id
                    );
                return index === -1
                    ? null
                    : calculateLapDuration(
                        index
                    );
            }
            /* =========================================================
             * PREPARE LAP FOR RESUME
             * ========================================================= */
            function prepareLapForResume(now) {
                if (state.hasActiveLap) {
                    return;
                }
                if (state.laps.length > 0) {
                    const latestLap =
                        state.laps.shift();
                    state.accumulated =
                        getLapElapsed(
                            latestLap
                        );
                    state.hasActiveLap =
                        true;
                    state.activeLapStartedAt =
                        latestLap.startedAt;
                    return;
                }
                state.accumulated = 0;
                state.hasActiveLap =
                    true;
                state.activeLapStartedAt =
                    new Date(
                        now
                    ).toISOString();
            }
            /* =========================================================
             * ADD LAP
             * ========================================================= */
            function addLap() {
                if (
                    !state.running ||
                    isDialogOpen()
                ) {
                    return;
                }
                const now =
                    Date.now();
                const timestamp =
                    new Date(
                        now
                    ).toISOString();
                const elapsed =
                    getElapsed(now);
                state.laps.unshift({
                    id: createLapId(),
                    timestamp,
                    startedAt:
                        state.activeLapStartedAt,
                    elapsed
                });
                state.hasActiveLap =
                    true;
                state.activeLapStartedAt =
                    timestamp;
                saveState();
                renderLaps();
                updateTimer();
            }
            /* =========================================================
             * TIMER
             * ========================================================= */
            function updateActiveLapTime(
                elapsed
            ) {
                if (
                    !activeLapTimeElement
                ) {
                    return;
                }
                const duration =
                    getActiveLapDuration(
                        elapsed
                    );
                const totalSeconds =
                    Math.floor(
                        duration / 1000
                    );
                if (
                    totalSeconds ===
                    lastActiveLapSeconds
                ) {
                    return;
                }
                activeLapTimeElement.textContent =
                    formatStudyTime(
                        duration
                    );
                lastActiveLapSeconds =
                    totalSeconds;
            }
            function updateTimer() {
                const elapsed =
                    getElapsed();
                elements.timer.textContent =
                    formatStopwatch(
                        elapsed
                    );
                elements.timer.classList.toggle(
                    "long",
                    elapsed >= 3600000
                );
                updateActiveLapTime(
                    elapsed
                );
            }
            function timerTick() {
                animationFrame = null;
                updateTimer();
                if (
                    state.running &&
                    !document.hidden
                ) {
                    animationFrame =
                        requestAnimationFrame(
                            timerTick
                        );
                }
            }
            function stopTimerLoop() {
                if (
                    animationFrame !== null
                ) {
                    cancelAnimationFrame(
                        animationFrame
                    );
                    animationFrame = null;
                }
            }
            function startTimerLoop() {
                stopTimerLoop();
                updateTimer();
                if (
                    state.running &&
                    !document.hidden
                ) {
                    animationFrame =
                        requestAnimationFrame(
                            timerTick
                        );
                }
            }
            /* =========================================================
             * START / STOP
             * ========================================================= */
            function startStopwatch() {
                if (isDialogOpen()) {
                    return;
                }
                if (state.running) {
                    state.accumulated =
                        getElapsed();
                    state.running = false;
                    state.currentRunStart =
                        null;
                    stopTimerLoop();
                } else {
                    const now =
                        Date.now();
                    prepareLapForResume(
                        now
                    );
                    state.running = true;
                    state.currentRunStart =
                        now;
                }
                saveState();
                updateControls();
                renderLaps();
                startTimerLoop();
            }
            /* =========================================================
             * RESET
             * ========================================================= */
            async function resetStopwatch() {
                if (
                    state.running ||
                    isDialogOpen()
                ) {
                    return;
                }
                if (
                    state.accumulated > 0 ||
                    state.laps.length > 0 ||
                    state.hasActiveLap
                ) {
                    const confirmed =
                        await showConfirm(
                            "リセットしますか？",
                            "リセット"
                        );
                    if (
                        !confirmed ||
                        state.running
                    ) {
                        return;
                    }
                }
                stopTimerLoop();
                closeEditModal();
                state =
                    createInitialState();
                saveState();
                updateControls();
                renderLaps();
                updateTimer();
            }
            /* =========================================================
             * CONTROLS
             * ========================================================= */
            function updateControls() {
                const running =
                    state.running;
                elements.secondaryButton.textContent =
                    running
                        ? "ラップ"
                        : "リセット";
                elements.startStopButton.textContent =
                    running
                        ? "停止"
                        : "開始";
                elements.startStopButton.classList.toggle(
                    "running",
                    running
                );
                elements.status.classList.toggle(
                    "running",
                    running
                );
                const hasRecords = (
                    state.hasActiveLap ||
                    state.laps.length > 0 ||
                    getElapsed() > 0
                );
                elements.statusText.textContent =
                    running
                        ? "FOCUS"
                        : hasRecords
                            ? "PAUSED"
                            : "READY";
            }
            /* =========================================================
             * REMOVE LAP
             *
             * ラップ削除専用確認なし。
             * 左スワイプ第2段階 or ゴミ箱タップから直接呼ぶ。
             * ========================================================= */
            function removeLap(
                targetId,
                rowEl = null
            ) {
                let index = -1;
                if (
                    targetId !==
                    ACTIVE_LAP_ID
                ) {
                    index =
                        state.laps.findIndex(
                            lap =>
                                lap.id ===
                                targetId
                        );
                    if (index === -1) {
                        return;
                    }
                } else if (
                    !state.hasActiveLap
                ) {
                    return;
                }
                if (
                    rowEl &&
                    rowEl.classList.contains(
                        "removing"
                    )
                ) {
                    return;
                }
                if (openRow === rowEl) {
                    openRow = null;
                }
                const finalize =
                    () => {
                        if (
                            targetId ===
                            ACTIVE_LAP_ID
                        ) {
                            if (
                                !state.hasActiveLap
                            ) {
                                return;
                            }
                            state.accumulated =
                                getLapElapsed(
                                    state.laps[0]
                                );
                            state.hasActiveLap =
                                false;
                            state.activeLapStartedAt =
                                null;
                            state.currentRunStart =
                                null;
                        } else {
                            const currentIndex =
                                state.laps.findIndex(
                                    lap =>
                                        lap.id ===
                                        targetId
                                );
                            if (
                                currentIndex === -1
                            ) {
                                return;
                            }
                            const deletedDuration =
                                calculateLapDuration(
                                    currentIndex
                                );
                            for (
                                let current = 0;
                                current < currentIndex;
                                current++
                            ) {
                                state.laps[current].elapsed =
                                    Math.max(
                                        0,
                                        getLapElapsed(
                                            state.laps[
                                            current
                                            ]
                                        ) -
                                        deletedDuration
                                    );
                            }
                            state.laps.splice(
                                currentIndex,
                                1
                            );
                            state.accumulated =
                                Math.max(
                                    0,
                                    state.accumulated -
                                    deletedDuration
                                );
                            if (
                                !state.hasActiveLap
                            ) {
                                state.accumulated =
                                    getLapElapsed(
                                        state.laps[0]
                                    );
                            }
                        }
                        normalizeLaps();
                        saveState();
                        renderLaps();
                        updateTimer();
                        updateControls();
                    };
                /*
                 * 行が存在する場合は
                 * 横方向へスライドして消す
                 */
                if (rowEl) {
                    const card =
                        rowEl.querySelector(
                            ".item"
                        );
                    const height =
                        rowEl.offsetHeight;
                    rowEl.style.height =
                        height + "px";
                    rowEl.classList.add(
                        "removing"
                    );
                    if (card) {
                        card.style.transition =
                            "transform .24s cubic-bezier(.2,.9,.25,1), opacity .24s ease";
                    }
                    requestAnimationFrame(
                        () => {
                            if (card) {
                                card.style.transform =
                                    "translateX(-115%)";
                                card.style.opacity =
                                    "0";
                            }
                            rowEl.style.height =
                                "0px";
                            rowEl.style.marginBottom =
                                "0px";
                        }
                    );
                    haptic(14);
                    setTimeout(
                        finalize,
                        240
                    );
                    return;
                }
                finalize();
            }
            /* =========================================================
             * 2段階左スワイプ GESTURE
             * ========================================================= */
            function bindLapGestures(
                row,
                card,
                targetId
            ) {
                let sx = 0;
                let sy = 0;
                let st = 0;
                let mode = null;
                let pid = null;
                let tx = 0;
                let wasArmed = false;
                const rowBg =
                    row.querySelector(
                        ".row-bg"
                    );
                /* =====================================================
                 * ゴミ箱タップ
                 * ===================================================== */
                rowBg.addEventListener(
                    "click",
                    event => {
                        event.stopPropagation();
                        if (
                            state.running ||
                            isDialogOpen()
                        ) {
                            return;
                        }
                        if (
                            openRow === row
                        ) {
                            const c =
                                row.querySelector(
                                    ".item"
                                );
                            if (c) {
                                c.style.transition =
                                    "transform .2s cubic-bezier(.2,.9,.25,1)";
                                c.style.transform =
                                    "translateX(-115%)";
                            }
                            row.style.setProperty(
                                "--delete-width",
                                Math.abs(
                                    OPEN_X
                                ) + "px"
                            );
                            row.classList.remove(
                                "armed"
                            );
                            removeLap(
                                targetId,
                                row
                            );
                        }
                    }
                );
                /* =====================================================
                 * POINTER DOWN
                 * ===================================================== */
                card.addEventListener(
                    "pointerdown",
                    event => {
                        /*
                         * 編集シート・確認ウィンドウ表示中は
                         * スワイプしない。
                         */
                        if (
                            state.running ||
                            isDialogOpen()
                        ) {
                            return;
                        }
                        /*
                         * マウスの右クリック等を除外
                         */
                        if (
                            event.pointerType ===
                            "mouse" &&
                            event.button !== 0
                        ) {
                            return;
                        }
                        pid =
                            event.pointerId;
                        sx =
                            event.clientX;
                        sy =
                            event.clientY;
                        st =
                            performance.now();
                        mode = null;
                        wasArmed = false;
                        tx =
                            openRow === row
                                ? OPEN_X
                                : 0;
                        card.style.transition =
                            "none";
                        try {
                            card.setPointerCapture(
                                pid
                            );
                        } catch (error) { }
                        card.addEventListener(
                            "pointermove",
                            onMove
                        );
                        card.addEventListener(
                            "pointerup",
                            onUp
                        );
                        card.addEventListener(
                            "pointercancel",
                            onUp
                        );
                    }
                );
                /* =====================================================
                 * POINTER MOVE
                 * ===================================================== */
                function onMove(event) {
                    if (
                        pid !==
                        event.pointerId
                    ) {
                        return;
                    }
                    const dx =
                        event.clientX -
                        sx;
                    const dy =
                        event.clientY -
                        sy;
                    if (
                        mode === null
                    ) {
                        /*
                         * 横方向を優先
                         */
                        if (
                            Math.abs(dx) > 10 &&
                            Math.abs(dx) >
                            Math.abs(dy) * 1.2
                        ) {
                            mode =
                                "swipe";
                            /*
                             * 別の行が開いていたら閉じる
                             */
                            if (
                                openRow &&
                                openRow !== row
                            ) {
                                closeOpenRow();
                            }
                            row.classList.add(
                                "swiping"
                            );
                        } else if (
                            Math.abs(dy) > 9 ||
                            Math.abs(dx) > 14
                        ) {
                            /*
                             * 縦方向ならスクロール
                             */
                            mode =
                                "scroll";
                            cleanup();
                            return;
                        }
                    }
                    if (
                        mode ===
                        "swipe"
                    ) {
                        event.preventDefault();
                        const opened =
                            openRow === row;
                        const base =
                            opened
                                ? OPEN_X
                                : 0;
                        let v =
                            base + dx;
                        /*
                         * 右方向へ引いたときの抵抗
                         */
                        if (v > 0) {
                            v *= .22;
                        }
                        tx = v;
                        card.style.transform =
                            "translateX(" +
                            v +
                            "px)";
                        row.style.setProperty(
                            "--delete-width",
                            Math.max(
                                0,
                                -v
                            ) + "px"
                        );
                        /*
                         * 第2段階へ入ったか
                         */
                        const armed =
                            opened &&
                            v < DELETE_X;
                        if (
                            armed !==
                            wasArmed
                        ) {
                            wasArmed =
                                armed;
                            row.classList.toggle(
                                "armed",
                                armed
                            );
                            haptic(
                                armed
                                    ? 10
                                    : 4
                            );
                        }
                    }
                }
                /* =====================================================
                 * CLEANUP
                 * ===================================================== */
                function cleanup() {
                    card.removeEventListener(
                        "pointermove",
                        onMove
                    );
                    card.removeEventListener(
                        "pointerup",
                        onUp
                    );
                    card.removeEventListener(
                        "pointercancel",
                        onUp
                    );
                    try {
                        card.releasePointerCapture(
                            pid
                        );
                    } catch (error) { }
                    pid = null;
                }
                /* =====================================================
                 * POINTER UP
                 * ===================================================== */
                function onUp(event) {
                    if (
                        pid !==
                        event.pointerId
                    ) {
                        return;
                    }
                    cleanup();
                    if (
                        mode ===
                        "swipe"
                    ) {
                        const opened =
                            openRow === row;
                        row.classList.remove(
