<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover">
<meta
    name="apple-mobile-web-app-capable"
    content="yes">
<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">
<title>Study Stopwatch</title>
<style>
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}
body {
    background: #080808;
    color: #f5f5f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}
button,
input {
    font-family: inherit;
}
button {
    border: none;
    outline: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}
/* =========================================================
   APP
========================================================= */
.app {
    width: 100%;
    min-height: 100vh;
    padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(30px, env(safe-area-inset-bottom));
    background:
        radial-gradient(
            circle at 50% -10%,
            #292929 0%,
            #111 38%,
            #080808 75%
        );
}
/* =========================================================
   HEADER
========================================================= */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 760px;
    margin: 0 auto 48px;
}
.title {
    color: #858589;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
}
.status {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #666;
    font-size: 11px;
    letter-spacing: 1px;
}
.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #555;
}
.status.running .status-dot {
    background: #30d158;
    box-shadow:
        0 0 10px rgba(48,209,88,.75);
}
.status.running {
    color: #30d158;
}
/* =========================================================
   MAIN
========================================================= */
main {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}
/* =========================================================
   TIMER
========================================================= */
.timer-area {
    text-align: center;
    margin-bottom: 50px;
}
.timer {
    color: #f5f5f7;
    font-size:
        clamp(43px, 12.5vw, 74px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -2px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
}
/* =========================================================
   CONTROLS
========================================================= */
.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(310px, 100%);
    margin: 0 auto 50px;
}
.circle-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #252527;
    color: #eeeeee;
    font-size: 13px;
    font-weight: 500;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 30px rgba(0,0,0,.35);
    transition:
        transform .12s ease,
        background .2s ease,
        opacity .2s ease;
}
.circle-button:active {
    transform: scale(.93);
}
.circle-button.primary {
    width: 82px;
    height: 82px;
    background: #f2f2f2;
    color: #111;
    font-size: 14px;
}
.circle-button.primary.running {
    background: #ff453a;
    color: #fff;
}
/* =========================================================
   LAP HEADER
========================================================= */
.section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 5px;
    margin-bottom: 12px;
}
.section-title {
    color: #777;
    font-size: 12px;
    letter-spacing: 2px;
}
.lap-count {
    color: #555;
    font-size: 12px;
}
/* =========================================================
   LAP LIST
========================================================= */
.laps {
    border-top: 1px solid #242424;
}
.lap {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    min-height: 70px;
    padding: 12px 5px;
    border-bottom: 1px solid #202020;
    cursor: pointer;
    transition:
        background .15s ease;
}
.lap:active {
    background: #181818;
}
.lap-day {
    display: flex;
    align-items: center;
    color: #ddd;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
}
.lap-number {
    width: 48px;
    color: #555;
    font-size: 10px;
}
.lap-time {
    color: #eee;
    font-size: 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}
.empty {
    padding: 42px 0;
    color: #555;
    font-size: 13px;
    text-align: center;
}
/* =========================================================
   MODAL
========================================================= */
.modal-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.68);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
}
.modal-overlay.show {
    display: flex;
}
.modal {
    width: min(520px, 100%);
    padding:
        22px
        22px
        max(25px, env(safe-area-inset-bottom));
    background: #1c1c1e;
    border-radius: 24px 24px 0 0;
    box-shadow:
        0 -15px 50px rgba(0,0,0,.5);
    animation: slideUp .2s ease;
}
@keyframes slideUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}
.modal-title {
    margin-bottom: 25px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
}
.field {
    margin-bottom: 17px;
}
.field label {
    display: block;
    margin-bottom: 7px;
    color: #888;
    font-size: 11px;
    letter-spacing: .7px;
}
input {
    width: 100%;
    padding: 13px 14px;
    border: none;
    outline: none;
    border-radius: 11px;
    background: #2c2c2e;
    color: #fff;
    font-size: 16px;
}
.info {
    margin-top: 5px;
    color: #666;
    font-size: 11px;
    line-height: 1.6;
}
.modal-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 25px;
}
.modal-button {
    padding: 14px;
    border-radius: 12px;
    background: #2c2c2e;
    color: #eee;
    font-size: 15px;
}
.modal-button:active {
    opacity: .7;
}
.modal-button.save {
    background: #f2f2f2;
    color: #111;
    font-weight: 600;
}
.delete-button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border-radius: 12px;
    background: transparent;
    color: #ff453a;
    font-size: 14px;
}
/* =========================================================
   TOAST
========================================================= */
.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    padding: 10px 17px;
    border-radius: 20px;
    background: #2c2c2e;
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 20px);
    transition:
        opacity .25s ease,
        transform .25s ease;
    z-index: 200;
}
.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}
/* =========================================================
   iPAD
   600px〜
========================================================= */
@media (min-width: 600px) {
    .app {
        padding-left: 48px;
        padding-right: 48px;
    }
    header,
    main {
        max-width: 900px;
    }
    header {
        margin-bottom: 70px;
    }
    .title {
        font-size: 15px;
        letter-spacing: 2.5px;
    }
    .status {
        font-size: 12px;
    }
    .timer-area {
        margin-bottom: 65px;
    }
    .timer {
        font-size: clamp(
            70px,
            11vw,
            120px
        );
        letter-spacing: -4px;
    }
    .controls {
        width: 360px;
        margin-bottom: 70px;
    }
    .circle-button {
        width: 92px;
        height: 92px;
        font-size: 15px;
    }
    .circle-button.primary {
        width: 98px;
        height: 98px;
        font-size: 16px;
    }
    .section-header {
        padding: 0 8px;
    }
    .section-title {
        font-size: 13px;
    }
    .lap-count {
        font-size: 13px;
    }
    .lap {
        min-height: 82px;
        padding:
            14px 8px;
    }
    .lap-day {
        font-size: 17px;
    }
    .lap-number {
        width: 65px;
        font-size: 11px;
    }
    .lap-time {
        font-size: 18px;
    }
}
/* =========================================================
   iPAD LANDSCAPE / LARGE TABLET
   900px〜
========================================================= */
@media (min-width: 900px) {
    .app {
        padding-left: 70px;
        padding-right: 70px;
    }
    header,
    main {
        max-width: 1100px;
    }
    header {
        margin-bottom: 60px;
    }
    /*
     * タイマー部分を横長の
     * 大きなステージとして使用
     */
    .timer-area {
        padding: 30px 0 10px;
        margin-bottom: 55px;
    }
    .timer {
        font-size:
            clamp(90px, 10vw, 145px);
        letter-spacing: -6px;
    }
    .controls {
        width: 420px;
        margin-bottom: 75px;
    }
    .circle-button {
        width: 105px;
        height: 105px;
        font-size: 16px;
    }
    .circle-button.primary {
        width: 112px;
        height: 112px;
        font-size: 17px;
    }
    /*
     * ラップ一覧を広く使う
     */
    .lap {
        grid-template-columns:
            1fr 220px;
        min-height: 88px;
        padding-left: 15px;
        padding-right: 15px;
    }
    .lap-day {
        font-size: 18px;
    }
    .lap-number {
        width: 80px;
        font-size: 11px;
    }
    .lap-time {
        font-size: 19px;
    }
}
/* =========================================================
   PC
   1200px〜
========================================================= */
@media (min-width: 1200px) {
    .app {
        padding:
            45px
            80px
            60px;
    }
    header,
    main {
        max-width: 1200px;
    }
    header {
        margin-bottom: 65px;
    }
    .timer-area {
        padding-top: 25px;
        margin-bottom: 65px;
    }
    .timer {
        font-size:
            clamp(110px, 9vw, 155px);
        letter-spacing: -7px;
    }
    .controls {
        width: 460px;
        margin-bottom: 85px;
    }
    .circle-button {
        width: 112px;
        height: 112px;
        font-size: 17px;
    }
    .circle-button.primary {
        width: 120px;
        height: 120px;
        font-size: 18px;
    }
    .section-header {
        padding: 0 15px;
        margin-bottom: 15px;
    }
    .section-title {
        font-size: 14px;
    }
    .lap-count {
        font-size: 14px;
    }
    .lap {
        grid-template-columns:
            1fr 250px;
        min-height: 92px;
        padding:
            15px;
    }
    .lap-day {
        font-size: 19px;
    }
    .lap-number {
        width: 90px;
        font-size: 12px;
    }
    .lap-time {
        font-size: 20px;
    }
}
/* =========================================================
   VERY LARGE PC
   1600px〜
========================================================= */
@media (min-width: 1600px) {
    .app {
        padding-left: 120px;
        padding-right: 120px;
    }
    header,
    main {
        max-width: 1400px;
    }
    .timer {
        font-size: 160px;
    }
}
/* =========================================================
   SMALL PHONE
========================================================= */
@media (max-width: 380px) {
    .app {
        padding-left: 16px;
        padding-right: 16px;
    }
    .controls {
        width: 280px;
    }
    .circle-button {
        width: 70px;
        height: 70px;
    }
    .circle-button.primary {
        width: 76px;
        height: 76px;
    }
    .timer {
        font-size: 41px;
    }
}
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="title">
            STUDY STOPWATCH
        </div>
        <div
            class="status"
            id="status">
            <div class="status-dot"></div>
            <span id="statusText">
                READY
            </span>
        </div>
    </header>
    <main>
        <!-- ======================================
             TIMER
        ======================================= -->
        <section class="timer-area">
            <div
                class="timer"
                id="timer">
                00:00:00.00
            </div>
        </section>
        <!-- ======================================
             CONTROLS
        ======================================= -->
        <section class="controls">
            <button
                class="circle-button"
                id="secondaryButton">
                リセット
            </button>
            <button
                class="circle-button primary"
                id="startStopButton">
                開始
            </button>
        </section>
        <!-- ======================================
             LAPS
        ======================================= -->
        <section>
            <div class="section-header">
                <div class="section-title">
                    LAPS
                </div>
                <div
                    class="lap-count"
                    id="lapCount">
                    0
                </div>
            </div>
            <div
                class="laps"
                id="laps">
                <div class="empty">
                    ラップを記録すると、ここに表示されます
                </div>
            </div>
        </section>
    </main>
</div>
<!-- ==========================================
     EDIT MODAL
=========================================== -->
<div
    class="modal-overlay"
    id="modalOverlay">
    <div class="modal">
        <div class="modal-title">
            ラップを編集
        </div>
        <div class="field">
            <label>
                DAY
            </label>
            <input
                type="date"
                id="editDate">
        </div>
        <div class="field">
            <label>
                TIME
            </label>
            <input
                type="time"
                step="1"
                id="editTime">
        </div>
        <div class="info">
            時刻を変更すると、このラップ以降の時間軸も
            自動的に調整されます。
        </div>
        <div class="modal-buttons">
            <button
                class="modal-button"
                id="cancelEdit">
                キャンセル
            </button>
            <button
                class="modal-button save"
                id="saveEdit">
                保存
            </button>
        </div>
        <button
            class="delete-button"
            id="deleteLap">
            このラップを削除
        </button>
    </div>
</div>
<div
    class="toast"
    id="toast">
</div>
<script>
/* =========================================================
   STORAGE
========================================================= */
const STORAGE_KEY =
    "studyStopwatch_v3";
/* =========================================================
   STATE
========================================================= */
let state = {
    running: false,
    currentRunStart: null,
    accumulated: 0,
    laps: []
};
let editingLapId = null;
let animationFrame = null;
/* =========================================================
   SAVE
========================================================= */
function saveState() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}
/* =========================================================
   LOAD
========================================================= */
function loadState() {
    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );
    if (!saved) return;
    try {
        const parsed =
            JSON.parse(saved);
        state = {
            ...state,
            ...parsed
        };
        state.accumulated =
            Number(state.accumulated) || 0;
        if (
            !Array.isArray(state.laps)
        ) {
            state.laps = [];
        }
    } catch (error) {
        console.error(
            "保存データの読み込みに失敗しました。",
            error
        );
    }
}
/* =========================================================
   ELAPSED
========================================================= */
function getElapsed() {
    let elapsed =
        Number(state.accumulated) || 0;
    if (
        state.running &&
        state.currentRunStart
    ) {
        elapsed +=
            Date.now() -
            state.currentRunStart;
    }
    return Math.max(
        0,
        elapsed
    );
}
/* =========================================================
   FORMAT
========================================================= */
function pad(number, digits = 2) {
    return String(number)
        .padStart(
            digits,
            "0"
        );
}
/*
 * ストップウォッチ
 *
 * 00:00:00.00
 */
function formatStopwatch(ms) {
    ms = Math.max(
        0,
        Math.floor(ms)
    );
    const hours =
        Math.floor(
            ms / 3600000
        );
    const minutes =
        Math.floor(
            (ms % 3600000) /
            60000
        );
    const seconds =
        Math.floor(
            (ms % 60000) /
            1000
        );
    const centiseconds =
        Math.floor(
            (ms % 1000) /
            10
        );
    return (
        pad(hours) +
        ":" +
        pad(minutes) +
        ":" +
        pad(seconds) +
        "." +
        pad(centiseconds)
    );
}
/*
 * ラップ時間
 */
function formatStudyTime(ms) {
    ms = Math.max(
        0,
        Math.floor(ms)
    );
    const totalSeconds =
        Math.floor(
            ms / 1000
        );
    const hours =
        Math.floor(
            totalSeconds / 3600
        );
    const minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );
    const seconds =
        totalSeconds % 60;
    const result = [];
    if (hours > 0) {
        result.push(
            hours + "時間"
        );
    }
    if (minutes > 0) {
        result.push(
            minutes + "分"
        );
    }
    if (
        seconds > 0 ||
        result.length === 0
    ) {
        result.push(
            seconds + "秒"
        );
    }
    return result.join("");
}
/* =========================================================
   DATE
========================================================= */
function formatLapDate(timestamp) {
    const date =
        new Date(timestamp);
    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }
    return (
        pad(date.getMonth() + 1) +
        "/" +
        pad(date.getDate()) +
        " " +
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes()) +
        "〜"
    );
}
function toDateInputValue(date) {
    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth() + 1) +
        "-" +
        pad(date.getDate())
    );
}
function toTimeInputValue(date) {
    return (
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes()) +
        ":" +
        pad(date.getSeconds())
    );
}
/* =========================================================
   LAP
========================================================= */
function getLapElapsed(lap) {
    return Math.max(
        0,
        Number(lap.elapsed) || 0
    );
}
function calculateLapDuration(index) {
    const lap =
        state.laps[index];
    if (!lap) return 0;
    const previous =
        state.laps[index + 1];
    if (!previous) {
        return getLapElapsed(lap);
    }
    return Math.max(
        0,
        getLapElapsed(lap) -
        getLapElapsed(previous)
    );
}
/* =========================================================
   ADD LAP
========================================================= */
function addLap() {
    if (!state.running) return;
    const now =
        Date.now();
    const elapsed =
        getElapsed();
    state.laps.unshift({
        id:
            Date.now().toString() +
            Math.random()
                .toString(36)
                .slice(2),
        timestamp:
            new Date(now).toISOString(),
        elapsed:
            elapsed
    });
    state.laps.sort(
        (a, b) =>
            new Date(b.timestamp) -
            new Date(a.timestamp)
    );
    saveState();
    renderLaps();
    showToast(
        "ラップを記録しました"
    );
}
/* =========================================================
   TIMER
========================================================= */
function updateTimer() {
    document
        .getElementById("timer")
        .textContent =
        formatStopwatch(
            getElapsed()
        );
    if (state.running) {
        animationFrame =
            requestAnimationFrame(
                updateTimer
            );
    }
}
/* =========================================================
   START / STOP
========================================================= */
function startStopwatch() {
    /*
     * RUNNING → STOP
     */
    if (state.running) {
        state.accumulated =
            getElapsed();
        state.running = false;
        state.currentRunStart = null;
        saveState();
        cancelAnimationFrame(
            animationFrame
        );
        updateTimer();
        updateControls();
        showToast(
            "停止しました"
        );
        return;
    }
    /*
     * STOPPED → START
     */
    state.running = true;
    state.currentRunStart =
        Date.now();
    saveState();
    updateControls();
    updateTimer();
}
/* =========================================================
   RESET
========================================================= */
function resetStopwatch() {
    if (state.running) {
        return;
    }
    if (
        state.accumulated > 0 ||
        state.laps.length > 0
    ) {
        const confirmed =
            confirm(
                "ストップウォッチとラップ記録をすべてリセットしますか？"
            );
        if (!confirmed) {
            return;
        }
    }
    state = {
        running: false,
        currentRunStart: null,
        accumulated: 0,
        laps: []
    };
    saveState();
    cancelAnimationFrame(
        animationFrame
    );
    updateTimer();
    updateControls();
    renderLaps();
    showToast(
        "リセットしました"
    );
}
/* =========================================================
   CONTROLS
========================================================= */
function updateControls() {
    const secondary =
        document.getElementById(
            "secondaryButton"
        );
    const primary =
        document.getElementById(
            "startStopButton"
        );
    const status =
        document.getElementById(
            "status"
        );
    const statusText =
        document.getElementById(
            "statusText"
        );
    if (state.running) {
        secondary.textContent =
            "ラップ";
        primary.textContent =
            "停止";
        primary.classList.add(
            "running"
        );
        status.classList.add(
            "running"
        );
        statusText.textContent =
            "FOCUS";
        return;
    }
    secondary.textContent =
        "リセット";
    primary.textContent =
        "開始";
    primary.classList.remove(
        "running"
    );
    status.classList.remove(
        "running"
    );
    statusText.textContent =
        getElapsed() > 0
            ? "PAUSED"
            : "READY";
}
/* =========================================================
   RENDER LAPS
========================================================= */
function renderLaps() {
    const container =
        document.getElementById(
            "laps"
        );
    const count =
        document.getElementById(
            "lapCount"
        );
    count.textContent =
        state.laps.length;
    if (
        state.laps.length === 0
    ) {
        container.innerHTML = `
            <div class="empty">
                ラップを記録すると、ここに表示されます
            </div>
        `;
        return;
    }
    container.innerHTML =
        state.laps
            .map(
                (lap, index) => {
                    const duration =
                        calculateLapDuration(
                            index
                        );
                    const lapNumber =
                        state.laps.length -
                        index;
                    return `
                        <div
                            class="lap"
                            data-id="${lap.id}">
                            <div class="lap-day">
                                <span class="lap-number">
                                    LAP ${lapNumber}
                                </span>
                                ${formatLapDate(
                                    lap.timestamp
                                )}
                            </div>
                            <div class="lap-time">
                                ${formatStudyTime(
                                    duration
                                )}
                            </div>
                        </div>
                    `;
                }
            )
            .join("");
    container
        .querySelectorAll(".lap")
        .forEach(
            element => {
                element.addEventListener(
                    "click",
                    () => {
                        openEditModal(
                            element.dataset.id
                        );
                    }
                );
            }
        );
}
/* =========================================================
   EDIT MODAL
========================================================= */
function openEditModal(id) {
    const lap =
        state.laps.find(
            item =>
                item.id === id
        );
    if (!lap) return;
    editingLapId = id;
    const date =
        new Date(
            lap.timestamp
        );
    document
        .getElementById("editDate")
        .value =
        toDateInputValue(
            date
        );
    document
        .getElementById("editTime")
        .value =
        toTimeInputValue(
            date
        );
    document
        .getElementById(
            "modalOverlay"
        )
        .classList.add("show");
}
function closeEditModal() {
    editingLapId = null;
    document
        .getElementById(
            "modalOverlay"
        )
        .classList.remove(
            "show"
        );
}
/* =========================================================
   SAVE EDIT
========================================================= */
function saveEdit() {
    if (!editingLapId) return;
    const index =
        state.laps.findIndex(
            lap =>
                lap.id ===
                editingLapId
        );
    if (index === -1) return;
    const lap =
        state.laps[index];
    const dateValue =
        document
            .getElementById(
                "editDate"
            )
            .value;
    const timeValue =
        document
            .getElementById(
                "editTime"
            )
            .value;
    if (
        !dateValue ||
        !timeValue
    ) {
        alert(
            "日時を入力してください。"
        );
        return;
    }
    const newDate =
        new Date(
            `${dateValue}T${timeValue}`
        );
    if (
        Number.isNaN(
            newDate.getTime()
        )
    ) {
        alert(
            "日時を正しく入力してください。"
        );
        return;
    }
    const oldDate =
        new Date(
            lap.timestamp
        );
    const difference =
        newDate.getTime() -
        oldDate.getTime();
    /*
     * ラップ自身を変更
     */
    lap.timestamp =
        newDate.toISOString();
    lap.elapsed =
        Math.max(
            0,
            lap.elapsed +
            difference
        );
    /*
     * このラップより後の
     * 時間軸を移動
     */
    state.laps.forEach(
        otherLap => {
            if (
                otherLap.id ===
                lap.id
            ) {
                return;
            }
            const otherDate =
                new Date(
                    otherLap.timestamp
                );
            if (
                otherDate.getTime() >
                oldDate.getTime()
            ) {
                otherLap.timestamp =
                    new Date(
                        otherDate.getTime() +
                        difference
                    ).toISOString();
                otherLap.elapsed =
                    Math.max(
                        0,
                        otherLap.elapsed +
                        difference
                    );
            }
        }
    );
    /*
     * 現在のストップウォッチ時間も
     * 時間軸に合わせる。
     */
    state.accumulated =
        Math.max(
            0,
            state.accumulated +
            difference
        );
    if (
        state.running &&
        state.currentRunStart
    ) {
        state.currentRunStart +=
            difference;
    }
    /*
     * 新しい日時順に並べる
     */
    state.laps.sort(
        (a, b) =>
            new Date(b.timestamp) -
            new Date(a.timestamp)
    );
    normalizeLaps();
    saveState();
    renderLaps();
    updateTimer();
    closeEditModal();
    showToast(
        "時間を更新しました"
    );
}
/* =========================================================
   NORMALIZE
========================================================= */
function normalizeLaps() {
    if (
        state.laps.length <= 1
    ) {
        return;
    }
    for (
        let i = 0;
        i < state.laps.length - 1;
        i++
    ) {
        const newer =
            state.laps[i];
        const older =
            state.laps[i + 1];
        if (
            newer.elapsed <
            older.elapsed
        ) {
            newer.elapsed =
                older.elapsed;
        }
    }
}
/* =========================================================
   DELETE
========================================================= */
function deleteLap() {
    if (!editingLapId) return;
    const confirmed =
        confirm(
            "このラップを削除しますか？"
        );
    if (!confirmed) return;
    state.laps =
        state.laps.filter(
            lap =>
                lap.id !==
                editingLapId
        );
    normalizeLaps();
    saveState();
    renderLaps();
    closeEditModal();
    showToast(
        "ラップを削除しました"
    );
}
/* =========================================================
   TOAST
========================================================= */
let toastTimer = null;
function showToast(message) {
    const toast =
        document.getElementById(
            "toast"
        );
    toast.textContent =
        message;
    toast.classList.add(
        "show"
    );
    clearTimeout(
        toastTimer
    );
    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            1800
        );
}
/* =========================================================
   EVENTS
========================================================= */
document
    .getElementById(
        "startStopButton"
    )
    .addEventListener(
        "click",
        startStopwatch
    );
document
    .getElementById(
        "secondaryButton"
    )
    .addEventListener(
        "click",
        () => {
            if (state.running) {
                addLap();
            } else {
                resetStopwatch();
            }
        }
    );
document
    .getElementById(
        "cancelEdit"
    )
    .addEventListener(
        "click",
        closeEditModal
    );
document
    .getElementById(
        "saveEdit"
    )
    .addEventListener(
        "click",
        saveEdit
    );
document
    .getElementById(
        "deleteLap"
    )
    .addEventListener(
        "click",
        deleteLap
    );
document
    .getElementById(
        "modalOverlay"
    )
    .addEventListener(
        "click",
        event => {
            if (
                event.target ===
                document.getElementById(
                    "modalOverlay"
                )
            ) {
                closeEditModal();
            }
        }
    );
/* =========================================================
   INITIALIZE
========================================================= */
loadState();
updateTimer();
updateControls();
renderLaps();
if (state.running) {
    updateTimer();
}
</script>
</body>
