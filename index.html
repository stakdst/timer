                            "swiping"
                        );
                        card.style.transition =
                            "transform .26s cubic-bezier(.2,.9,.25,1)";
                        /*
                         * =============================================
                         * 第2段階
                         * =============================================
                         */
                        if (
                            opened &&
                            tx < DELETE_X
                        ) {
                            row.classList.remove(
                                "armed"
                            );
                            card.style.transform =
                                "translateX(-115%)";
                            row.style.setProperty(
                                "--delete-width",
                                "0px"
                            );
                            removeLap(
                                targetId,
                                row
                            );
                        }
                        /*
                         * =============================================
                         * 第1段階
                         * =============================================
                         *
                         * 左へスワイプして
                         * ゴミ箱を開く
                         */
                        else if (
                            tx <
                            OPEN_X * .45
                        ) {
                            row.classList.remove(
                                "armed"
                            );
                            card.style.transform =
                                "translateX(" +
                                OPEN_X +
                                "px)";
                            row.style.setProperty(
                                "--delete-width",
                                Math.abs(
                                    OPEN_X
                                ) + "px"
                            );
                            row.classList.add(
                                "open"
                            );
                            /*
                             * 初めて開いたときだけ
                             * 軽く振動
                             */
                            if (!opened) {
                                haptic(8);
                            }
                            openRow = row;
                        }
                        /*
                         * =============================================
                         * 閉じる
                         * =============================================
                         */
                        else {
                            row.classList.remove(
                                "armed"
                            );
                            card.style.transform =
                                "translateX(0)";
                            row.style.setProperty(
                                "--delete-width",
                                "0px"
                            );
                            row.classList.remove(
                                "open"
                            );
                            if (
                                openRow === row
                            ) {
                                openRow = null;
                            }
                        }
                        wasArmed = false;
                        return;
                    }
                    /*
                     * =============================================
                     * TAP
                     * =============================================
                     */
                    const dt =
                        performance.now() -
                        st;
                    const moved =
                        Math.abs(
                            event.clientX -
                            sx
                        ) +
                        Math.abs(
                            event.clientY -
                            sy
                        );
                    if (
                        mode === null &&
                        moved < 12 &&
                        dt < 520
                    ) {
                        /*
                         * 別の行が開いていたら
                         * まず閉じる
                         */
                        if (openRow) {
                            closeOpenRow();
                            return;
                        }
                        /*
                         * 通常タップは編集
                         */
                        openEditModal(
                            targetId
                        );
                    }
                }
            }
            /* =========================================================
             * RENDER LAPS
             * ========================================================= */
            function createLapRow({
                number,
                startedAt,
                duration,
                active = false,
                id = null
            }) {
                const row =
                    document.createElement(
                        "div"
                    );
                row.className =
                    "row";
                const rowBg =
                    document.createElement(
                        "div"
                    );
                rowBg.className =
                    "row-bg";
                rowBg.innerHTML =
                    TRASH_SVG;
                rowBg.setAttribute(
                    "role",
                    "button"
                );
                rowBg.setAttribute(
                    "aria-label",
                    "ラップを削除"
                );
                const card =
                    document.createElement(
                        "div"
                    );
                card.className =
                    "lap item";
                const day =
                    document.createElement(
                        "div"
                    );
                day.className =
                    "lap-day";
                const numberElement =
                    document.createElement(
                        "span"
                    );
                numberElement.className =
                    "lap-number";
                numberElement.textContent =
                    "LAP " + number;
                const dateElement =
                    document.createElement(
                        "span"
                    );
                dateElement.textContent =
                    formatLapStart(
                        startedAt
                    );
                const timeElement =
                    document.createElement(
                        "div"
                    );
                timeElement.className =
                    "lap-time";
                timeElement.textContent =
                    formatStudyTime(
                        duration
                    );
                const targetId =
                    active
                        ? ACTIVE_LAP_ID
                        : id;
                if (active) {
                    card.classList.add(
                        "lap-active"
                    );
                    activeLapTimeElement =
                        timeElement;
                    lastActiveLapSeconds =
                        Math.floor(
                            duration /
                            1000
                        );
                } else {
                    card.dataset.id =
                        id;
                }
                card.title =
                    state.running
                        ? "停止すると編集できます。"
                        : "クリックして編集 / 左スワイプで削除";
                card.setAttribute(
                    "role",
                    "button"
                );
                card.setAttribute(
                    "aria-disabled",
                    String(
                        state.running
                    )
                );
                card.tabIndex =
                    state.running
                        ? -1
                        : 0;
                /*
                 * キーボード操作では編集のみ。
                 * 削除はスワイプまたはゴミ箱タップ。
                 */
                card.addEventListener(
                    "keydown",
                    event => {
                        if (
                            event.key ===
                            "Enter" ||
                            event.key ===
                            " "
                        ) {
                            event.preventDefault();
                            openEditModal(
                                targetId
                            );
                        }
                    }
                );
                day.append(
                    numberElement,
                    dateElement
                );
                card.append(
                    day,
                    timeElement
                );
                row.append(
                    rowBg,
                    card
                );
                /*
                 * 停止中のみ削除ジェスチャーを有効化
                 */
                bindLapGestures(
                    row,
                    card,
                    targetId
                );
                return row;
            }
            function renderLaps() {
                activeLapTimeElement =
                    null;
                lastActiveLapSeconds =
                    null;
                /*
                 * 再描画時に
                 * 開いている行を解除
                 */
                openRow = null;
                const totalCount = (
                    state.laps.length +
                    (
                        state.hasActiveLap
                            ? 1
                            : 0
                    )
                );
                elements.lapCount.textContent =
                    String(totalCount);
                if (
                    totalCount === 0
                ) {
                    const empty =
                        document.createElement(
                            "div"
                        );
                    empty.className =
                        "empty";
                    empty.textContent =
                        "開始すると、最新ラップがここに表示されます";
                    elements.laps.replaceChildren(
                        empty
                    );
                    return;
                }
                const fragment =
                    document.createDocumentFragment();
                if (
                    state.hasActiveLap
                ) {
                    fragment.append(
                        createLapRow({
                            number:
                                state.laps.length +
                                1,
                            startedAt:
                                state.activeLapStartedAt,
                            duration:
                                getActiveLapDuration(),
                            active: true
                        })
                    );
                }
                state.laps.forEach(
                    (
                        lap,
                        index
                    ) => {
                        fragment.append(
                            createLapRow({
                                number:
                                    state.laps.length -
                                    index,
                                startedAt:
                                    lap.startedAt,
                                duration:
                                    calculateLapDuration(
                                        index
                                    ),
                                id:
                                    lap.id
                            })
                        );
                    }
                );
                elements.laps.replaceChildren(
                    fragment
                );
            }
            /* =========================================================
             * TIME REEL
             * ========================================================= */
            function createTimeReel(
                element,
                max,
                value,
                type
            ) {
                element.replaceChildren();
                reelValues[type] =
                    Math.max(
                        0,
                        Math.min(
                            max,
                            Number(value) || 0
                        )
                    );
                const reelState = {
                    dragging: false,
                    moved: false,
                    pointerId: null,
                    startY: 0,
                    startScrollTop: 0,
                    lastY: 0,
                    lastTime: 0,
                    velocity: 0,
                    samples: [],
                    momentumFrame: null,
                    snapFrame: null,
                    suppressClick: false,
                    scrollTimer: null
                };
                /* =====================================================
                 * ITEM
                 * ===================================================== */
                for (
                    let number = 0;
                    number <= max;
                    number++
                ) {
                    const item =
                        document.createElement(
                            "div"
                        );
                    item.className =
                        "time-reel-item";
                    item.dataset.value =
                        String(number);
                    item.textContent =
                        pad(number);
                    item.addEventListener(
                        "click",
                        event => {
                            event.stopPropagation();
                            if (
                                reelState.suppressClick
                            ) {
                                return;
                            }
                            stopMomentum();
                            stopSnap();
                            reelValues[type] =
                                number;
                            snapReelToValue(
                                element,
                                type,
                                number
                            );
                        }
                    );
                    element.appendChild(
                        item
                    );
                }
                /* =====================================================
                 * HELPERS
                 * ===================================================== */
                function getMaxScroll() {
                    return Math.max(
                        0,
                        element.scrollHeight -
                        element.clientHeight
                    );
                }
                function clampScroll(
                    value
                ) {
                    return Math.max(
                        0,
                        Math.min(
                            getMaxScroll(),
                            value
                        )
                    );
                }
                function stopMomentum() {
                    if (
                        reelState.momentumFrame !==
                        null
                    ) {
                        cancelAnimationFrame(
                            reelState.momentumFrame
                        );
                        reelState.momentumFrame =
                            null;
                    }
                }
                function stopSnap() {
                    if (
                        reelState.snapFrame !==
                        null
                    ) {
                        cancelAnimationFrame(
                            reelState.snapFrame
                        );
                        reelState.snapFrame =
                            null;
                    }
                }
                function getNearestIndex() {
                    const items =
                        element.querySelectorAll(
                            ".time-reel-item"
                        );
                    if (!items.length) {
                        return 0;
                    }
                    const center =
                        element.scrollTop +
                        element.clientHeight /
                        2;
                    let closestIndex =
                        0;
                    let closestDistance =
                        Infinity;
                    items.forEach(
                        (
                            item,
                            index
                        ) => {
                            const itemCenter =
                                item.offsetTop +
                                item.offsetHeight /
                                2;
                            const distance =
                                Math.abs(
                                    itemCenter -
                                    center
                                );
                            if (
                                distance <
                                closestDistance
                            ) {
                                closestDistance =
                                    distance;
                                closestIndex =
                                    index;
                            }
                        }
                    );
                    return closestIndex;
                }
                function getSnapPosition(
                    index
                ) {
                    const items =
                        element.querySelectorAll(
                            ".time-reel-item"
                        );
                    const item =
                        items[index];
                    if (!item) {
                        return 0;
                    }
                    return clampScroll(
                        item.offsetTop -
                        (
                            element.clientHeight -
                            item.offsetHeight
                        ) / 2
                    );
                }
                function updateSelection() {
                    updateReelSelection(
                        element,
                        type
                    );
                }
                /* =====================================================
                 * SMOOTH SNAP
                 * ===================================================== */
                function snapToNearest() {
                    stopSnap();
                    const index =
                        getNearestIndex();
                    const target =
                        getSnapPosition(
                            index
                        );
                    const start =
                        element.scrollTop;
                    const distance =
                        target - start;
                    reelValues[type] =
                        index;
                    updateSelection();
                    if (
                        Math.abs(
                            distance
                        ) < 0.5
                    ) {
                        element.scrollTop =
                            target;
                        return;
                    }
                    const duration =
                        Math.min(
                            180,
                            Math.max(
                                90,
                                Math.abs(
                                    distance
                                ) * .7
                            )
                        );
                    const startTime =
                        performance.now();
                    function frame(now) {
                        const progress =
                            Math.min(
                                1,
                                (
                                    now -
                                    startTime
                                ) /
                                duration
                            );
                        const eased =
                            1 -
                            Math.pow(
                                1 -
                                progress,
                                3
                            );
                        element.scrollTop =
                            start +
                            distance *
                            eased;
                        updateSelection();
                        if (
                            progress < 1
                        ) {
                            reelState.snapFrame =
                                requestAnimationFrame(
                                    frame
                                );
                        } else {
                            reelState.snapFrame =
                                null;
                            element.scrollTop =
                                target;
                            updateSelection();
                        }
                    }
                    reelState.snapFrame =
                        requestAnimationFrame(
                            frame
                        );
                }
                function snapReelToValue(
                    targetElement,
                    targetType,
                    value
                ) {
                    const item =
                        targetElement.querySelector(
                            `[data-value="${value}"]`
                        );
                    if (!item) {
                        return;
                    }
                    const target =
                        item.offsetTop -
                        (
                            targetElement.clientHeight -
                            item.offsetHeight
                        ) / 2;
                    const start =
                        targetElement.scrollTop;
                    const distance =
                        target -
                        start;
                    reelValues[
                        targetType
                    ] =
                        Number(value);
                    if (
                        Math.abs(
                            distance
                        ) < 0.5
                    ) {
                        targetElement.scrollTop =
                            target;
                        updateReelSelection(
                            targetElement,
                            targetType
                        );
                        return;
                    }
                    const duration =
                        Math.min(
                            180,
                            Math.max(
                                100,
                                Math.abs(
                                    distance
                                ) * .7
                            )
                        );
                    const startTime =
                        performance.now();
                    function frame(now) {
                        const progress =
                            Math.min(
                                1,
                                (
                                    now -
                                    startTime
                                ) /
                                duration
                            );
                        const eased =
                            1 -
                            Math.pow(
                                1 -
                                progress,
                                3
                            );
                        targetElement.scrollTop =
                            start +
                            distance *
                            eased;
                        updateReelSelection(
                            targetElement,
                            targetType
                        );
                        if (
                            progress < 1
                        ) {
                            reelState.snapFrame =
                                requestAnimationFrame(
                                    frame
                                );
                        } else {
                            reelState.snapFrame =
                                null;
                            targetElement.scrollTop =
                                target;
                            updateReelSelection(
                                targetElement,
                                targetType
                            );
                        }
                    }
                    stopSnap();
                    reelState.snapFrame =
                        requestAnimationFrame(
                            frame
                        );
                }
                /* =====================================================
                 * POINTER DOWN
                 * ===================================================== */
                element.addEventListener(
                    "pointerdown",
                    event => {
                        if (
                            event.pointerType ===
                            "mouse" &&
                            event.button !== 0
                        ) {
                            return;
                        }
                        stopMomentum();
                        stopSnap();
                        reelState.dragging =
                            true;
                        reelState.moved =
                            false;
                        reelState.pointerId =
                            event.pointerId;
                        reelState.startY =
                            event.clientY;
                        reelState.startScrollTop =
                            element.scrollTop;
                        reelState.lastY =
                            event.clientY;
                        reelState.lastTime =
                            performance.now();
                        reelState.velocity =
                            0;
                        reelState.samples = [
                            {
                                y:
                                    event.clientY,
                                time:
                                    performance.now()
                            }
                        ];
                        element.setPointerCapture?.(
                            event.pointerId
                        );
                        event.preventDefault();
                    },
                    {
                        passive: false
                    }
                );
                /* =====================================================
                 * POINTER MOVE
                 * ===================================================== */
                element.addEventListener(
                    "pointermove",
                    event => {
                        if (
                            !reelState.dragging ||
                            reelState.pointerId !==
                            event.pointerId
                        ) {
                            return;
                        }
                        const now =
                            performance.now();
                        const deltaY =
                            event.clientY -
                            reelState.startY;
                        if (
                            Math.abs(
                                deltaY
                            ) > 4
                        ) {
                            reelState.moved =
                                true;
                        }
                        const targetScroll =
                            reelState.startScrollTop -
                            deltaY;
                        element.scrollTop =
                            clampScroll(
                                targetScroll
                            );
                        reelState.samples.push({
                            y:
                                event.clientY,
                            time:
                                now
                        });
                        const cutoff =
                            now - 80;
                        while (
                            reelState.samples.length >
                            2 &&
                            reelState.samples[0]
                                .time <
                            cutoff
                        ) {
                            reelState.samples.shift();
                        }
                        if (
                            reelState.samples.length >=
                            2
                        ) {
                            const first =
                                reelState.samples[
                                0
                                ];
                            const last =
                                reelState.samples[
                                reelState.samples
                                    .length - 1
                                ];
                            const timeDelta =
                                Math.max(
                                    1,
                                    last.time -
                                    first.time
                                );
                            reelState.velocity =
                                -(
                                    last.y -
                                    first.y
                                ) /
                                timeDelta;
                        }
                        reelState.lastY =
                            event.clientY;
                        reelState.lastTime =
                            now;
                        updateSelection();
                        event.preventDefault();
                    },
                    {
                        passive: false
                    }
                );
                /* =====================================================
                 * POINTER UP
                 * ===================================================== */
                element.addEventListener(
                    "pointerup",
                    event => {
                        if (
                            !reelState.dragging ||
                            reelState.pointerId !==
                            event.pointerId
                        ) {
                            return;
                        }
                        reelState.dragging =
                            false;
                        try {
                            element.releasePointerCapture?.(
                                event.pointerId
                            );
                        } catch (error) { }
                        const velocity =
                            reelState.velocity;
                        const wasMoved =
                            reelState.moved;
                        reelState.pointerId =
                            null;
                        reelState.suppressClick =
                            wasMoved;
                        if (wasMoved) {
                            startMomentum(
                                velocity
                            );
                        } else {
                            snapToNearest();
                        }
                        setTimeout(
                            () => {
                                reelState.suppressClick =
                                    false;
                            },
                            100
                        );
                        event.preventDefault();
                    },
                    {
                        passive: false
                    }
                );
                /* =====================================================
                 * POINTER CANCEL
                 * ===================================================== */
                element.addEventListener(
                    "pointercancel",
                    event => {
                        if (
                            !reelState.dragging
                        ) {
                            return;
                        }
                        reelState.dragging =
                            false;
                        reelState.pointerId =
                            null;
                        snapToNearest();
                    },
                    {
                        passive: true
                    }
                );
                /* =====================================================
                 * WHEEL
                 * ===================================================== */
                element.addEventListener(
                    "wheel",
                    event => {
                        event.preventDefault();
                        stopMomentum();
                        stopSnap();
                        const WHEEL_SPEED =
                            1.5;
                        element.scrollTop =
                            clampScroll(
                                element.scrollTop +
                                event.deltaY *
                                WHEEL_SPEED
                            );
                        updateSelection();
                        clearTimeout(
                            reelState.scrollTimer
                        );
                        reelState.scrollTimer =
                            setTimeout(
                                () => {
                                    snapToNearest();
                                },
                                60
                            );
                    },
                    {
                        passive: false
                    }
                );
                /* =====================================================
                 * iPHONE風 慣性
                 * ===================================================== */
                function startMomentum(
                    initialVelocity
                ) {
                    stopMomentum();
                    if (
                        Math.abs(
                            initialVelocity
                        ) < 0.08
                    ) {
                        snapToNearest();
                        return;
                    }
                    const MAX_VELOCITY =
                        2.8;
                    let velocity =
                        Math.max(
                            -MAX_VELOCITY,
                            Math.min(
                                MAX_VELOCITY,
                                initialVelocity
                            )
                        );
                    let lastTime =
                        performance.now();
                    const FRICTION =
                        0.965;
                    function frame(now) {
                        const delta =
                            Math.min(
                                32,
                                Math.max(
                                    1,
                                    now -
                                    lastTime
                                )
                            );
                        lastTime =
                            now;
                        const friction =
                            Math.pow(
                                FRICTION,
                                delta / 16.67
                            );
                        velocity *=
                            friction;
                        const nextScroll =
                            element.scrollTop +
                            velocity *
                            delta;
                        const maxScroll =
                            getMaxScroll();
                        if (
                            nextScroll <= 0
                        ) {
                            element.scrollTop =
                                0;
                            velocity *=
                                0.35;
                        } else if (
                            nextScroll >=
                            maxScroll
                        ) {
                            element.scrollTop =
                                maxScroll;
                            velocity *=
                                0.35;
                        } else {
                            element.scrollTop =
                                nextScroll;
                        }
                        updateSelection();
                        if (
                            Math.abs(
                                velocity
                            ) > 0.025
                        ) {
                            reelState.momentumFrame =
                                requestAnimationFrame(
                                    frame
                                );
                        } else {
                            reelState.momentumFrame =
                                null;
                            snapToNearest();
                        }
                    }
                    reelState.momentumFrame =
                        requestAnimationFrame(
                            frame
                        );
                }
                /* =====================================================
                 * INITIAL POSITION
                 * ===================================================== */
                requestAnimationFrame(
                    () => {
                        const item =
                            element.querySelector(
                                `[data-value="${reelValues[type]}"]`
                            );
                        if (item) {
                            element.scrollTop =
                                item.offsetTop -
                                (
                                    element.clientHeight -
                                    item.offsetHeight
                                ) /
                                2;
                        }
                        updateSelection();
                    }
                );
            }
            /* =========================================================
             * REEL SELECTION
             * ========================================================= */
            function updateReelSelection(
                element,
                type
            ) {
                const items =
                    element.querySelectorAll(
                        ".time-reel-item"
                    );
                if (!items.length) {
                    return;
                }
                const center =
                    element.scrollTop +
                    element.clientHeight /
                    2;
                let closest = null;
                let closestDistance =
                    Infinity;
                items.forEach(
                    item => {
                        const itemCenter =
                            item.offsetTop +
                            item.offsetHeight /
                            2;
                        const distance =
                            Math.abs(
                                itemCenter -
                                center
                            );
                        if (
                            distance <
                            closestDistance
                        ) {
                            closestDistance =
                                distance;
                            closest = item;
                        }
                        item.classList.remove(
                            "selected"
                        );
                    }
                );
                if (!closest) {
                    return;
                }
                closest.classList.add(
                    "selected"
                );
                reelValues[type] =
                    Number(
                        closest.dataset.value
                    );
            }
            /* =========================================================
             * POPULATE TIME PICKER
             * ========================================================= */
            function populateTimePicker(
                requiredHours = 99,
                selectedHours = 0,
                selectedMinutes = 0,
                selectedSeconds = 0
            ) {
                const maxHours =
                    Math.max(
                        99,
                        requiredHours
                    );
                createTimeReel(
                    elements.editHours,
                    maxHours,
                    selectedHours,
                    "hours"
                );
                createTimeReel(
                    elements.editMinutes,
                    59,
                    selectedMinutes,
                    "minutes"
                );
                createTimeReel(
                    elements.editSeconds,
                    59,
                    selectedSeconds,
                    "seconds"
                );
            }
            function getTimeReelValue(
                type
            ) {
                return Math.max(
                    0,
                    Number(
                        reelValues[type]
                    ) || 0
                );
            }
            /* =========================================================
             * OPEN EDIT MODAL
             * ========================================================= */
            function openEditModal(id) {
                if (
                    state.running ||
                    isDialogOpen()
                ) {
                    return;
                }
                const duration =
                    getEditableLapDuration(
                        id
                    );
                if (duration === null) {
                    return;
                }
                editingLapId =
                    id;
                const totalSeconds =
                    Math.floor(
                        duration /
                        1000
                    );
                const hours =
                    Math.floor(
                        totalSeconds /
                        3600
                    );
                const minutes =
                    Math.floor(
                        (
                            totalSeconds %
                            3600
                        ) /
                        60
                    );
                const seconds =
                    totalSeconds %
                    60;
                populateTimePicker(
                    hours,
                    hours,
                    minutes,
                    seconds
                );
                elements.modalOverlay.classList.add(
                    "show"
                );
            }
            function closeEditModal() {
                editingLapId = null;
                elements.modalOverlay.classList.remove(
                    "show"
                );
            }
            /* =========================================================
             * SAVE EDIT
             * ========================================================= */
            function saveEdit() {
                if (
                    editingLapId === null ||
                    state.running ||
                    confirmResolver !== null
                ) {
                    return;
                }
                const oldDuration =
                    getEditableLapDuration(
                        editingLapId
                    );
                if (
                    oldDuration === null
                ) {
                    closeEditModal();
                    return;
                }
                const hours =
                    getTimeReelValue(
                        "hours"
                    );
                const minutes =
                    getTimeReelValue(
                        "minutes"
                    );
                const seconds =
                    getTimeReelValue(
                        "seconds"
                    );
                if (
                    !Number.isInteger(
                        hours
                    ) ||
                    !Number.isInteger(
                        minutes
                    ) ||
                    !Number.isInteger(
                        seconds
                    ) ||
                    hours < 0 ||
                    minutes < 0 ||
                    minutes > 59 ||
                    seconds < 0 ||
                    seconds > 59
                ) {
                    return;
                }
                const newDuration = (
                    (
                        hours * 60 +
                        minutes
                    ) *
                    60 +
                    seconds
                ) * 1000;
                const displayedOldDuration =
                    Math.floor(
                        oldDuration /
                        1000
                    ) * 1000;
                if (
                    newDuration ===
                    displayedOldDuration
                ) {
                    closeEditModal();
                    return;
                }
                if (
                    editingLapId ===
                    ACTIVE_LAP_ID
                ) {
                    state.accumulated = (
                        getLapElapsed(
                            state.laps[0]
                        ) +
                        newDuration
                    );
                } else {
                    const index =
                        state.laps.findIndex(
                            lap =>
                                lap.id ===
                                editingLapId
                        );
                    if (
                        index === -1
                    ) {
                        closeEditModal();
                        return;
                    }
                    const difference =
                        newDuration -
                        oldDuration;
                    for (
                        let current = 0;
                        current <= index;
                        current++
                    ) {
                        state.laps[
                            current
                        ].elapsed =
                            Math.max(
                                0,
                                getLapElapsed(
                                    state.laps[
                                    current
                                    ]
                                ) +
                                difference
                            );
                    }
                    state.accumulated =
                        Math.max(
                            0,
                            state.accumulated +
                            difference
                        );
                }
                normalizeLaps();
                saveState();
                renderLaps();
                updateTimer();
                updateControls();
                closeEditModal();
            }
            /* =========================================================
             * NORMALIZE
             * ========================================================= */
            function normalizeLaps() {
                for (
                    let index =
                        state.laps.length - 2;
                    index >= 0;
                    index--
                ) {
                    state.laps[
                        index
                    ].elapsed =
                        Math.max(
                            getLapElapsed(
                                state.laps[
                                index
                                ]
                            ),
                            getLapElapsed(
                                state.laps[
                                index + 1
                                ]
                            )
                        );
                }
            }
            /* =========================================================
             * EVENTS
             * ========================================================= */
            function bindEvents() {
                /* START / STOP */
                elements.startStopButton.addEventListener(
                    "click",
                    startStopwatch
                );
                /* LAP / RESET */
                elements.secondaryButton.addEventListener(
                    "click",
                    () => {
                        if (
                            state.running
                        ) {
                            addLap();
                        } else {
                            resetStopwatch();
                        }
                    }
                );
                /* CANCEL EDIT */
                elements.cancelEdit.addEventListener(
                    "click",
                    () => {
                        if (
                            confirmResolver ===
                            null
                        ) {
                            closeEditModal();
                        }
                    }
                );
                /* SAVE EDIT */
                elements.saveEdit.addEventListener(
                    "click",
                    saveEdit
                );
                /* EDIT MODAL BACKGROUND */
                elements.modalOverlay.addEventListener(
                    "click",
                    event => {
                        if (
                            event.target ===
                            elements.modalOverlay &&
                            confirmResolver ===
                            null
                        ) {
                            closeEditModal();
                        }
                    }
                );
                /* =====================================================
                 * RESET CONFIRM EVENTS
                 * ===================================================== */
                elements.confirmCancel.addEventListener(
                    "click",
                    () => {
                        closeConfirm(false);
                    }
                );
                elements.confirmOK.addEventListener(
                    "click",
                    () => {
                        closeConfirm(true);
                    }
                );
                elements.confirmOverlay.addEventListener(
                    "click",
                    event => {
                        if (
                            event.target ===
                            elements.confirmOverlay
                        ) {
                            closeConfirm(false);
                        }
                    }
                );
                /* =====================================================
                 * KEYBOARD
                 * ===================================================== */
                document.addEventListener(
                    "keydown",
                    event => {
                        if (
                            event.key !==
                            "Escape"
                        ) {
                            return;
                        }
                        if (
                            confirmResolver !==
                            null
                        ) {
                            closeConfirm(false);
                        } else if (
                            editingLapId !==
                            null
                        ) {
                            closeEditModal();
                        }
                    }
                );
                /* =====================================================
                 * BACKGROUND / RESTORE
                 * ===================================================== */
                document.addEventListener(
                    "visibilitychange",
                    () => {
                        if (
                            document.hidden
                        ) {
                            stopTimerLoop();
                            saveState();
                        } else {
                            startTimerLoop();
                        }
                    }
                );
                window.addEventListener(
                    "pagehide",
                    () => {
                        stopTimerLoop();
                        saveState();
                    }
                );
                window.addEventListener(
                    "pageshow",
                    () => {
                        startTimerLoop();
                    }
                );
                /* =====================================================
                 * ZOOM PREVENTION
                 * ===================================================== */
                document.addEventListener(
                    "gesturestart",
                    event => {
                        event.preventDefault();
                    },
                    {
                        passive: false
                    }
                );
                document.addEventListener(
                    "gesturechange",
                    event => {
                        event.preventDefault();
                    },
                    {
                        passive: false
                    }
                );
                document.addEventListener(
                    "gestureend",
                    event => {
                        event.preventDefault();
                    },
                    {
                        passive: false
                    }
                );
                /* =====================================================
                 * DOUBLE TAP ZOOM PREVENTION
                 * ===================================================== */
                let lastTouchEnd = 0;
                document.addEventListener(
                    "touchend",
                    event => {
                        const now =
                            Date.now();
                        const target =
                            event.target;
                        const interactive =
                            target instanceof Element
                                ? target.closest(
                                    'button, input, select, textarea, a, [role="button"]'
                                )
                                : null;
                        if (
                            !interactive &&
                            now -
                            lastTouchEnd <=
                            300
                        ) {
                            event.preventDefault();
                        }
                        lastTouchEnd =
                            now;
                    },
                    {
                        passive: false
                    }
                );
            }
            /* =========================================================
             * INITIALIZE
             * ========================================================= */
            function initialize() {
                const requiredIds = [
                    "timer",
                    "laps",
                    "lapCount",
                    "secondaryButton",
                    "startStopButton",
                    "status",
                    "statusText",
                    "editHours",
                    "editMinutes",
                    "editSeconds",
                    "modalOverlay",
                    "cancelEdit",
                    "saveEdit",
                    "confirmTitle",
                    "confirmOK",
                    "confirmOverlay",
                    "confirmCancel"
                ];
                for (
                    const id
                    of requiredIds
                ) {
                    const element =
                        document.getElementById(
                            id
                        );
                    if (!element) {
                        console.error(
                            "必要なHTML要素が見つかりません: " +
                            id
                        );
                        return;
                    }
                    elements[id] =
                        element;
                }
                loadState();
                updateControls();
                renderLaps();
                bindEvents();
                startTimerLoop();
            }
            if (
                document.readyState ===
                "loading"
            ) {
                document.addEventListener(
                    "DOMContentLoaded",
                    initialize,
                    {
                        once: true
                    }
                );
            } else {
                initialize();
            }
        })();
    </script>
</body>

</html>
