<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./timer.png">
    <link rel="apple-touch-icon" href="./timer.png">
    <title>Study Timer</title>
    <style>
        :root {
            --glass-line: rgba(255, 255, 255, .25);
            --glass-highlight: rgba(255, 255, 255, .26);
            --glass-shadow: rgba(0, 0, 0, .22);
            --card-glass-1: rgba(255, 255, 255, .40);
            --card-glass-2: rgba(255, 255, 255, .20);
            --card-glass-3: rgba(255, 255, 255, .08);
        }

        /* ==== BASE ==== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100lvh;
            min-height: 100%;
            min-height: 100lvh;
            background: #080808;
            color: #f5f5f7;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
        }

        /* ==== APP ==== */
        .app {
            width: 100%;
            height: 100dvh;
            min-height: 0;
            padding:
                max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 50% -10%,
                    #292929 0%,
                    #111 38%,
                    #080808 75%);
            overflow: hidden;
        }

        /* ==== HEADER ==== */
        header {
            width: 100%;
            max-width: 760px;
            height: 30px;
            margin:
                0 auto 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .title {
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #555;
            font-size: 11px;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
        }

        .status.running {
            color: #888;
        }

        .status.running .status-dot {
            background: #30d158;
            box-shadow:
                0 0 8px rgba(48, 209, 88, .7);
        }

        /* ==== MAIN ==== */
        main {
            width: 100%;
            max-width: 760px;
            height:
                calc(100dvh - 32px - 30px - 20px - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ==== TIMER ==== */
        .timer-area {
            width: 100%;
            text-align: center;
            margin:
                50px 0;
            flex-shrink: 0;
        }

        .timer {
            color: #f5f5f7;
            font-size:
                clamp(66px, 22vw, 165px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -3px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .timer.long {
            font-size:
                clamp(58px, 16.5vw, 165px);
            letter-spacing: -3px;
        }

        /* ==== CONTROLS ==== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(310px, 100%);
            margin:
                0 auto 50px;
            flex-shrink: 0;
        }

        .circle-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #252527;
            color: #eeeeee;
            font-size: 15px;
            font-weight: 500;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .05),
                0 8px 30px rgba(0, 0, 0, .35);
            transition:
                transform .12s ease,
                background .2s ease,
                opacity .2s ease;
        }

        .circle-button:active {
            transform: scale(.93);
        }

        .circle-button.primary {
            background: #b8b8ba;
            color: #111;
        }

        .circle-button.primary.running {
            background: #9f3430;
            color: #fff;
        }

        /* ==== LAP SECTION ==== */
        main>section:last-child {
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }

        /* ==== LAP HEADER ==== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding:
                0 5px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .section-title {
            color: #777;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .lap-count {
            color: #555;
            font-size: 12px;
        }

        #chartRange {
            display: none !important;
        }

        /* ==== LAP LIST ==== */
        .laps {
            border-top:
                1px solid #242424;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: none;
            flex: 1;
        }

        .laps::-webkit-scrollbar {
            display: none;
        }

        /* ==== 2段階左スワイプ用 ==== */
        .row {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-bottom:
                1px solid #202020;
        }

        .row .item {
            position: relative;
            z-index: 1;
            width: 100%;
            background: #080808;
            touch-action: pan-y;
            will-change: transform;
        }

        .row.removing .item {
            transition:
                transform .24s cubic-bezier(.2, .9, .25, 1),
                opacity .24s ease;
        }

        /* ==== 削除背景 ==== */
        .row-bg {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--delete-width, 0px);
            border-radius:
                0 8px 8px 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 0;
            opacity: 0;
            transition:
                opacity .16s,
                background .2s;
            cursor: pointer;
            z-index: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .row.swiping .row-bg,
        .row.open .row-bg {
            opacity: 1;
            background:
                rgba(255, 60, 105, .62);
        }

        .row.armed .row-bg {
            background:
                rgba(255, 60, 105, .62);
        }

        .row-bg .trash {
            width: 26px;
            height: 26px;
            opacity: .96;
            transition:
                transform .18s cubic-bezier(.2, .9, .25, 1);
            pointer-events: none;
        }

        .row.armed .row-bg .trash {
            transform: scale(1.22);
        }

        /* ==== LAP ==== */
        .lap {
            display: grid;
            grid-template-columns:
                1fr auto;
            align-items: center;
            min-height: 0;
            padding:
                12px 5px;
            border-bottom: none;
            cursor: pointer;
            transition:
                background .15s ease;
        }

        .lap:active {
            background: #181818;
        }

        .lap-day {
            display: flex;
            align-items: center;
            min-width: 0;
            color: #ddd;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        .lap-number {
            width: 48px;
            color: #555;
            font-size: 10px;
            flex-shrink: 0;
        }

        .lap-time {
            color: #eee;
            font-size: 16px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .empty {
            padding:
                42px 0;
            color: #555;
            font-size: 13px;
            text-align: center;
        }

        /* ==== MODAL ==== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-top: 20px;
            background: rgba(0,0,0,.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: min(520px, 100%);
            padding:
                22px 22px max(25px, env(safe-area-inset-bottom));
            border: 1px solid var(--glass-line);
            border-bottom: 0;
            border-radius:
                24px 24px 0 0;
            background: linear-gradient(155deg, rgba(100,100,104,.94), rgba(38,38,41,.97) 42%, rgba(22,22,24,.99));
            transform: translateY(100%);
            transition: transform .24s cubic-bezier(.2,.9,.25,1);
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(0, 0, 0, .08),
                0 -15px 50px var(--glass-shadow);
        }

        .modal-overlay.show .modal { transform: translateY(0); }

        .modal-title {
            margin-bottom: 25px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #888;
            font-size: 11px;
            letter-spacing: .7px;
        }

        input {
            width: 100%;
            padding:
                13px 14px;
            border: none;
            outline: none;
            border-radius: 11px;
            background: #2c2c2e;
            color: #fff;
            font-size: 16px;
        }

        /* ==== REEL PICKER ==== */
        .time-picker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 150px;
            overflow: hidden;
            --reel-item-height: 50px;
            touch-action: pan-x;
            user-select: none;
            -webkit-user-select: none;
        }

        .time-picker::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 49px;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(rgba(39,39,41,.96), transparent);
        }
        .time-picker::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 50px;
            transform: translateY(-50%);
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
            pointer-events: none;
            border-radius: 10px;
        }

        .time-reel {
            position: relative;
            width: 82px;
            height: 150px;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-top: 50px;
            padding-bottom: 50px;
            overscroll-behavior: contain;
            border-radius: 11px;
            user-select: none;
            -webkit-user-select: none;
            will-change: scroll-position;
            -webkit-tap-highlight-color: transparent;
        }

        .time-reel::-webkit-scrollbar {
            display: none;
        }

        .time-reel-item {
            width: 100%;
            height: 50px;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 22px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            transition:
                color .12s ease,
                transform .12s ease,
                opacity .12s ease;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .time-reel-item.selected {
            color: #fff;
            font-weight: 500;
            transform: scale(1.08);
        }

        .time-unit {
            flex-shrink: 0;
            width: 24px;
            color: #777;
            font-size: 12px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==== REST OF MODAL ==== */
        .info {
            margin-top: 5px;
            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-button {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 12px;
            background:
                linear-gradient(145deg,
                    var(--card-glass-2),
                    var(--card-glass-3));
            color: #eee;
            font-size: 15px;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, .12),
                inset 0 -1px 1px rgba(0, 0, 0, .08);
        }

        .modal-button:active {
            opacity: .7;
        }

        .modal-button.save {
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .82),
                    rgba(255, 255, 255, .62));
            color: #111;
            font-weight: 600;
            border-color: rgba(255, 255, 255, .42);
        }

        /* ==== CONFIRM MODAL ==== */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(0, 0, 0, .55);
            z-index: 200;
        }

        .confirm-overlay.show {
            display: flex;
        }

        .confirm-box {
            width: min(320px, 100%);
            overflow: hidden;
            border: 1px solid var(--glass-line);
            border-radius: 18px;
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(0, 0, 0, .08),
                0 15px 50px var(--glass-shadow);
            animation:
                confirmAppear .18s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        @keyframes confirmAppear {
            from {
                transform: scale(.94);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .confirm-content {
            padding:
                22px 20px 20px;
            text-align: center;
        }

        .confirm-title {
            margin-bottom: 7px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .confirm-message {
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
        }

        .confirm-buttons {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            border-top:
                1px solid rgba(255, 255, 255, .16);
            background: rgba(255, 255, 255, .035);
        }

        .confirm-button {
            min-height: 44px;
            padding: 0;
            border-radius: 0;
            background: transparent;
            color: #0a84ff;
            font-size: 17px;
            font-weight: 500;
        }

        .confirm-button+.confirm-button {
            border-left:
                1px solid rgba(255, 255, 255, .16);
        }

        .confirm-button:active {
            background: #3a3a3c;
        }

        .confirm-button.danger {
            color: #ff453a;
        }

        /* ==== iPAD / LANDSCAPE ==== */
        @media (min-width: 600px) {
            .app {
                padding:
                    max(32px, env(safe-area-inset-top)) 48px max(32px, env(safe-area-inset-bottom)) 48px;
            }

            header,
            main {
                max-width: 900px;
            }

            header {
                margin-bottom: 25px;
            }

            main {
                height:
                    calc(100dvh - 32px - 30px - 25px - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns:
                    minmax(90px, 1fr) minmax(360px, 650px) minmax(90px, 1fr);
                grid-template-rows:
                    auto minmax(0, 1fr);
                column-gap: 30px;
                align-items: start;
            }

            .title {
                font-size: 15px;
                letter-spacing: 2.5px;
            }

            .status {
                font-size: 12px;
            }

            .timer-area {
                grid-column: 1 / 4;
                grid-row: 1;
                margin:
                    20px 0 45px;
                padding: 0;
            }

            .timer {
                font-size:
                    clamp(110px, 18vw, 190px);
                letter-spacing: -5px;
            }

            .timer.long {
                font-size:
                    clamp(110px, 18vw, 190px);
            }

            .controls {
                grid-column: 1 / 4;
                grid-row: 2;
                display: grid;
                grid-template-columns:
                    minmax(90px, 1fr) minmax(360px, 650px) minmax(90px, 1fr);
                column-gap: 30px;
                align-items: start;
                justify-content: initial;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                pointer-events: none;
                z-index: 2;
            }

            #secondaryButton {
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
                margin: 0;
                pointer-events: auto;
            }

            #startStopButton {
                grid-column: 3;
                grid-row: 1;
                justify-self: end;
                margin: 0;
                pointer-events: auto;
            }

            .circle-button {
                width: 90px;
                height: 90px;
                font-size: 15px;
            }

            main>section:last-child {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
                height: 100%;
                min-height: 0;
                z-index: 1;
            }

            .section-header {
                padding:
                    0 8px;
                margin-bottom: 10px;
            }

            .section-title {
                font-size: 13px;
            }

            .lap-count {
                font-size: 13px;
            }

            .lap {
                padding:
                    12px 8px;
            }

            .lap-day {
                font-size: 16px;
            }

            .lap-number {
                width: 65px;
                font-size: 10px;
            }

            .lap-time {
                font-size: 17px;
            }
        }

        /* ==== iPHONE LANDSCAPE ==== */
        @media (orientation: landscape) and (max-width: 599px) {
            .app {
                padding:
                    max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            }

            header {
                height: 20px;
                margin:
                    0 auto;
                max-width: 900px;
            }

            .title {
                font-size: 11px;
                letter-spacing: 1.8px;
            }

            .status {
                font-size: 9px;
                gap: 5px;
                letter-spacing: 1px;
            }

            .status-dot {
                width: 5px;
                height: 5px;
            }

            main {
                width: 100%;
                max-width: 900px;
                height:
                    calc(100dvh - 10px - 22px - 8px - 10px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns:
                    minmax(72px, 1fr) minmax(250px, 520px) minmax(72px, 1fr);
                grid-template-rows:
                    auto minmax(0, 1fr);
                column-gap: 16px;
                align-items: start;
            }

            .timer-area {
                grid-column: 1 / 4;
                grid-row: 1;
                margin: 0;
                padding: 0;
            }

            .timer {
                font-size:
                    clamp(52px, 12vw, 85px);
                line-height: .92;
                letter-spacing: -3px;
            }

            .timer.long {
                font-size:
                    clamp(52px, 12vw, 85px);
                letter-spacing: -3px;
            }

            .controls {
                grid-column: 1 / 4;
                grid-row: 2;
                display: grid;
                grid-template-columns:
                    minmax(72px, 1fr) minmax(250px, 520px) minmax(72px, 1fr);
                column-gap: 16px;
                align-items: start;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                pointer-events: none;
                z-index: 2;
            }

            #secondaryButton {
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
                margin: 0;
                pointer-events: auto;
            }

            #startStopButton {
                grid-column: 3;
                grid-row: 1;
                justify-self: end;
                margin: 0;
                pointer-events: auto;
            }

            .circle-button {
                width: 75px;
                height: 75px;
                font-size: 13px;
            }

            main>section:last-child {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
                height: 100%;
                min-height: 0;
                display: flex;
                flex-direction: column;
                z-index: 1;
            }

            .section-header {
                padding:
                    0 5px;
                margin-bottom: 6px;
            }

            .section-title {
                font-size: 10px;
                letter-spacing: 1.8px;
            }

            .lap-count {
                font-size: 10px;
            }

            .laps {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            .lap {
                padding:
                    7px 5px;
            }

            .lap-day {
                font-size: 12px;
            }

            .lap-number {
                width: 48px;
                font-size: 8px;
            }

            .lap-time {
                font-size: 13px;
            }

            .empty {
                padding:
                    20px 0;
                font-size: 10px;
            }
        }

        /* ==== iPAD LANDSCAPE / LARGE TABLET ==== */
        @media (min-width: 900px) {
            .app {
                padding-left: 70px;
                padding-right: 70px;
            }

            header,
            main {
                max-width: 900px;
            }

            header {
                margin-bottom: 20px;
            }

            .title {
                letter-spacing: 3px;
            }

            .timer-area {
                margin-bottom: 30px;
            }

            .timer {
                font-size: clamp(120px, 14vw, 200px);
            }

            .controls {
                width: min(420px, 100%);
            }

            .circle-button {
                width: 96px;
                height: 96px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="title">STUDY TIMER</div>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span id="statusText">READY</span>
            </div>
        </header>

        <main>
            <section class="timer-area" aria-label="タイマー表示">
                <div class="timer" id="timer">00:00</div>
            </section>

            <div class="controls" aria-label="タイマー操作">
                <button class="circle-button" id="secondaryButton" type="button">Reset</button>
                <button class="circle-button primary" id="startStopButton" type="button">Start</button>
            </div>

            <section class="laps-section">
                <div class="section-header">
                    <div class="section-title">LAPS</div>
                    <div class="lap-count" id="lapCount">0</div>
                </div>
                <div class="laps" id="laps"></div>
            </section>

            <section class="study-section">
                <div class="section-header">
                    <div class="section-title"></div>
                    <div class="lap-count" id="chartRange"></div>
                </div>
                <div class="chart-wrap" id="chartWrap" aria-label="勉強時間の折れ線グラフ">
                    <div id="studyChart"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-title" id="modalTitle">勉強時間</div>
        <div class="field">
          <div class="time-picker" aria-label="勉強時間を選択">
            <div class="time-reel" id="editHours" aria-label="時間"></div>
            <div class="time-unit">時間</div>
            <div class="time-reel" id="editMinutes" aria-label="分"></div>
            <div class="time-unit">分</div>
          </div>
        </div>
        <div class="modal-buttons">
          <button class="modal-button" id="cancelEdit">キャンセル</button>
          <button class="modal-button save" id="saveEdit">保存</button>
        </div>
      </section>
    </div>

    <style>
      .modal-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:25px; }
      .modal-button { padding:14px; border:1px solid rgba(255,255,255,.16); border-radius:12px; background:linear-gradient(145deg,var(--card-glass-2),var(--card-glass-3)); color:#eee; font-size:15px; box-shadow:inset 0 1px 1px rgba(255,255,255,.12), inset 0 -1px 1px rgba(0,0,0,.08); }
      .modal-button:active { opacity:.7; transform:scale(.98); }
      .modal-button.save { background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.68)); color:#111; font-weight:600; border-color:rgba(255,255,255,.42); }
      @media(max-width:380px) { .modal { padding-left:16px; padding-right:16px; } .time-picker { gap:4px; } .time-reel { width:70px; } .time-unit { width:18px; font-size:11px; } }
      .chart-wrap { cursor:grab; }
      .chart-wrap.dragging { cursor:grabbing; }
    </style>

    <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "studyTimer_dailyStudy_v1";
      const $ = id => document.getElementById(id);
      const timerEl = $("timer"), startBtn = $("startStopButton");
      const status = $("status"), statusText = $("statusText");
      const chartWrap = $("chartWrap"), chartEl = $("studyChart"), rangeEl = $("chartRange");
      let running = false, runStartedAt = null, accumulated = 0, sessions = [], dailyAdjustments = {};

      function formatTime(totalSeconds) {
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;
        if (hrs > 0) return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }

      function updateButtons() {
        startBtn.textContent = running ? "Stop" : "Start";
        startBtn.classList.toggle("running", running);
      }

      function updateStatusText() {
        statusText.textContent = running ? "RUNNING" : "READY";
        status.classList.toggle("running", running);
      }

      function saveState() {
        const state = { running, runStartedAt, accumulated, sessions, dailyAdjustments };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed.running && typeof parsed.runStartedAt === "number") {
            runStartedAt = parsed.runStartedAt;
            running = true;
            accumulated = Number(parsed.accumulated || 0);
          } else {
            runStartedAt = null;
            running = false;
            accumulated = Number(parsed.accumulated || 0);
          }
          sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
          dailyAdjustments = parsed.dailyAdjustments || {};
        } catch (error) {
          console.warn("Failed to load timer state", error);
        }
      }

      function syncElapsed() {
        if (!running || !runStartedAt) return;
        const now = Date.now();
        const elapsed = Math.max(0, Math.floor((now - runStartedAt) / 1000));
        const display = accumulated + elapsed;
        timerEl.textContent = formatTime(display);
      }

      function startTimer() {
        if (running) return;
        running = true;
        runStartedAt = Date.now();
        updateStatusText();
        updateButtons();
        saveState();
        syncElapsed();
      }

      function stopTimer() {
        if (!running) return;
        const now = Date.now();
        accumulated += Math.max(0, Math.floor((now - runStartedAt) / 1000));
        running = false;
        runStartedAt = null;
        updateStatusText();
        updateButtons();
        saveState();
        timerEl.textContent = formatTime(accumulated);
      }

      function resetTimer() {
        if (running) stopTimer();
        accumulated = 0;
        timerEl.textContent = "00:00";
        saveState();
      }

      startBtn.addEventListener("click", () => {
        if (running) stopTimer();
        else startTimer();
      });

      document.getElementById("secondaryButton").addEventListener("click", resetTimer);

      function formatMinutes(totalMinutes) {
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return `${h}h ${m}m`;
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function getLocalDateKey(date) {
        const y = date.getFullYear();
        const m = pad2(date.getMonth() + 1);
        const d = pad2(date.getDate());
        return `${y}-${m}-${d}`;
      }

      function buildStudyData() {
        const data = {};
        const today = new Date();
        const end = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const start = new Date(end.getTime());
        start.setDate(end.getDate() - 6);

        for (let i = 0; i < 7; i++) {
          const current = new Date(start.getTime());
          current.setDate(start.getDate() + i);
          const key = getLocalDateKey(current);
          data[key] = 0;
        }

        for (const item of sessions) {
          if (item && item.date) data[item.date] = (data[item.date] || 0) + item.minutes;
        }

        for (const [dateKey, minutes] of Object.entries(dailyAdjustments || {})) {
          if (typeof minutes === "number") data[dateKey] = (data[dateKey] || 0) + minutes;
        }

        return { start, end, data };
      }

      function formatRange(start, end) {
        const startLabel = `${start.getMonth() + 1}/${start.getDate()}`;
        const endLabel = `${end.getMonth() + 1}/${end.getDate()}`;
        return `${startLabel} – ${endLabel}`;
      }

      function renderChart() {
        const { start, end, data } = buildStudyData();
        const labels = [];
        const values = [];

        for (let i = 0; i < 7; i++) {
          const current = new Date(start.getTime());
          current.setDate(start.getDate() + i);
          const key = getLocalDateKey(current);
          labels.push(`${current.getMonth() + 1}/${current.getDate()}`);
          values.push(Math.max(0, (data[key] || 0)));
        }

        const maxValue = Math.max(...values, 1);
        const points = values.map((value, index) => {
          const x = (index / (values.length - 1)) * 100;
          const y = 100 - (value / maxValue) * 100;
          return `${x},${y}`;
        }).join(" ");

        const areaPoints = `${points} 100,100 0,100`;
        const barHtml = values.map((value, index) => {
          const h = Math.max(8, (value / maxValue) * 100);
          const x = (index / values.length) * 100;
          return `<div class="chart-bar" style="left:${x}%; height:${h}%;"></div>`;
        }).join("");

        chartEl.innerHTML = `
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="study chart">
            <defs>
              <linearGradient id="lineGradient" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0%" stop-color="#d7d7d7"/>
                <stop offset="100%" stop-color="#8d8d8d"/>
              </linearGradient>
              <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="rgba(255,255,255,0.32)"/>
                <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
              </linearGradient>
            </defs>
            <g>
              ${Array.from({ length: 5 }, (_, i) => `<line x1="0" y1="${i * 25}" x2="100" y2="${i * 25}" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>`).join("")}
            </g>
            <polyline fill="none" stroke="url(#lineGradient)" stroke-width="1.7" points="${points}" stroke-linecap="round" stroke-linejoin="round"/>
            <polygon points="${areaPoints}" fill="url(#areaGradient)" opacity="0.9"/>
          </svg>
          <div class="chart-bars">${barHtml}</div>
        `;

        rangeEl.textContent = formatRange(start, end);
      }

      function collectSessions() {
        const entries = [];
        for (const key of Object.keys(localStorage)) {
          if (!key.startsWith("studyTimer_")) continue;
          try {
            const parsed = JSON.parse(localStorage.getItem(key));
            if (parsed && Array.isArray(parsed)) {
              for (const item of parsed) {
                if (item && item.date && typeof item.minutes === "number") entries.push(item);
              }
            }
          } catch (error) {}
        }
        return entries;
      }

      function handleStorageChange() {
        const entries = collectSessions();
        sessions = entries;
        renderChart();
      }

      function updateTimerDisplay() {
        timerEl.textContent = formatTime(accumulated);
        if (running && runStartedAt) syncElapsed();
      }

      function init() {
        loadState();
        renderChart();
        updateStatusText();
        updateButtons();
        updateTimerDisplay();
        setInterval(() => {
          if (running) syncElapsed();
        }, 1000);
      }

      window.addEventListener("storage", handleStorageChange);
      init();
    })();
    </script>
</body>
</html>
