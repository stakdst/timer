<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1,
    maximum-scale=1,
    user-scalable=no,
    viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./timer.png">
    <link rel="apple-touch-icon" href="./timer.png">
    <title>Study Timer</title>
    <style>
        :root {
            --glass-line: rgba(255, 255, 255, .25);
            --glass-highlight: rgba(255, 255, 255, .26);
            --glass-shadow: rgba(0, 0, 0, .22);
            --card-glass-1: rgba(255, 255, 255, .40);
            --card-glass-2: rgba(255, 255, 255, .20);
            --card-glass-3: rgba(255, 255, 255, .08);
        }

        /* ==== BASE ==== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100lvh;
            min-height: 100%;
            min-height: 100lvh;
            background: #080808;
            background: #ff0000;
            color: #f5f5f7;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Helvetica Neue",
                sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
        }

        /* ==== APP ==== */
        .app {
            width: 100%;
            height: 100dvh;
            min-height: 0;
            padding:
                max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 50% -10%,
                    #292929 0%,
                    #111 38%,
                    #080808 75%);
            overflow: hidden;
        }

        /* ==== HEADER ==== */
        header {
            width: 100%;
            max-width: 760px;
            height: 30px;
            margin:
                0 auto 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .title {
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #555;
            font-size: 11px;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
        }

        .status.running {
            color: #888;
        }

        .status.running .status-dot {
            background: #30d158;
            box-shadow:
                0 0 8px rgba(48, 209, 88, .7);
        }

        /* ==== MAIN ==== */
        main {
            width: 100%;
            max-width: 760px;
            height:
                calc(100dvh - 32px - 30px - 20px - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ==== TIMER ==== */
        .timer-area {
            width: 100%;
            text-align: center;
            margin:
                50px 0;
            flex-shrink: 0;
        }

        .timer {
            color: #f5f5f7;
            font-size:
                clamp(66px, 22vw, 165px);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -3px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .timer.long {
            font-size:
                clamp(58px, 16.5vw, 165px);
            letter-spacing: -3px;
        }

        /* ==== CONTROLS ==== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(310px, 100%);
            margin:
                0 auto 50px;
            flex-shrink: 0;
        }

        .circle-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #252527;
            color: #eeeeee;
            font-size: 15px;
            font-weight: 500;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .05),
                0 8px 30px rgba(0, 0, 0, .35);
            transition:
                transform .12s ease,
                background .2s ease,
                opacity .2s ease;
        }

        .circle-button:active {
            transform: scale(.93);
        }

        .circle-button.primary {
            background: #b8b8ba;
            color: #111;
        }

        .circle-button.primary.running {
            background: #9f3430;
            color: #fff;
        }

        /* ==== LAP SECTION ==== */
        main>section:last-child {
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 1;
        }

        /* ==== LAP HEADER ==== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding:
                0 5px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .section-title {
            color: #777;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .lap-count {
            color: #555;
            font-size: 12px;
        }

        /* ==== LAP LIST ==== */
        .laps {
            border-top:
                1px solid #242424;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: none;
            flex: 1;
        }

        .laps::-webkit-scrollbar {
            display: none;
        }

        /* ==== 2段階左スワイプ用 ==== */
        .row {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-bottom:
                1px solid #202020;
        }

        .row .item {
            position: relative;
            z-index: 1;
            width: 100%;
            background: #080808;
            touch-action: pan-y;
            will-change: transform;
        }

        .row.removing .item {
            transition:
                transform .24s cubic-bezier(.2, .9, .25, 1),
                opacity .24s ease;
        }

        /* ==== 削除背景 ==== */
        .row-bg {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--delete-width, 0px);
            border-radius:
                0 8px 8px 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 0;
            opacity: 0;
            transition:
                opacity .16s,
                background .2s;
            cursor: pointer;
            z-index: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .row.swiping .row-bg,
        .row.open .row-bg {
            opacity: 1;
            background:
                rgba(255, 60, 105, .62);
        }

        .row.armed .row-bg {
            background:
                rgba(255, 60, 105, .62);
        }

        .row-bg .trash {
            width: 26px;
            height: 26px;
            opacity: .96;
            transition:
                transform .18s cubic-bezier(.2, .9, .25, 1);
            pointer-events: none;
        }

        .row.armed .row-bg .trash {
            transform: scale(1.22);
        }

        /* ==== LAP ==== */
        .lap {
            display: grid;
            grid-template-columns:
                1fr auto;
            align-items: center;
            min-height: 0;
            padding:
                12px 5px;
            border-bottom: none;
            cursor: pointer;
            transition:
                background .15s ease;
        }

        .lap:active {
            background: #181818;
        }

        .lap-day {
            display: flex;
            align-items: center;
            min-width: 0;
            color: #ddd;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        .lap-number {
            width: 48px;
            color: #555;
            font-size: 10px;
            flex-shrink: 0;
        }

        .lap-time {
            color: #eee;
            font-size: 16px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .empty {
            padding:
                42px 0;
            color: #555;
            font-size: 13px;
            text-align: center;
        }

        /* ==== MODAL ==== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-top: 20px;
            background: rgba(0,0,0,.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: min(520px, 100%);
            padding:
                22px 22px max(25px, env(safe-area-inset-bottom));
            border: 1px solid var(--glass-line);
            border-bottom: 0;
            border-radius:
                24px 24px 0 0;
            background: linear-gradient(155deg, rgba(100,100,104,.94), rgba(38,38,41,.97) 42%, rgba(22,22,24,.99));
            transform: translateY(100%);
            transition: transform .24s cubic-bezier(.2,.9,.25,1);
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(0, 0, 0, .08),
                0 -15px 50px var(--glass-shadow);
        }

        .modal-overlay.show .modal { transform: translateY(0); }

        .modal-title {
            margin-bottom: 25px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #888;
            font-size: 11px;
            letter-spacing: .7px;
        }

        input {
            width: 100%;
            padding:
                13px 14px;
            border: none;
            outline: none;
            border-radius: 11px;
            background: #2c2c2e;
            color: #fff;
            font-size: 16px;
        }

        /* ==== REEL PICKER ==== */
        .time-picker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 150px;
            overflow: hidden;
            --reel-item-height: 50px;
            touch-action: pan-x;
            user-select: none;
            -webkit-user-select: none;
        }

        .time-picker::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 49px;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(rgba(39,39,41,.96), transparent);
        }
        .time-picker::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 50px;
            transform: translateY(-50%);
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
            pointer-events: none;
            border-radius: 10px;
        }

        .time-reel {
            position: relative;
            width: 82px;
            height: 150px;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-top: 50px;
            padding-bottom: 50px;
            overscroll-behavior: contain;
            border-radius: 11px;
            user-select: none;
            -webkit-user-select: none;
            will-change: scroll-position;
            -webkit-tap-highlight-color: transparent;
        }

        .time-reel::-webkit-scrollbar {
            display: none;
        }

        .time-reel-item {
            width: 100%;
            height: 50px;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 22px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            transition:
                color .12s ease,
                transform .12s ease,
                opacity .12s ease;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .time-reel-item.selected {
            color: #fff;
            font-weight: 500;
            transform: scale(1.08);
        }

        .time-unit {
            flex-shrink: 0;
            width: 24px;
            color: #777;
            font-size: 12px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==== REST OF MODAL ==== */
        .info {
            margin-top: 5px;
            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-button {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 12px;
            background:
                linear-gradient(145deg,
                    var(--card-glass-2),
                    var(--card-glass-3));
            color: #eee;
            font-size: 15px;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, .12),
                inset 0 -1px 1px rgba(0, 0, 0, .08);
        }

        .modal-button:active {
            opacity: .7;
        }

        .modal-button.save {
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, .82),
                    rgba(255, 255, 255, .62));
            color: #111;
            font-weight: 600;
            border-color: rgba(255, 255, 255, .42);
        }

        /* ==== CONFIRM MODAL ==== */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(0, 0, 0, .55);
            z-index: 200;
        }

        .confirm-overlay.show {
            display: flex;
        }

        .confirm-box {
            width: min(320px, 100%);
            overflow: hidden;
            border: 1px solid var(--glass-line);
            border-radius: 18px;
            box-shadow:
                inset 0 1px 1px var(--glass-highlight),
                inset 0 -1px 1px rgba(0, 0, 0, .08),
                0 15px 50px var(--glass-shadow);
            animation:
                confirmAppear .18s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        @keyframes confirmAppear {
            from {
                transform: scale(.94);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .confirm-content {
            padding:
                22px 20px 20px;
            text-align: center;
        }

        .confirm-title {
            margin-bottom: 7px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .confirm-message {
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
        }

        .confirm-buttons {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            border-top:
                1px solid rgba(255, 255, 255, .16);
            background: rgba(255, 255, 255, .035);
        }

        .confirm-button {
            min-height: 44px;
            padding: 0;
            border-radius: 0;
            background: transparent;
            color: #0a84ff;
            font-size: 17px;
            font-weight: 500;
        }

        .confirm-button+.confirm-button {
            border-left:
                1px solid rgba(255, 255, 255, .16);
        }

        .confirm-button:active {
            background: #3a3a3c;
        }

        .confirm-button.danger {
            color: #ff453a;
        }

        /* ==== iPAD / LANDSCAPE ==== */
        @media (min-width: 600px) {
            .app {
                padding:
                    max(32px, env(safe-area-inset-top)) 48px max(32px, env(safe-area-inset-bottom)) 48px;
            }

            header,
            main {
                max-width: 900px;
            }

            header {
                margin-bottom: 25px;
            }

            main {
                height:
                    calc(100dvh - 32px - 30px - 25px - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns:
                    minmax(90px, 1fr) minmax(360px, 650px) minmax(90px, 1fr);
                grid-template-rows:
                    auto minmax(0, 1fr);
                column-gap: 30px;
                align-items: start;
            }

            .title {
                font-size: 15px;
                letter-spacing: 2.5px;
            }

            .status {
                font-size: 12px;
            }

            .timer-area {
                grid-column: 1 / 4;
                grid-row: 1;
                margin:
                    20px 0 45px;
                padding: 0;
            }

            .timer {
                font-size:
                    clamp(110px, 18vw, 190px);
                letter-spacing: -5px;
            }

            .timer.long {
                font-size:
                    clamp(110px, 18vw, 190px);
            }

            .controls {
                grid-column: 1 / 4;
                grid-row: 2;
                display: grid;
                grid-template-columns:
                    minmax(90px, 1fr) minmax(360px, 650px) minmax(90px, 1fr);
                column-gap: 30px;
                align-items: start;
                justify-content: initial;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                pointer-events: none;
                z-index: 2;
            }

            #secondaryButton {
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
                margin: 0;
                pointer-events: auto;
            }

            #startStopButton {
                grid-column: 3;
                grid-row: 1;
                justify-self: end;
                margin: 0;
                pointer-events: auto;
            }

            .circle-button {
                width: 90px;
                height: 90px;
                font-size: 15px;
            }

            main>section:last-child {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
                height: 100%;
                min-height: 0;
                z-index: 1;
            }

            .section-header {
                padding:
                    0 8px;
                margin-bottom: 10px;
            }

            .section-title {
                font-size: 13px;
            }

            .lap-count {
                font-size: 13px;
            }

            .lap {
                padding:
                    12px 8px;
            }

            .lap-day {
                font-size: 16px;
            }

            .lap-number {
                width: 65px;
                font-size: 10px;
            }

            .lap-time {
                font-size: 17px;
            }
        }

        /* ==== iPHONE LANDSCAPE ==== */
        @media (orientation: landscape) and (max-width: 599px) {
            .app {
                padding:
                    max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            }

            header {
                height: 20px;
                margin:
                    0 auto;
                max-width: 900px;
            }

            .title {
                font-size: 11px;
                letter-spacing: 1.8px;
            }

            .status {
                font-size: 9px;
                gap: 5px;
                letter-spacing: 1px;
            }

            .status-dot {
                width: 5px;
                height: 5px;
            }

            main {
                width: 100%;
                max-width: 900px;
                height:
                    calc(100dvh - 10px - 22px - 8px - 10px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns:
                    minmax(72px, 1fr) minmax(250px, 520px) minmax(72px, 1fr);
                grid-template-rows:
                    auto minmax(0, 1fr);
                column-gap: 16px;
                align-items: start;
            }

            .timer-area {
                grid-column: 1 / 4;
                grid-row: 1;
                margin: 0;
                padding: 0;
            }

            .timer {
                font-size:
                    clamp(52px, 12vw, 85px);
                line-height: .92;
                letter-spacing: -3px;
            }

            .timer.long {
                font-size:
                    clamp(52px, 12vw, 85px);
                letter-spacing: -3px;
            }

            .controls {
                grid-column: 1 / 4;
                grid-row: 2;
                display: grid;
                grid-template-columns:
                    minmax(72px, 1fr) minmax(250px, 520px) minmax(72px, 1fr);
                column-gap: 16px;
                align-items: start;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                pointer-events: none;
                z-index: 2;
            }

            #secondaryButton {
                grid-column: 1;
                grid-row: 1;
                justify-self: start;
                margin: 0;
                pointer-events: auto;
            }

            #startStopButton {
                grid-column: 3;
                grid-row: 1;
                justify-self: end;
                margin: 0;
                pointer-events: auto;
            }

            .circle-button {
                width: 75px;
                height: 75px;
                font-size: 13px;
            }

            main>section:last-child {
                grid-column: 2;
                grid-row: 2;
                width: 100%;
                height: 100%;
                min-height: 0;
                display: flex;
                flex-direction: column;
                z-index: 1;
            }

            .section-header {
                padding:
                    0 5px;
                margin-bottom: 6px;
            }

            .section-title {
                font-size: 10px;
                letter-spacing: 1.8px;
            }

            .lap-count {
                font-size: 10px;
            }

            .laps {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            .lap {
                padding:
                    7px 5px;
            }

            .lap-day {
                font-size: 12px;
            }

            .lap-number {
                width: 48px;
                font-size: 8px;
            }

            .lap-time {
                font-size: 13px;
            }

            .empty {
                padding:
                    20px 0;
                font-size: 10px;
            }
        }

        /* ==== iPAD LANDSCAPE / LARGE TABLET ==== */
        @media (min-width: 900px) {
            .app {
                padding-left: 70px;
                padding-right: 70px;
            }

            header,
            main {
                max-width: 1100px;
            }

            header {
                margin-bottom: 25px;
            }

            main {
                grid-template-columns:
                    minmax(140px, 1fr) minmax(450px, 700px) minmax(140px, 1fr);
                column-gap: 40px;
            }

            .timer-area {
                margin:
                    20px 0 45px;
            }

            .timer {
                font-size:
                    clamp(130px, 13vw, 230px);
                letter-spacing: -6px;
            }

            .timer.long {
                font-size:
                    clamp(130px, 13vw, 230px);
            }

            .controls {
                grid-template-columns:
                    minmax(140px, 1fr) minmax(450px, 700px) minmax(140px, 1fr);

<body>

      </section>
    </div>
    
    <style>
      .modal-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:25px; }
      .modal-button { padding:14px; border:1px solid rgba(255,255,255,.16); border-radius:12px; background:linear-gradient(145deg,var(--card-glass-2),var(--card-glass-3)); color:#eee; font-size:15px; box-shadow:inset 0 1px 1px rgba(255,255,255,.12), inset 0 -1px 1px rgba(0,0,0,.08); }
      .modal-button:active { opacity:.7; transform:scale(.98); }
      .modal-button.save { background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.68)); color:#111; font-weight:600; border-color:rgba(255,255,255,.42); }
      @media(max-width:380px) { .modal { padding-left:16px; padding-right:16px; } .time-picker { gap:4px; } .time-reel { width:70px; } .time-unit { width:18px; font-size:11px; } }
      .chart-wrap { cursor:grab; }
      .chart-wrap.dragging { cursor:grabbing; }
    </style>
    <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "studyTimer_dailyStudy_v1";
      const $ = id => document.getElementById(id);
      const timerEl = $("timer"), startBtn = $("startStopButton");
      const status = $("status"), statusText = $("statusText");
      const chartWrap = $("chartWrap"), chartEl = $("studyChart"), rangeEl = $("chartRange");
      let running = false, runStartedAt = null, accumulated = 0, sessions = [], dailyAdjustments = {};
      // viewPos: 0 = 今日が右端 / 負 = 過去（小数も取る＝指に追従して連続的に動く）
      let viewPos = 0, raf = null, lastStudyDay = null;
      let editingDay = null;
      let sessionTotals = null, lastChartAt = 0, chartDirty = true, chartW = 360, chartH = 260;
      let anim = null, drag = null, suppressClick = false, renderQueued = false, rangeText = "", wheelTimer = null;
      const CH_L = 36, CH_R = 12;
      const overlay = $("modalOverlay"), modalTitle = $("modalTitle");
      const reels = {};
      const DAY = 86400000;
      function load() {
        sessionTotals = null;
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          sessions = Array.isArray(data.sessions) ? data.sessions.filter(s =>
            s && Number.isFinite(Number(s.start)) && Number.isFinite(Number(s.end)) && Number(s.end) > Number(s.start)
          ).map(s => ({start:Number(s.start), end:Number(s.end)})) : [];
          dailyAdjustments = data.dailyAdjustments && typeof data.dailyAdjustments === "object" ? data.dailyAdjustments : {};
          running = Boolean(data.running);
          runStartedAt = running && Number.isFinite(Number(data.runStartedAt)) ? Number(data.runStartedAt) : null;
          accumulated = Math.max(0, Number(data.accumulated) || 0);
          if (running && runStartedAt === null) running = false;
        } catch (_) { sessions = []; dailyAdjustments = {}; running = false; runStartedAt = null; accumulated = 0; }
      }
      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({sessions, dailyAdjustments, running, runStartedAt, accumulated})); }
        catch (e) { console.warn("勉強時間を保存できませんでした。", e); }
      }
      function elapsed(now=Date.now()) { return accumulated + (running && runStartedAt !== null ? Math.max(0, now-runStartedAt) : 0); }
      function pushSession(start, end) { sessions.push({start, end}); sessionTotals = null; }
      // 4:00をまたいだら、そこまでの実行区間を保存して表示タイマーだけを0にする。
      // running は true のまま維持するため、計測は止まらない。
      function handleDayBoundaries(now=Date.now()) {
        if (!running || runStartedAt === null) return false;
        let changed = false;
        let boundary = studyDayStart(runStartedAt) + DAY;
        while (boundary <= now) {
          if (boundary > runStartedAt) pushSession(runStartedAt, boundary);
          accumulated = 0;
          runStartedAt = boundary;
          boundary = studyDayStart(runStartedAt) + DAY;
          changed = true;
        }
        if (changed) {
          // 4:00を越えたら、グラフを最新の日付が右端に来る表示へ戻す。
          viewPos = 0;
        }
        return changed;
      }
      function fmt(ms) {
        const sec = Math.floor(Math.max(0,ms)/1000), h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
        return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(Math.floor(ms%1000/10)).padStart(2,"0")}` : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(Math.floor(ms%1000/10)).padStart(2,"0")}`;
      }
      // Study-day boundary is 04:00 local time. An interval crossing 04:00 is split automatically.
      function studyDayStart(timestamp) {
        const d = new Date(timestamp);
        d.setHours(4,0,0,0);
        if (timestamp < d.getTime()) d.setDate(d.getDate()-1);
        return d.getTime();
      }
      function addInterval(totals, start, end) {
        let cursor = start;
        while (cursor < end) {
          const dayStart = studyDayStart(cursor);
          const boundary = studyDayStart(dayStart + 36*3600000);
          const segmentEnd = Math.min(end, boundary);
          totals.set(dayStart, (totals.get(dayStart) || 0) + (segmentEnd - cursor));
          cursor = segmentEnd;
        }
      }
      // 完了済みセッションの集計はキャッシュし、毎フレームの再計算を避ける。
      function dailyTotals(now=Date.now()) {
        if (!sessionTotals) {
          sessionTotals = new Map();
          for (const s of sessions) addInterval(sessionTotals, s.start, s.end);
        }
        const totals = new Map(sessionTotals);
        if (running && runStartedAt !== null && now > runStartedAt) addInterval(totals, runStartedAt, now);
        for (const [day, adjustment] of Object.entries(dailyAdjustments)) {
          const value = Number(adjustment);
          if (Number.isFinite(value) && value !== 0) totals.set(Number(day), (totals.get(Number(day)) || 0) + value);
        }
        for (const [day, value] of totals) totals.set(day, Math.max(0, value));
        return totals;
      }
      function dateLabel(ts, withYear=false) {
        const d=new Date(ts);
        return withYear ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}` : `${d.getMonth()+1}/${d.getDate()}`;
      }
      function hoursLabel(ms) {
        const mins=Math.floor(ms/60000), h=Math.floor(mins/60), m=mins%60;
        return h ? `${h}時間${m}分` : `${m}分`;
      }
      const stepPx = () => (chartW - CH_L - CH_R) / 6;
      const chartBusy = () => drag !== null || anim !== null;
      // viewPos（小数）に応じて、1日分の余白を含めて描画する。左右はclipPathで切り取る。
      function renderChart(now=Date.now()) {
        if (chartDirty) {
          chartW=Math.max(300,chartWrap.clientWidth||360);
          chartH=Math.max(190,chartWrap.clientHeight||260);
          chartDirty=false;
        }
        const totals=dailyTotals(now), today=studyDayStart(now);
        const W=chartW, H=chartH, left=CH_L, right=CH_R, top=20, bottom=30, pw=W-left-right, ph=H-top-bottom, step=pw/6;
        const dayKey=d=>studyDayStart(today+d*DAY+DAY/2);
        const y=v=>+(top+ph-(Math.max(0,Math.min(17,v))/17)*ph).toFixed(2);
        const x=d=>+(left+pw+(d-viewPos)*step).toFixed(2);
        const snapped=Math.min(0,Math.round(viewPos));
        const text=`${dateLabel(dayKey(snapped-6))} – ${dateLabel(dayKey(snapped))}`;
        if(text!==rangeText){ rangeText=text; rangeEl.textContent=text; }
        const ds=[];
        for(let d=Math.floor(viewPos)-7; d<=Math.min(0,Math.ceil(viewPos)+1); d++) ds.push(d);
        const keys=ds.map(dayKey), vals=keys.map(k=>(totals.get(k)||0)/3600000);
        let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの勉強時間。縦軸は0から17時間"><defs><clipPath id="chartClip"><rect x="${left-8}" y="0" width="${pw+16}" height="${H}"/></clipPath></defs>`;
        for(let h=0;h<=16;h+=2){
          svg+=`<line class="chart-grid" x1="${left}" y1="${y(h)}" x2="${W-right}" y2="${y(h)}"/>`;
          svg+=`<text class="chart-label" x="${left-9}" y="${y(h)+3}" text-anchor="end">${h}h</text>`;
        }
        svg+=`<line class="chart-grid" x1="${left}" y1="${y(17)}" x2="${W-right}" y2="${y(17)}"/>`;
        svg+=`<text class="chart-label" x="${left-9}" y="${y(17)+3}" text-anchor="end">17h</text>`;
        const pts=ds.map((d,i)=>`${x(d)},${y(vals[i])}`).join(" ");
        svg+=`<g clip-path="url(#chartClip)">`;
        svg+=`<polygon class="chart-area" points="${x(ds[0])},${y(0)} ${pts} ${x(ds[ds.length-1])},${y(0)}"/>`;
        svg+=`<polyline class="chart-line" points="${pts}"/>`;
        ds.forEach((d,i)=>{
          const v=vals[i], cx=x(d), cy=y(v), dt=new Date(keys[i]);
          svg+=`<circle class="chart-point" data-day="${keys[i]}" tabindex="0" role="button" aria-label="${dateLabel(keys[i],true)}の勉強時間を編集。現在 ${hoursLabel(v*3600000)}" cx="${cx}" cy="${cy}" r="6" style="cursor:pointer;stroke:#f5f5f7;stroke-width:2;pointer-events:all"/>`;
          if(v>0) svg+=`<text class="chart-value" x="${cx}" y="${Math.max(11,cy-9)}">${hoursLabel(v*3600000)}</text>`;
          svg+=`<text class="chart-label" x="${cx}" y="${H-9}" text-anchor="middle">${dt.getMonth()+1}/${dt.getDate()}</text>`;
        });
        chartEl.innerHTML=svg+"</g></svg>";
      }
      function setupReel(id, max) {
        const reel = $(id), fragment = document.createDocumentFragment();
        for (let i=0;i<=max;i++) {
          const item=document.createElement("div");
          item.className="time-reel-item"; item.textContent=String(i).padStart(2,"0"); item.dataset.value=i;
          item.addEventListener("click",()=>reel.scrollTo({top:i*50,behavior:"smooth"}));
          fragment.appendChild(item);
        }
        reel.appendChild(fragment); reels[id]=reel;
        reel.addEventListener("scroll",()=>{
          const v=Math.max(0,Math.min(max,Math.round(reel.scrollTop/50)));
          reel.querySelectorAll(".time-reel-item").forEach((item,i)=>item.classList.toggle("selected",i===v));
        },{passive:true});
      }
      setupReel("editHours", 23); setupReel("editMinutes", 59);
      function setReelValue(id, value) {
        const reel=reels[id];
        reel.scrollTop=Math.max(0,Math.min(Number(reel.lastElementChild.dataset.value),Math.round(value)))*50;
        reel.querySelectorAll(".time-reel-item").forEach((item,i)=>item.classList.toggle("selected",i===Math.round(reel.scrollTop/50)));
      }
      function openEditor(dayStart) {
        editingDay=dayStart;
        const totals=dailyTotals(Date.now()), current=Math.max(0,totals.get(dayStart)||0);
        modalTitle.textContent=`${dateLabel(dayStart,true)}の勉強時間`;
        setReelValue("editHours",Math.floor(current/3600000));
        setReelValue("editMinutes",Math.floor(current%3600000/60000));
        overlay.classList.add("show"); overlay.setAttribute("aria-hidden","false");
      }
      function closeEditor() { overlay.classList.remove("show"); overlay.setAttribute("aria-hidden","true"); editingDay=null; }
      $("cancelEdit").addEventListener("click",closeEditor);
      overlay.addEventListener("click",e=>{if(e.target===overlay)closeEditor();});
      document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editingDay!==null)closeEditor();});
      $("saveEdit").addEventListener("click",()=>{
        if(editingDay===null)return;
        const dayStart=editingDay, totals=dailyTotals(Date.now());
        const current=Math.max(0,totals.get(dayStart)||0);
        const hours=Math.round(reels.editHours.scrollTop/50), minutes=Math.round(reels.editMinutes.scrollTop/50);
        const desired=(hours*60+minutes)*60000, delta=desired-current;
        dailyAdjustments[String(dayStart)]=(Number(dailyAdjustments[String(dayStart)])||0)+delta;
        if(dayStart===studyDayStart(Date.now()) && delta!==0) {
          if(running) {
            if(delta>=0) accumulated+=delta;
            else {
              let reduction=-delta;
              const fromAccumulated=Math.min(accumulated,reduction);
              accumulated-=fromAccumulated; reduction-=fromAccumulated;
              if(reduction>0 && runStartedAt!==null) runStartedAt+=reduction;
            }
          } else accumulated=Math.max(0,accumulated+delta);
        }
        save(); closeEditor(); updateTimer(true);
      });
      chartEl.addEventListener("click", e => {
        const point = e.target.closest(".chart-point");
        if (point && !suppressClick) openEditor(Number(point.dataset.day));
      });
      chartEl.addEventListener("keydown", e => {
        if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("chart-point")) {
          e.preventDefault(); openEditor(Number(e.target.dataset.day));
        }
      });
      function updateTimer(force) {
        const now = Date.now();
        const currentStudyDay = studyDayStart(now);
        if (lastStudyDay !== null && currentStudyDay !== lastStudyDay) {
          // タイマー停止中でも、午前4:00の日付切り替わりで最新日を右端に表示。
          viewPos = 0; force = true;
        }
        lastStudyDay = currentStudyDay;
        if (handleDayBoundaries(now)) { save(); force = true; }
        const ms=elapsed(now);
        timerEl.textContent=fmt(ms);
        timerEl.classList.toggle("long",ms>=3600000);
        startBtn.textContent=running?"停止":"開始";
        startBtn.classList.toggle("running",running);
        status.classList.toggle("running",running);
        statusText.textContent=running?"STUDYING":"READY";
        // グラフは毎フレーム作り直さない（計測中は1秒ごと、操作中はスクロール側が描画する）。
        if (!chartBusy() && (force || !running || now - lastChartAt >= 1000)) { renderChart(now); lastChartAt = now; }
      }
      function tick() {
        updateTimer();
        if(running) raf=requestAnimationFrame(tick);
      }
      function start() {
        if(running) return;
        running=true;
        runStartedAt=Date.now();
        save();
        if(raf!==null) cancelAnimationFrame(raf);
        tick();
      }
      function stop() {
        if(!running) return;
        const now=Date.now();
        handleDayBoundaries(now);
        if(runStartedAt!==null && now>runStartedAt) {
          pushSession(runStartedAt,now);
          accumulated += now-runStartedAt;
        }
        running=false;
        runStartedAt=null;
        if(raf!==null) cancelAnimationFrame(raf); raf=null;
        save(); updateTimer(true);
      }
      startBtn.addEventListener("click",()=>running?stop():start());

      // ==== グラフのスクロール：指に追従 → 離すと慣性で最寄りの日にスナップ ====
      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => { renderQueued = false; renderChart(); });
      }
      function stopAnim() { if (anim !== null) { cancelAnimationFrame(anim); anim = null; } }
      function animateTo(target) {
        stopAnim();
        const from = viewPos, dist = target - from;
        if (Math.abs(dist) < 0.001) { viewPos = target; renderChart(); return; }
        const dur = Math.min(650, 240 + Math.abs(dist) * 40), t0 = performance.now();
        const frame = t => {
          const p = Math.min(1, Math.max(0, (t - t0) / dur));
          viewPos = p < 1 ? from + dist * (1 - Math.pow(1 - p, 3)) : target;
          if (p >= 1) anim = null;
          renderChart();
          if (p < 1) anim = requestAnimationFrame(frame);
        };
        anim = requestAnimationFrame(frame);
      }
      chartWrap.addEventListener("pointerdown", e => {
        if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
        stopAnim();
        suppressClick = false;
        drag = {id:e.pointerId, x0:e.clientX, pos0:viewPos, lastX:e.clientX, lastT:e.timeStamp, vel:0, moved:false};
      });
      chartWrap.addEventListener("pointermove", e => {
        if (!drag || e.pointerId !== drag.id) return;
        if (!drag.moved) {
          if (Math.abs(e.clientX - drag.x0) < 5) return;
          // 閾値を超えた位置を基準にし直して、ドラッグ開始時のカクつきを防ぐ。
          drag.moved = true; suppressClick = true;
          drag.x0 = drag.lastX = e.clientX; drag.pos0 = viewPos; drag.lastT = e.timeStamp;
          try { chartWrap.setPointerCapture(e.pointerId); } catch (_) {}
          chartWrap.classList.add("dragging");
          return;
        }
        const dt = e.timeStamp - drag.lastT;
        if (dt > 0) {
          drag.vel += ((e.clientX - drag.lastX) / dt - drag.vel) * Math.min(1, dt / 40);
          drag.lastX = e.clientX; drag.lastT = e.timeStamp;
        }
        const raw = drag.pos0 - (e.clientX - drag.x0) / stepPx();
        viewPos = raw > 0 ? raw * 0.3 : raw;   // 今日より先は抵抗をかける
        scheduleRender();
      });
      function endDrag(e) {
        if (!drag || e.pointerId !== drag.id) return;
        const d = drag; drag = null;
        chartWrap.classList.remove("dragging");
        try { chartWrap.releasePointerCapture(d.id); } catch (_) {}
        if (!d.moved) {
          if (Math.abs(viewPos - Math.round(viewPos)) > 0.001) animateTo(Math.round(viewPos));
          return;
        }
        const v = (e.timeStamp - d.lastT) > 80 ? 0 : d.vel;   // 止めてから離したら慣性なし
        const delta = Math.max(-14, Math.min(14, -v * 120 / stepPx()));
        animateTo(Math.min(0, Math.round(viewPos + delta)));
      }
      chartWrap.addEventListener("pointerup", endDrag);
      chartWrap.addEventListener("pointercancel", endDrag);
      // トラックパッド／横ホイール：連続的に動かし、止まったらスナップ
      chartWrap.addEventListener("wheel", e => {
        if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
        e.preventDefault();
        stopAnim();
        viewPos = Math.min(0, viewPos + e.deltaX / stepPx());
        scheduleRender();
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => animateTo(Math.min(0, Math.round(viewPos))), 140);
      }, {passive:false});

      document.addEventListener("visibilitychange",()=>{if(document.hidden){if(raf!==null)cancelAnimationFrame(raf);raf=null;save();}else if(running){tick();}else updateTimer();});
      window.addEventListener("pagehide",save);
      window.addEventListener("resize",()=>{chartDirty=true;renderChart();});
      load(); updateTimer();
    })();
    </script>
</body>
